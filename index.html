                )}
                <button aria-label="Reset"
                  onClick={()=>{ setAdjResult(null); setCardDecisions({}); }}
                  style={{background:"none",border:"none",color:T.textTer,
                    fontSize:11,cursor:"pointer",padding:"4px 8px"}}>
                  Reset
                </button>
              </div>
            </div>

            {/* Deload banner */}
            {isDeload&&(
              <div style={{
                background:`${T.red}12`,border:`1px solid ${T.red}40`,
                borderRadius:12,padding:"10px 13px",marginBottom:14,
                animation:"diffCardIn 0.4s cubic-bezier(0.22,1,0.36,1) both",
              }}>
                <div style={{fontSize:12,fontWeight:700,color:T.red,marginBottom:2}}>
                  Systemic fatigue detected
                </div>
                <div style={{fontSize:11,color:T.textSec,lineHeight:1.5}}>
                  3+ muscle groups above 80% fatigue threshold. All exercises reduced to 70% volume and 85% load. Deload applies as a single unit.
                </div>
              </div>
            )}

            {/* Muscle map */}
            <AffectedMuscleMap changes={changes} liveState={liveState}/>

            {/* Diff cards */}
            {changes.length===0?(
              <Card style={{textAlign:"center",padding:"28px 20px"}}>
                <div style={{fontSize:13,fontWeight:600,color:T.textSec,marginBottom:4}}>
                  Program is optimal
                </div>
                <div style={{fontSize:12,color:T.textTer}}>
                  No adjustments needed — all muscle metrics within optimal ranges.
                </div>
              </Card>
            ):(
              changes.map((c,i)=>(
                <DiffCard
                  key={i}
                  change={c}
                  index={i}
                  decision={cardDecisions[i]}
                  isDeload={isDeload}
                  onKeep={()=>setCardDecisions(prev=>({...prev,[i]:"kept"}))}
                  onReject={()=>setCardDecisions(prev=>({...prev,[i]:"rejected"}))}
                  onUndo={()=>setCardDecisions(prev=>{
                    const next={...prev}; delete next[i]; return next;
                  })}
                />
              ))
            )}

            {/* Sticky confirm bar */}
            {(changes.length>0||isDeload)&&(
              <div style={{
                position:"sticky",bottom:0,
                background:`${T.bg}f2`,backdropFilter:"blur(18px)",
                WebkitBackdropFilter:"blur(18px)",
                borderTop:`1px solid ${T.border}`,
                padding:"12px 0 6px",marginTop:12,
              }}>
                <div style={{textAlign:"center",fontSize:10,color:T.textTer,marginBottom:8}}>
                  {isDeload
                    ? "Applies to all exercises this week"
                    : keptCount===0
                      ? undecidedCount>0
                        ? `${undecidedCount} change${undecidedCount!==1?"s":""} awaiting your decision`
                        : "All changes skipped — nothing will be applied"
                      : `${keptCount} change${keptCount!==1?"s":""} will be applied`}
                </div>
                <div style={{display:"flex",gap:8}}>
                  <Btn variant="ghost" style={{flex:1,fontSize:11}}
                    onClick={()=>{ setAdjResult(null); setCardDecisions({}); }}>
                    Cancel

                    style={{

                    {isDeload
                      ? "Apply deload week"
                      : keptCount===0
                        ? "Keep changes to apply"
                        : `Apply ${keptCount} change${keptCount!==1?"s":""}`}
                  </Btn>
                </div>
              </div>
            )}
          </div>
        );
      })()}

    </div>
  );
}

              ?<Badge color={planColor}>{tier==="trial"?"Trial":"Premium"}</Badge>
              :<Badge color={T.textSec}>Free</Badge>}
          </div>
        </div>
      </div>

      {/* ══ COACH INTEGRATION ══════════════════════════════════════ */}
      {user?.clientId&&(()=>{
        function copyId(){
          const id = user.clientId;
          if(navigator.clipboard && navigator.clipboard.writeText){
            navigator.clipboard.writeText(id)
              .then(()=>{ setCopied(true); setTimeout(()=>setCopied(false),2000); })
              .catch(()=>fallbackCopy(id));
          } else { fallbackCopy(id); }
        }
        function fallbackCopy(text){
          const el=document.createElement("textarea");
          el.value=text;
          el.style.cssText="position:fixed;top:-9999px;left:-9999px;opacity:0;";
          document.body.appendChild(el);
          el.focus(); el.select();
          try{
            document.execCommand("copy");
            setCopied(true);
            setTimeout(()=>setCopied(false),2000);
          }catch(e){}
          document.body.removeChild(el);
        }
        return(
          <>
            <SectionHeader label="Coach integration" style={{marginTop:0}}/>
            <Card style={{marginBottom:8,border:`1px solid ${T.teal}40`,
              background:`${T.teal}06`}}>
              {/* Client ID */}
              <div style={{fontSize:11,color:T.teal,marginBottom:10,
                textTransform:"uppercase",letterSpacing:"0.08em",fontWeight:700}}>

                    border:`1px solid ${copied?T.success:T.border}`,
                    color:copied?T.success:T.textSec,
                    fontSize:11,cursor:"pointer",padding:"0 14px",
                    fontFamily:"inherit",fontWeight:700,
                    transition:"all 0.18s ease",minWidth:64}}>
                  {copied?"Copied":"Copy"}
                </button>
              </div>
              <div style={{fontSize:12,color:T.textSec,lineHeight:1.5,marginBottom:16}}>

              {/* Coach sharing toggle — same card, visually separated */}

                  alignItems:"center"}}>
                  <div>
                    <div style={{fontSize:12,fontWeight:600,marginBottom:2}}>
                      Coach sharing

                    <div style={{fontSize:11,color:T.textSec}}>

                        ?"Coaches with your ID can view your data"
                        :"Hidden from coaches"}

                  </div>
                  <button
                    role="switch"
                    aria-label="Toggle coach data sharing"
                    aria-checked={prefs?.coachConsent!==false}
                    onClick={()=>onPrefsChange?.({...prefs,
                      coachConsent:prefs?.coachConsent===false?true:false})}
                    style={{width:48,height:28,borderRadius:12,cursor:"pointer",
                      border:"none",
                      background:prefs?.coachConsent!==false?T.teal:T.border,
                      position:"relative",transition:"background 0.2s",flexShrink:0}}>
                    <span style={{
                      position:"absolute",top:3,

            </Card>
          </>

      })()}

      {/* ══ TRAINING ══════════════════════════════════════════════ */}
      <SectionHeader label="Training"/>

      {/* Training mode */}

          textTransform:"uppercase",letterSpacing:"0.08em"}}>Goal</div>
        <div style={{display:"flex",gap:8}}>
          {["Hypertrophy","Strength"].map(m=>(
            <button key={m} onClick={()=>setMode(m)}

                border:`1px solid ${mode===m?T.accent:T.border}`,
                background:mode===m?`${T.accent}18`:T.bgRaise,
                color:mode===m?T.accent:T.textSec,
                fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>

      {/* Weight & units */}

            onBlur={e=>e.target.style.borderColor=T.border}/>
        </div>
        {/* Bodyweight */}
        <div style={{fontSize:11,color:T.textTer,marginBottom:6}}>
          Bodyweight ({units}) — used for relative strength targets
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <input type="number"

        </div>
        {prefs?.bodyweight&&(

            background:`${T.accent}10`,borderRadius:8,border:`1px solid ${T.accent}25`}}>
            <div style={{fontSize:11,fontWeight:600,color:T.accent,marginBottom:3}}>
              AI Coach context
            </div>

              At {prefs.bodyweight} {units}, relative strength targets adjust automatically.

          </div>
        )}
      </Card>

      {/* ══ APPEARANCE ════════════════════════════════════════════ */}
      <SectionHeader label="Appearance"/>
      <Card style={{marginBottom:8}}>
        <div style={{display:"flex",gap:8}}>
          {[
            {id:"dark",  label:"Dark",  desc:"Easy on the eyes in the gym"},
            {id:"light", label:"Light", desc:"Bright, high contrast outdoors"},

            const active=(prefs?.theme||"dark")===opt.id;

              <button key={opt.id}

                  background:opt.id==="dark"
                    ?"linear-gradient(135deg,#0A0A0B,#18181C)"

                  display:"flex",alignItems:"center",gap:4,padding:"0 8px"}}>
                  <div style={{width:12,height:4,borderRadius:2,
                    background:opt.id==="dark"?"#E8FF47":"#B8CC00"}}/>
                  <div style={{width:20,height:4,borderRadius:2,
                    background:opt.id==="dark"?"#2A2A32":"#D1D1D6"}}/>

                    background:opt.id==="dark"?"#2A2A32":"#D1D1D6"}}/>

        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>

            <div style={{fontSize:12,color:T.textSec}}>
              {sessions.length} session{sessions.length!==1?"s":""} · {sessions.reduce((a,s)=>a+(s.loggedSets?.length||0),0)} sets logged

          </div>
          <div style={{color:T.textTer,fontSize:18}}>›</div>
        </div>
      </Card>

      {/* Subscription */}
      <Card style={{marginBottom:8,
        border:`1px solid ${isPremium?planColor+"40":T.border}`,
        background:isPremium?`${planColor}06`:T.bgCard}}>
        <div style={{fontSize:11,color:T.textSec,marginBottom:10,
          textTransform:"uppercase",letterSpacing:"0.08em"}}>Subscription</div>
        {isPremium?(
          <div>
            <div style={{display:"flex",justifyContent:"space-between",
              alignItems:"flex-start",marginBottom:10}}>
              <div>
                <div style={{fontSize:15,fontWeight:700,color:planColor}}>{planLabel}</div>
                <div style={{fontSize:11,color:T.textSec,marginTop:3}}>
                  {tier==="annual"?"Billed $288/year · Renews Jan 2026"
                   :tier==="monthly"?"Billed monthly · Renews next month"
                   :"Trial ends in 7 days — choose a plan to continue"}
                </div>
              </div>
              <Badge color={tier==="trial"?T.teal:T.success}>
                {tier==="trial"?"Trial":"Active"}
              </Badge>
            </div>
            {tier==="trial"&&(
              <Btn style={{width:"100%",marginBottom:8}}
                onClick={()=>setShowPlans(true)}>
                Choose a paid plan →
              </Btn>
            )}
            <div style={{fontSize:11,color:T.textTer,marginBottom:10}}>
              30-day refund window · Cancel anytime
            </div>
            <button onClick={()=>setShowCancel(true)}
              style={{background:"none",border:"none",color:T.red,fontSize:11,
                cursor:"pointer",padding:0,textDecoration:"underline"}}>
              Cancel subscription
            </button>
          </div>
        ):(
          <div>
            <div style={{marginBottom:12}}>
              <div style={{fontSize:13,fontWeight:600,marginBottom:8}}>
                Free plan — limited access
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:5}}>
                {[
                  {f:"Basic workout logging",        free:true},
                  {f:"Exercise library (basic)",     free:true},
                  {f:"Adaptive Progression Engine",  free:false},
                  {f:"Meso Builder",                 free:false},
                  {f:"Advanced analytics",           free:false},
                  {f:"Study citations & APE panel",  free:false},
                ].map(({f,free})=>(
                  <div key={f} style={{display:"flex",gap:8,alignItems:"center"}}>
                    <span style={{fontSize:12,color:free?T.success:T.textTer,
                      width:14,textAlign:"center"}}>{free?"✓":"✕"}</span>
                    <span style={{fontSize:12,color:free?T.textSec:T.textTer}}>{f}</span>
                    {!free&&<Badge color={T.accent}>Premium</Badge>}
                  </div>
                ))}
              </div>
            </div>
            <Btn style={{width:"100%",marginBottom:8}}
              onClick={()=>setShowPlans(true)}>
              Upgrade to Premium →
            </Btn>
            <Btn variant="ghost" style={{width:"100%",fontSize:12}}
              onClick={()=>{onTierChange("trial");setShowPlans(false);}}>
              Start 7-day free trial
            </Btn>
          </div>
        )}
      </Card>


      {/* ── Sign out — always last, always alone ── */}
      <div style={{marginTop:24,marginBottom:8}}>
        <Btn variant="ghost" style={{width:"100%"}} onClick={onLogout}>Sign out</Btn>
      </div>

      {/* ── Delete account ── */}
      {!showDeleteConfirm?(
        <div style={{textAlign:"center",marginBottom:24}}>
          <button
            onClick={()=>setShowDeleteConfirm(true)}
            style={{background:"none",border:"none",color:T.textTer,fontSize:11,
              cursor:"pointer",textDecoration:"underline",fontFamily:"inherit",
              padding:"4px 0"}}>
            Delete account
          </button>
        </div>
      ):(
        <Card style={{marginBottom:24,border:`1px solid ${T.red}40`,
          background:`${T.red}06`,animation:"fadeUp 0.3s ease both"}}>
          <div style={{fontSize:13,fontWeight:700,color:T.red,marginBottom:8}}>
            Delete account permanently?
          </div>
          <div style={{fontSize:12,color:T.textSec,lineHeight:1.6,marginBottom:12}}>
            This will erase all your data. This action cannot be undone.
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:5,marginBottom:14}}>
            {[
              "All workout sessions and logged sets",
              "Your training program and progress",
              "Fatigue history and adaptation data",
              "Connection to your coach",
              "Your account and login credentials",
            ].map(item=>(
              <div key={item} style={{display:"flex",gap:8,alignItems:"flex-start"}}>
                <span style={{color:T.red,fontSize:11,flexShrink:0,marginTop:1}}>✕</span>
                <span style={{fontSize:11,color:T.textSec}}>{item}</span>
              </div>
            ))}
          </div>
          <div style={{display:"flex",gap:8}}>
            <Btn variant="ghost" style={{flex:1}}
              onClick={()=>setShowDeleteConfirm(false)}>
              Cancel
            </Btn>
            <Btn variant="danger" style={{flex:1}}
              onClick={onDeleteAccount}>
              Delete account
            </Btn>
          </div>
        </Card>
      )}

    </div>
  );
}

// COACH APP — complete separate interface
// ═══════════════════════════════════════════════════════════════

// ── Coach nav ──
const COACH_NAV=[
  {id:"clients", label:"Clients", icon:"◉"},
  {id:"programs",label:"Templates",icon:"◈"},
  {id:"notes",   label:"Notes",   icon:"✎"},
  {id:"cprofile",label:"Profile", icon:"⊞"},
];

// ── Client detail screen ──
function CoachClientDetail({ client, onBack, onSendNote, coachNotes=[], appliedSuggs={}, onAppliedSuggsChange }){
  const [note,setNote]=useState("");
  const [sent,setSent]=useState(false);
  const [suggTab,setSuggTab]=useState("ai"); // "ai" | "raw"
  // appliedSuggs is lifted to CoachApp — persists across navigation

  const fresh = client; // data already fetched from Supabase via fetchCoachClients
  const analysis = analyzeAthlete(fresh);
  const { status, signals, suggestions, compliance, sessions, program,
          liveState, lastTs, daysSince, sessionCount } = analysis;

  const totalSets = sessions.reduce((a,s)=>a+(s.loggedSets?.length||0),0);
  const allSets   = sessions.flatMap(s=>s.loggedSets||[]);
  const avgRir    = allSets.length ? +(allSets.reduce((a,s)=>a+s.rir,0)/allSets.length).toFixed(1) : null;
  const avgPump   = allSets.length ? +(allSets.reduce((a,s)=>a+(s.pump||3),0)/allSets.length).toFixed(1) : null;
  const lastSession = sessions[sessions.length-1];

  const STATUS_META = {
    overreached:  { label:"Overreached",   color:"#F87171", desc:"Accumulating fatigue faster than recovering. Prescribe deload." },
    accumulating: { label:"Accumulating",  color:"#FCD34D", desc:"Building fatigue normally. Monitor trend over next 1–2 sessions." },
    progressing:  { label:"Progressing",   color:"#4ADE80", desc:"Adapting well. Good time to push progressive overload." },
    undertrained: { label:"Undertrained",  color:"#FB923C", desc:"Insufficient stimulus. Increase volume or frequency." },
    no_data:      { label:"No data yet",   color:T.textTer, desc:"Athlete hasn't logged any sessions yet." },
  };
  const sm = STATUS_META[status]||STATUS_META.no_data;

  const PRIORITY_COLOR = { critical:"#F87171", high:"#FB923C", medium:"#FCD34D", low:T.textSec };
  const CONFIDENCE_COLOR = (c) => c>=0.9 ? T.success : c>=0.75 ? T.warning : T.textSec;

  function handleApplySuggestion(i){
    const s = suggestions[i];
    const history = [...(fresh.suggestionHistory||[]), {
      week: isoWeek(), muscle: s.muscle, action: s.action, type: s.type,
    }];
    updateUserInDB(client.clientId, { suggestionHistory: history });
    onAppliedSuggsChange(prev=>({...prev,[i]:"reviewed"}));
  }

  function handleDismissSuggestion(i){
    onAppliedSuggsChange(prev=>({...prev,[i]:"dismissed"}));
  }

  function handleRestoreSuggestion(i){
    onAppliedSuggsChange(prev=>{const next={...prev}; delete next[i]; return next;});
  }

  function sendNote(){
    if(!note.trim())return;
    onSendNote(client.clientId,note);
    setNote(""); setSent(true);
    setTimeout(()=>setSent(false),3000);
  }

  return(
    <div style={{animation:"slideUp 0.45s cubic-bezier(0.22,1,0.36,1) both"}}>
      <button
              aria-label="Back to all clients" onClick={onBack} style={{background:"none",border:"none",color:T.textSec,cursor:"pointer",fontSize:13,padding:"0 0 18px",display:"flex",alignItems:"center",gap:6}}>
        ← All clients
      </button>

      {/* Client header */}
      <div style={{display:"flex",gap:14,alignItems:"center",marginBottom:16}}>
        <div style={{width:52,height:52,borderRadius:16,
          background:`linear-gradient(135deg,${T.teal}30,${T.accent}30)`,
          border:`2px solid ${sm.color}50`,
          display:"flex",alignItems:"center",justifyContent:"center",
          fontSize:20,fontWeight:800,color:T.teal,flexShrink:0}}>
          {client.name.charAt(0).toUpperCase()}
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:17,fontWeight:700}}>{client.name}</div>
          <div style={{fontSize:12,color:T.textSec}}>{client.exp||"—"} · {client.goal||"—"}</div>
          <div style={{marginTop:4,display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
            <Badge color={T.teal}>ID: {client.clientId}</Badge>
            {client.coachConsent&&<Badge color={T.success}>Sharing on</Badge>}
          </div>
        </div>
      </div>

      {/* Overall status card */}
      <div style={{
        background:`${sm.color}12`,border:`1px solid ${sm.color}40`,
        borderRadius:12,padding:"12px 14px",marginBottom:12,
      }}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <div style={{fontSize:10,fontWeight:700,color:sm.color,textTransform:"uppercase",
              letterSpacing:"0.1em",marginBottom:3}}>Athlete status</div>
            <div style={{fontSize:16,fontWeight:800,color:sm.color}}>{sm.label}</div>
            <div style={{fontSize:12,color:T.textSec,marginTop:4,lineHeight:1.4,maxWidth:220}}>
              {sm.desc}
            </div>
          </div>
          <div style={{textAlign:"right",flexShrink:0}}>
            <div style={{fontSize:11,color:T.textTer,marginBottom:2}}>{sessionCount} sessions</div>
            {compliance!==null&&(
              <div style={{fontSize:11,color:compliance>=0.8?T.success:compliance>=0.6?T.warning:T.red,fontWeight:700}}>
                {Math.round(compliance*100)}% adherence
              </div>
            )}
            {daysSince!==null&&(
              <div style={{fontSize:10,color:daysSince<=1?T.success:daysSince<=3?T.warning:T.textTer,marginTop:2}}>
                {daysSince===0?"Active today":daysSince===1?"Active yesterday":`${daysSince} days inactive`}
              </div>
            )}
          </div>
        </div>
      </div>

      {/* Muscle signals — red/yellow/green */}
      {signals.length>0&&(
        <Card style={{marginBottom:12,padding:"11px 14px"}}>
          <div style={{fontSize:10,fontWeight:700,color:T.textTer,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:10}}>
            Muscle signals · {signals.length} flagged
          </div>
          {signals.map((sig,i)=>(
            <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",
              padding:"6px 0",borderBottom:i<signals.length-1?`1px solid ${T.border}`:"none"}}>
              <div style={{display:"flex",alignItems:"center",gap:7}}>
                <div style={{width:7,height:7,borderRadius:"50%",background:sig.color,flexShrink:0}}/>
                <span style={{fontSize:12,fontWeight:600,color:sig.color}}>{sig.label}</span>
                <span style={{fontSize:11,color:T.textSec,textTransform:"capitalize"}}>
                  {sig.signal.replace(/-/g," ")}
                </span>
              </div>
              <div style={{display:"flex",gap:10,alignItems:"center"}}>
                <span style={{fontSize:10,color:T.textTer,fontFamily:"'SF Mono','Menlo',monospace"}}>
                  F:{sig.fatigue}% S:{sig.stimulus}
                </span>
                <span style={{fontSize:11,color:sig.trend>0?T.success:sig.trend<0?T.red:T.textTer,fontWeight:700}}>
                  {sig.trend>0?"↑":sig.trend<0?"↓":"→"}
                </span>
              </div>
            </div>
          ))}
        </Card>
      )}

      {/* Tab bar — AI Suggestions vs Raw Data */}
      <div style={{display:"flex",gap:4,marginBottom:12,background:T.bgRaise,borderRadius:12,padding:3}}>
        {[["ai","AI Suggestions"],["raw","Session Data"]].map(([id,lbl])=>(
          <button key={id}
              aria-label={`Switch to ${id} view`}
              onClick={()=>setSuggTab(id)} style={{
            flex:1,padding:"7px 0",borderRadius:12,border:"none",cursor:"pointer",
            fontSize:11,fontWeight:700,fontFamily:"inherit",
            background:suggTab===id?T.bgCard:"transparent",
            color:suggTab===id?T.teal:T.textSec,
            transition:"all 0.15s ease",
          }}>{lbl}</button>
        ))}
      </div>

      {/* AI Suggestions tab */}
      {suggTab==="ai"&&(
        <div>
          {suggestions.length===0?(
            <Card style={{textAlign:"center",padding:"28px 20px"}}>
              <div style={{fontSize:22,marginBottom:8,opacity:0.3}}>—</div>
              <div style={{fontSize:13,fontWeight:600,color:T.textSec,marginBottom:4}}>No suggestions</div>
              <div style={{fontSize:12,color:T.textTer}}>All muscle metrics are within optimal ranges.</div>
            </Card>
          ):(
            suggestions.map((s,i)=>{
              const state = appliedSuggs[i]; // "reviewed" | "dismissed" | undefined
              const pc = PRIORITY_COLOR[s.priority]||T.textSec;
              const cc = CONFIDENCE_COLOR(s.confidence);

              // ── Reviewed (collapsed, positive) ──
              if(state==="reviewed"){
                return(
                  <Card key={i} style={{marginBottom:8,opacity:0.5,padding:"10px 12px"}}>
                    <div style={{display:"flex",alignItems:"center",gap:7}}>
                      <span style={{fontSize:11,color:T.success}}>✓</span>
                      <div style={{fontSize:11,color:T.success,flex:1}}>
                        Reviewed · {s.label||"Full body"} · {s.action?.replace(/_/g," ")}
                      </div>
                    </div>
                  </Card>
                );
              }

              // ── Dismissed (collapsed, muted, with restore) ──
              if(state==="dismissed"){
                return(
                  <Card key={i} style={{marginBottom:8,opacity:0.45,padding:"10px 12px",
                    border:`1px solid ${T.border}`}}>
                    <div style={{display:"flex",alignItems:"center",gap:7}}>
                      <span style={{fontSize:11,color:T.textTer}}>✕</span>
                      <div style={{fontSize:11,color:T.textTer,flex:1,
                        textDecoration:"line-through"}}>
                        Dismissed · {s.label||"Full body"} · {s.action?.replace(/_/g," ")}
                      </div>
                      <button
                        aria-label="Restore this suggestion"
                        onClick={()=>handleRestoreSuggestion(i)}
                        style={{background:"none",border:"none",color:T.textTer,
                          fontSize:11,cursor:"pointer",padding:"2px 6px",
                          textDecoration:"underline",fontFamily:"inherit",
                          flexShrink:0}}>
                        Restore
                      </button>
                    </div>
                  </Card>
                );
              }

              // ── Active suggestion card ──
              return(
                <Card key={i} style={{marginBottom:8,borderColor:`${pc}35`,padding:"11px 13px"}}>
                  <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:7,flexWrap:"wrap"}}>
                    <div style={{
                      fontSize:10,fontWeight:800,letterSpacing:"0.08em",textTransform:"uppercase",
                      color:pc,background:`${pc}18`,border:`1px solid ${pc}35`,
                      borderRadius:8,padding:"2px 7px",
                    }}>{s.priority}</div>
                    <Badge color={T.textTer}>{s.type?.replace(/_/g," ")}</Badge>
                    {s.label&&<Badge color={pc}>{s.label}</Badge>}
                    {s.note&&<Badge color={T.warning}>Repeat</Badge>}
                  </div>
                  <div style={{fontSize:12,color:T.textSec,lineHeight:1.55,marginBottom:8}}>
                    {s.reason}
                  </div>
                  {s.note&&(
                    <div style={{fontSize:11,color:T.warning,marginBottom:8,lineHeight:1.4,
                      padding:"5px 9px",background:`${T.warning}10`,borderRadius:8}}>
                      {s.note}
                    </div>
                  )}
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div style={{fontSize:10,color:cc,fontWeight:700,
                      fontFamily:"'SF Mono','Menlo',monospace"}}>
                      {Math.round(s.confidence*100)}% confidence
                    </div>
                    <div style={{display:"flex",gap:6,alignItems:"center"}}>
                      {s.value&&(
                        <div style={{fontSize:11,fontWeight:700,color:pc,
                          background:`${pc}18`,borderRadius:8,padding:"3px 9px"}}>
                          {typeof s.value==="number"
                            ? (s.action==="reduce"?`-${s.value}`:s.action==="increase"?`+${s.value}`:s.value)+` sets`
                            : s.value}
                        </div>
                      )}
                      {/* Dismiss — quiet, doesn't write to history */}
                      <button
                        aria-label="Dismiss this suggestion as wrong or irrelevant"
                        onClick={()=>handleDismissSuggestion(i)}
                        style={{height:30,borderRadius:8,
                          border:`1px solid ${T.border}`,
                          background:"none",
                          color:T.textTer,
                          fontSize:11,cursor:"pointer",
                          padding:"0 10px",fontFamily:"inherit",
                          transition:"all 0.15s"}}
                        onMouseEnter={e=>{e.currentTarget.style.borderColor=T.red;e.currentTarget.style.color=T.red;}}
                        onMouseLeave={e=>{e.currentTarget.style.borderColor=T.border;e.currentTarget.style.color=T.textTer;}}>
                        Dismiss
                      </button>
                      {/* Mark reviewed — writes to history, reduces repeat confidence */}
                      <Btn style={{fontSize:10,padding:"4px 12px",background:T.teal,color:"#000"}}
                        onClick={()=>handleApplySuggestion(i)}>
                        Mark reviewed
                      </Btn>
                    </div>
                  </div>
                </Card>
              );
            })
          )}
        </div>
      )}

      {/* Raw session data tab */}
      {suggTab==="raw"&&(
        <div>
          {/* Quick stats */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:12}}>
            <Card style={{padding:13}}><Stat label="Sessions" value={sessionCount||"0"} color={T.teal}/></Card>
            <Card style={{padding:13}}><Stat label="Total sets" value={totalSets||"0"} color={T.accent}/></Card>
            <Card style={{padding:13}}><Stat label="Avg RIR" value={avgRir||"—"} color={avgRir&&avgRir<=2?T.success:avgRir<=3?T.warning:T.orange}/></Card>
          </div>
          {/* Last session */}
          {lastSession&&(
            <Card style={{marginBottom:12,background:`${T.accent}08`,border:`1px solid ${T.accent}25`}}>
              <div style={{fontSize:11,color:T.accent,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:10}}>Last session</div>
              {[
                ["Sets logged", lastSession.loggedSets?.length||0, null],
                ["Avg pump",    `${avgPump||"—"}/5`,               avgPump>=4?T.success:avgPump>=3?T.warning:T.orange],
                ["Soreness",    `${lastSession.soreness||"—"}/5`,  lastSession.soreness>=4?T.red:T.success],
                ["Overall RPE", `${lastSession.overallRPE||"—"}/10`,null],
              ].map(([lbl,val,col])=>(
                <div key={lbl} style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
                  <span style={{fontSize:12,color:T.textSec}}>{lbl}</span>
                  <span style={{fontSize:12,fontWeight:700,color:col||T.textPri}}>{val}</span>
                </div>
              ))}
            </Card>
          )}
          {/* Program */}
          {program&&(
            <Card style={{marginBottom:12}}>
              <div style={{fontSize:11,color:T.textSec,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.08em"}}>Current program</div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <div style={{fontSize:14,fontWeight:700}}>{program.name}</div>
                <Badge color={T.purple}>{program.goal}</Badge>
              </div>
              <ProgressBar value={program.currentWeek} max={program.weeks}/>
              <div style={{display:"flex",justifyContent:"space-between",marginTop:5,marginBottom:10}}>
                <div style={{fontSize:11,color:T.textSec}}>Week {program.currentWeek}</div>
                <div style={{fontSize:11,color:T.textSec}}>{program.weeks} weeks</div>
              </div>
              {program.days?.map((day,i)=>(
                <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:i<program.days.length-1?`1px solid ${T.border}`:"none"}}>
                  <div style={{fontSize:12,fontWeight:600}}>{day.day}</div>
                  <div style={{fontSize:12,color:T.textSec}}>{day.focus}</div>
                </div>
              ))}
            </Card>
          )}
          {/* Session history */}
          {sessions.length>0&&(
            <Card style={{marginBottom:12}}>
              <div style={{fontSize:11,color:T.textSec,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.08em"}}>Session history</div>
              {sessions.slice().reverse().slice(0,5).map((s,i)=>{
                const date=new Date(s.timestamp).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
                return(
                  <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:i<Math.min(sessions.length,5)-1?`1px solid ${T.border}`:"none"}}>
                    <div>
                      <div style={{fontSize:12,fontWeight:600}}>{date}</div>
                      <div style={{fontSize:11,color:T.textSec}}>{s.loggedSets?.length||0} sets</div>
                    </div>
                    <div style={{textAlign:"right"}}>
                      <div style={{fontSize:11,color:T.textSec}}>RPE {s.overallRPE||"—"} · Sore {s.soreness||"—"}/5</div>
                    </div>
                  </div>
                );
              })}
            </Card>
          )}
        </div>
      )}

      {/* Coaching notes — always visible */}
      <Card style={{marginBottom:12}}>
        <div style={{fontSize:11,color:T.textSec,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.08em"}}>Coaching notes</div>
        {coachNotes.length===0&&<div style={{fontSize:12,color:T.textTer,marginBottom:12}}>No notes sent yet.</div>}
        {coachNotes.map((n,i)=>(
          <div key={i} style={{background:T.bgRaise,borderRadius:12,padding:"10px 12px",marginBottom:8}}>
            <div style={{fontSize:12,color:T.textSec,lineHeight:1.5}}>{n.text}</div>
            <div style={{fontSize:10,color:T.textTer,marginTop:4}}>
              {new Date(n.ts).toLocaleDateString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}
            </div>
          </div>
        ))}
        <div style={{display:"flex",gap:8,marginTop:8}}>
          <textarea value={note} onChange={e=>setNote(e.target.value)}
            maxLength={2000} placeholder="Write a coaching note…" rows={2}
            style={{flex:1,padding:"10px 12px",borderRadius:12,border:`1px solid ${T.border}`,background:T.bgInput,color:T.textPri,fontSize:13,fontFamily:"inherit",outline:"none",resize:"none"}}
            onFocus={e=>e.target.style.borderColor=T.teal}
            onBlur={e=>e.target.style.borderColor=T.border}/>
          <Btn onClick={sendNote} style={{padding:"10px 14px",background:T.teal,color:"#000",alignSelf:"flex-end",fontSize:12}}>
            {sent?"Sent":"Send"}
          </Btn>
        </div>
      </Card>
    </div>
  );
}
// ── Coach Clients screen ──
function CoachClients({ coach, onClientSelect, onAddClient, clients=[] }){
  const [addId,setAddId]=useState("");
  const [addError,setAddError]=useState("");
  const [addSuccess,setAddSuccess]=useState("");
  const [showAddForm,setShowAddForm]=useState(false);
  const [sortBy,setSortBy]=useState("attention"); // attention | compliance | recent | name
  const [filterStatus,setFilterStatus]=useState("all");
  const [search,setSearch]=useState("");
  const [showSearch,setShowSearch]=useState(false);

  async function addClient(){
    if(!addId.trim()){setAddError("Enter a Client ID.");return;}
    const id=addId.trim().toUpperCase();
    if(clients.find(c=>c.clientId===id)){setAddError("Client already added.");return;}
    setAddError("");
    const ok = await onAddClient(id);
    if(ok===false) return; // error handled inside handleAddClient via toast
    setAddId("");
    setAddSuccess("Client added to your roster!");
    setTimeout(()=>setAddSuccess(""),3000);
    setShowAddForm(false);
  }

  const STATUS_STYLE = {
    overreached:  { label:"Overreached",  color:"#F87171", bg:"#F8717118", order:0 },
    undertrained: { label:"Undertrained", color:"#FB923C", bg:"#FB923C18", order:1 },
    accumulating: { label:"Accumulating", color:"#FCD34D", bg:"#FCD34D18", order:2 },
    progressing:  { label:"Progressing",  color:"#4ADE80", bg:"#4ADE8018", order:3 },
    no_data:      { label:"No data",      color:T.textTer, bg:"transparent", order:4 },
  };

  // Analyse all clients once — data already fetched from Supabase
  const analysed = clients.map(client=>{
    const analysis = analyzeAthlete(client);
    return { client, fresh:client, analysis };
  });

  // Filter
  const filtered = analysed.filter(({fresh, analysis})=>{
    if(filterStatus!=="all" && analysis.status!==filterStatus) return false;
    if(search.trim() && !fresh.name.toLowerCase().includes(search.trim().toLowerCase())) return false;
    return true;
  });

  // Sort
  const SORT_FNS = {
    attention:  (a,b)=> (STATUS_STYLE[a.analysis.status]?.order??4) - (STATUS_STYLE[b.analysis.status]?.order??4),
    compliance: (a,b)=> (a.analysis.compliance??1) - (b.analysis.compliance??1),
    recent:     (a,b)=> (b.analysis.lastTs||0) - (a.analysis.lastTs||0),
    name:       (a,b)=> (a.fresh.name||"").localeCompare(b.fresh.name||""),
  };
  const sorted = [...filtered].sort(SORT_FNS[sortBy] || SORT_FNS.attention);

  const SORT_LABELS = {
    attention:"Needs attention", compliance:"Compliance", recent:"Last active", name:"Name A–Z"
  };
  const FILTER_OPTS = [
    {id:"all",       label:"All"},
    {id:"overreached",label:"Overreached"},
    {id:"progressing",label:"Progressing"},
    {id:"undertrained",label:"Undertrained"},
    {id:"no_data",   label:"No data"},
  ];

  return(
    <div style={{animation:"fadeUp 0.45s cubic-bezier(0.22,1,0.36,1) both"}}>
      {/* Header */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}}>
        <div>
          <div style={{fontSize:22,fontWeight:700}}>Clients</div>
          <div style={{fontSize:13,color:T.textSec,marginTop:4}}>
            {clients.length} athlete{clients.length!==1?"s":""} on your roster
            {filtered.length<clients.length&&` · ${filtered.length} shown`}
          </div>
        </div>
        {/* Search toggle */}
        <button
          aria-label={showSearch?"Close search":"Search clients"}
          onClick={()=>{ setShowSearch(v=>!v); setSearch(""); }}
          style={{width:36,height:36,borderRadius:12,
            border:`1px solid ${showSearch?T.teal:T.border}`,
            background:showSearch?`${T.teal}15`:T.bgRaise,
            color:showSearch?T.teal:T.textSec,
            cursor:"pointer",display:"flex",alignItems:"center",
            justifyContent:"center",fontSize:14,flexShrink:0}}>
          ⌕
        </button>
      </div>

      {/* Search input */}
      {showSearch&&(
        <div style={{marginBottom:12,animation:"fadeUp 0.25s cubic-bezier(0.22,1,0.36,1) both"}}>
          <input
            autoFocus
            value={search}
            onChange={e=>setSearch(e.target.value)}
            placeholder="Search by name…"
            style={{width:"100%",padding:"10px 14px",borderRadius:12,
              border:`1px solid ${T.teal}`,background:T.bgInput,
              color:T.textPri,fontSize:13,fontFamily:"inherit",
              outline:"none",boxSizing:"border-box"}}
          />
        </div>
      )}

      {addSuccess&&(
        <div style={{background:`${T.success}15`,border:`1px solid ${T.success}40`,
          borderRadius:12,padding:"10px 14px",fontSize:12,color:T.success,marginBottom:12}}>
          {addSuccess}
        </div>
      )}

      {showAddForm?(
        <Card style={{marginBottom:12,border:`1px solid ${T.teal}40`}}>
          <div style={{fontSize:13,fontWeight:700,marginBottom:4}}>Add client by ID</div>
          <div style={{fontSize:11,color:T.textSec,marginBottom:12,lineHeight:1.5}}>
            Ask your client to open their profile in Iron Coach and share their 6-character Client ID.
          </div>
          {addError&&(
            <div style={{background:`${T.red}15`,border:`1px solid ${T.red}40`,
              borderRadius:8,padding:"8px 12px",fontSize:11,color:T.red,marginBottom:10}}>
              {addError}
            </div>
          )}
          <div style={{display:"flex",gap:8}}>
            <input value={addId} onChange={e=>setAddId(e.target.value.toUpperCase())}
              placeholder="e.g. AB3XY2" maxLength={6}
              style={{flex:1,padding:"12px 14px",borderRadius:12,
                border:`1px solid ${T.border}`,background:T.bgInput,
                color:T.textPri,fontSize:16,
                fontFamily:"'SF Mono','Menlo',monospace",
                fontWeight:700,letterSpacing:"0.15em",
                outline:"none",textTransform:"uppercase"}}
              onFocus={e=>e.target.style.borderColor=T.teal}
              onBlur={e=>e.target.style.borderColor=T.border}
              onKeyDown={e=>e.key==="Enter"&&addClient()}/>
            <Btn onClick={addClient} style={{padding:"12px 16px",background:T.teal,color:"#000"}}>
              Add
            </Btn>
          </div>
          <button aria-label="Cancel"
            onClick={()=>{setShowAddForm(false);setAddError("");setAddId("");}}
            style={{marginTop:10,background:"none",border:"none",
              color:T.textTer,fontSize:12,cursor:"pointer"}}>
            Cancel
          </button>
        </Card>
      ):(
        <Btn onClick={()=>setShowAddForm(true)}
          style={{width:"100%",marginBottom:12,background:T.teal,color:"#000"}}>
          + Add client by ID
        </Btn>
      )}

      {clients.length>0&&(
        <>
          {/* Sort + filter controls */}
          <div style={{marginBottom:10}}>
            {/* Sort row */}
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
              <span style={{fontSize:10,color:T.textTer,textTransform:"uppercase",
                letterSpacing:"0.08em",flexShrink:0}}>
                Sort
              </span>
              <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                {Object.entries(SORT_LABELS).map(([key,label])=>(
                  <button key={key}
                    aria-label={`Sort by ${label}`}
                    aria-pressed={sortBy===key}
                    onClick={()=>setSortBy(key)}
                    style={{
                      padding:"4px 9px",borderRadius:8,
                      border:`1px solid ${sortBy===key?T.teal:T.border}`,
                      background:sortBy===key?`${T.teal}15`:T.bgRaise,
                      color:sortBy===key?T.teal:T.textSec,
                      fontSize:11,fontWeight:sortBy===key?700:400,
                      cursor:"pointer",fontFamily:"inherit",
                      transition:"all 0.15s",whiteSpace:"nowrap",
                    }}>
                    {label}
                  </button>
                ))}
              </div>
            </div>

            {/* Filter row */}
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:10,color:T.textTer,textTransform:"uppercase",
                letterSpacing:"0.08em",flexShrink:0}}>
                Filter
              </span>
              <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                {FILTER_OPTS.map(opt=>{
                  const col = STATUS_STYLE[opt.id]?.color || T.teal;
                  const active = filterStatus===opt.id;
                  return(
                    <button key={opt.id}
                      aria-label={`Filter by ${opt.label}`}
                      aria-pressed={active}
                      onClick={()=>setFilterStatus(opt.id)}
                      style={{
                        padding:"4px 9px",borderRadius:8,
                        border:`1px solid ${active?(opt.id==="all"?T.teal:col):T.border}`,
                        background:active?(opt.id==="all"?`${T.teal}15`:`${col}15`):T.bgRaise,
                        color:active?(opt.id==="all"?T.teal:col):T.textSec,
                        fontSize:11,fontWeight:active?700:400,
                        cursor:"pointer",fontFamily:"inherit",
                        transition:"all 0.15s",whiteSpace:"nowrap",
                      }}>
                      {opt.label}
                    </button>
                  );
                })}
              </div>
            </div>
          </div>
        </>
      )}

      {clients.length===0?(
        <Card style={{textAlign:"center",padding:"40px 20px"}}>
          <div style={{fontSize:32,marginBottom:12,opacity:0.3}}>◉</div>
          <div style={{fontSize:14,fontWeight:600,color:T.textSec,marginBottom:6}}>No clients yet</div>
          <div style={{fontSize:12,color:T.textTer,lineHeight:1.6}}>
            Ask your athletes to share their Client ID from the Profile tab in their Iron Coach app.
          </div>
        </Card>
      ):sorted.length===0?(
        <Card style={{textAlign:"center",padding:"32px 20px"}}>
          <div style={{fontSize:14,fontWeight:600,color:T.textSec,marginBottom:6}}>
            No clients match
          </div>
          <div style={{fontSize:12,color:T.textTer,marginBottom:12}}>
            Try a different filter or search term.
          </div>
          <button onClick={()=>{setFilterStatus("all");setSearch("");setSortBy("attention");}}
            style={{background:"none",border:`1px solid ${T.teal}`,borderRadius:8,
              color:T.teal,fontSize:12,cursor:"pointer",padding:"6px 14px",fontFamily:"inherit"}}>
            Clear filters
          </button>
        </Card>
      ):(
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {sorted.map(({client, fresh, analysis})=>{
            const st = STATUS_STYLE[analysis.status] || STATUS_STYLE.no_data;
            const topSignal     = analysis.signals[0]     || null;
            const topSuggestion = analysis.suggestions[0] || null;
            const recencyStr = (()=>{
              if(!analysis.lastTs) return null;
              const diff=Date.now()-analysis.lastTs;
              const h=Math.floor(diff/3600000), d=Math.floor(diff/86400000);
              if(d===0&&h<1) return "Just now";
              if(d===0) return `${h}h ago`;
              if(d===1) return "Yesterday";
              if(d<7) return `${d} days ago`;
              return `${Math.floor(d/7)}w ago`;
            })();

            return(
              <Card key={client.clientId}
                onClick={()=>onClientSelect(fresh)}
                style={{cursor:"pointer",
                  borderColor:analysis.status==="overreached"?`${st.color}40`:T.border}}>
                <div style={{display:"flex",gap:12,alignItems:"flex-start"}}>
                  {/* Avatar */}
                  <div style={{width:44,height:44,borderRadius:12,
                    background:`linear-gradient(135deg,${T.teal}30,${T.accent}30)`,
                    border:`2px solid ${st.color}50`,
                    display:"flex",alignItems:"center",justifyContent:"center",
                    fontSize:18,fontWeight:800,color:T.teal,flexShrink:0}}>
                    {fresh.name.charAt(0).toUpperCase()}
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:"flex",justifyContent:"space-between",
                      alignItems:"flex-start",marginBottom:2}}>
                      <div style={{fontSize:14,fontWeight:700}}>{fresh.name}</div>
                      <div style={{
                        fontSize:10,fontWeight:700,letterSpacing:"0.04em",
                        color:st.color,background:st.bg,
                        border:`1px solid ${st.color}40`,
                        borderRadius:8,padding:"2px 7px",flexShrink:0,marginLeft:6,
                      }}>{st.label}</div>
                    </div>
                    <div style={{fontSize:11,color:T.textSec,marginBottom:5}}>
                      {fresh.goal||"—"} · {fresh.exp||"—"} · {analysis.sessionCount} session{analysis.sessionCount!==1?"s":""}
                      {recencyStr&&(
                        <span style={{color:analysis.daysSince===0?T.success:T.textTer}}>
                          {" · "}{recencyStr}
                        </span>
                      )}
                    </div>
                    {topSignal?(
                      <div style={{display:"flex",alignItems:"center",gap:5}}>
                        <div style={{width:6,height:6,borderRadius:"50%",
                          background:topSignal.color,flexShrink:0}}/>
                        <span style={{fontSize:11,color:topSignal.color,fontWeight:600}}>
                          {topSignal.label} {topSignal.signal.replace(/-/g," ")}
                          {topSignal.fatigue>0&&` · ${topSignal.fatigue}% fatigue`}
                        </span>
                      </div>
                    ):topSuggestion?(
                      <div style={{fontSize:11,color:T.textSec,lineHeight:1.4}}>
                        {topSuggestion.reason.slice(0,60)}{topSuggestion.reason.length>60?"…":""}
                      </div>
                    ):(
                      <div style={{fontSize:11,color:T.textTer}}>No session data</div>
                    )}
                    {analysis.compliance!==null&&(
                      <div style={{marginTop:7,display:"flex",alignItems:"center",gap:7}}>
                        <div style={{flex:1,height:3,borderRadius:2,
                          background:T.bgRaise,overflow:"hidden"}}>
                          <div style={{
                            width:`${analysis.compliance*100}%`,height:"100%",
                            background:analysis.compliance>=0.8?T.success
                              :analysis.compliance>=0.6?T.warning:T.red,
                            borderRadius:2,transition:"width 0.4s ease"}}/>
                        </div>
                        <span style={{fontSize:10,color:T.textTer,flexShrink:0,
                          fontFamily:"'SF Mono','Menlo',monospace"}}>
                          {Math.round(analysis.compliance*100)}% adherence
                        </span>
                      </div>
                    )}
                  </div>
                </div>
              </Card>
            );
          })}
        </div>
      )}
    </div>
  );
}
// ── Coach Program Templates screen ──
function CoachPrograms({ clients=[], assigned={}, onAssignChange, templates=[], onTemplatesChange, coachId }){
  const setAssigned=onAssignChange;
  const setTemplates=onTemplatesChange;
  const [view,setView]=useState("list");
  const [activeIdx,setActiveIdx]=useState(null);
  const [expandedIdx,setExpandedIdx]=useState(null);
  const [confirmDelete,setConfirmDelete]=useState(false);
  // Assign flow state — lifted here to avoid hooks-in-conditionals error
  const [assigning,setAssigning]=useState(false);
  const [assignResult,setAssignResult]=useState(null);


  // ── Editor state ──
  const [editName,setEditName]=useState("");
  const [editGoal,setEditGoal]=useState("Hypertrophy");
  const [editWeeks,setEditWeeks]=useState(8);
  const [editFreq,setEditFreq]=useState(4);
  const [editDesc,setEditDesc]=useState("");
  const [editSplit,setEditSplit]=useState([]);
  const isNew = activeIdx === templates.length; // creating vs editing

  function openEdit(i){
    const t = i < templates.length ? templates[i] : null;
    setEditName(t?t.name:`Custom Template ${templates.length+1}`);
    setEditGoal(t?t.goal:"Hypertrophy");
    setEditWeeks(t?t.weeks:8);
    setEditFreq(t?t.freq:4);
    setEditDesc(t?t.desc||"":"");
    setEditSplit(t?t.split.map(d=>({...d})):[]);
    setActiveIdx(i);
    setConfirmDelete(false);
    setView("edit");
  }

  async function saveEdit(){
    const template={
      name:editName.trim()||`Template ${activeIdx+1}`,
      goal:editGoal, weeks:editWeeks, freq:editFreq,
      desc:editDesc.trim(),
      split:editSplit.filter(d=>d.focus.trim()),
    };
    const updated=[...templates];
    if(isNew) updated.push(template);
    else updated[activeIdx]=template;
    setTemplates(updated);
    setView("list");
    // Persist to Supabase
    if(coachId){
      const existingId = isNew ? null : (templates[activeIdx]?._id || null);
      const savedId = await saveCoachTemplate(coachId, template, existingId);
      // Store the Supabase ID so future edits update the same row
      if(savedId){
        setTemplates(prev=>{
          const next=[...prev];
          const idx = isNew ? next.length-1 : activeIdx;
          if(next[idx]) next[idx]={...next[idx],_id:savedId};
          return next;
        });
      }
    }
  }

  async function deleteTemplate(){
    const templateToDelete = templates[activeIdx];
    const updated=templates.filter((_,i)=>i!==activeIdx);
    const newAssigned={};
    Object.entries(assigned).forEach(([k,v])=>{
      const ki=parseInt(k);
      if(ki<activeIdx) newAssigned[ki]=v;
      else if(ki>activeIdx) newAssigned[ki-1]=v;
    });
    setTemplates(updated);
    onAssignChange(newAssigned);
    setView("list");
    // Delete from Supabase
    if(coachId && templateToDelete?._id){
      await deleteCoachTemplate(templateToDelete._id);
    }
  }

  function addSplitDay(){
    if(editSplit.length>=7) return;
    const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
    const used=new Set(editSplit.map(d=>d.day));
    const next=DAYS.find(d=>!used.has(d))||DAYS[editSplit.length%7];
    setEditSplit(prev=>[...prev,{day:next,focus:""}]);
  }

  function moveSplitDay(i,dir){
    const next=[...editSplit];
    const swap=i+dir;
    if(swap<0||swap>=next.length) return;
    [next[i],next[swap]]=[next[swap],next[i]];
    setEditSplit(next);
  }

  // ── Edit / Create screen ──
  if(view==="edit"){
    const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
    const GOAL_OPTS=["Hypertrophy","Strength","Peak"];
    const GOAL_COLOR={Hypertrophy:T.accent, Strength:T.orange, Peak:T.purple};

    return(
      <div style={{animation:"slideUp 0.45s cubic-bezier(0.22,1,0.36,1) both"}}>
        {/* Header */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
          <button aria-label="Back to templates"
            onClick={()=>setView("list")}
            style={{background:"none",border:"none",color:T.textSec,cursor:"pointer",
              fontSize:13,padding:0,minHeight:44,display:"flex",alignItems:"center"}}>
            ← Back
          </button>
          {!isNew&&(
            <button aria-label="Delete template"
              onClick={()=>setConfirmDelete(true)}
              style={{background:"none",border:"none",color:T.red,cursor:"pointer",
                fontSize:12,padding:"4px 8px",fontFamily:"inherit",minHeight:44}}>
              Delete
            </button>
          )}
        </div>

        {/* Delete confirmation */}
        {confirmDelete&&(
          <Card style={{marginBottom:12,border:`1px solid ${T.red}40`,background:`${T.red}08`}}>
            <div style={{fontSize:13,fontWeight:600,color:T.red,marginBottom:8}}>
              Delete "{editName}"?
            </div>
            <div style={{fontSize:12,color:T.textSec,marginBottom:12}}>
              This removes the template permanently. Clients already assigned will keep their program.
            </div>
            <div style={{display:"flex",gap:8}}>
              <Btn variant="ghost" style={{flex:1}} onClick={()=>setConfirmDelete(false)}>Cancel</Btn>
              <Btn variant="danger" style={{flex:1}} onClick={deleteTemplate}>Delete</Btn>
            </div>
          </Card>
        )}

        <div style={{fontSize:18,fontWeight:700,marginBottom:16}}>
          {isNew?"New template":"Edit template"}
        </div>

        {/* Name */}
        <Card style={{marginBottom:10}}>
          <div style={{fontSize:11,color:T.textSec,marginBottom:6,
            textTransform:"uppercase",letterSpacing:"0.06em"}}>Template name</div>
          <input
            value={editName}
            onChange={e=>setEditName(e.target.value)}
            placeholder="e.g. Off-season Hypertrophy Block"
            autoFocus
            style={{width:"100%",padding:"11px 14px",borderRadius:12,
              border:`1px solid ${T.teal}`,background:T.bgInput,
              color:T.textPri,fontSize:14,fontFamily:"inherit",outline:"none",
              boxSizing:"border-box"}}
          />
        </Card>

        {/* Goal */}
        <Card style={{marginBottom:10}}>
          <div style={{fontSize:11,color:T.textSec,marginBottom:10,
            textTransform:"uppercase",letterSpacing:"0.06em"}}>Goal</div>
          <div style={{display:"flex",gap:8}}>
            {GOAL_OPTS.map(g=>{
              const active=editGoal===g;
              const col=GOAL_COLOR[g];
              return(
                <button key={g} onClick={()=>setEditGoal(g)}
                  style={{flex:1,padding:"9px 0",borderRadius:12,
                    border:`1px solid ${active?col:T.border}`,
                    background:active?`${col}18`:T.bgRaise,
                    color:active?col:T.textSec,
                    fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",
                    transition:"all 0.15s"}}>
                  {g}
                </button>
              );
            })}
          </div>
        </Card>

        {/* Duration + Frequency */}
        <Card style={{marginBottom:10}}>
          <div style={{display:"flex",gap:12}}>
            {/* Weeks */}
            <div style={{flex:1}}>
              <div style={{fontSize:11,color:T.textSec,marginBottom:10,
                textTransform:"uppercase",letterSpacing:"0.06em"}}>
                Duration: {editWeeks} wks
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <button aria-label="Decrease weeks"
                  onClick={()=>setEditWeeks(w=>Math.max(2,w-1))}
                  style={{width:36,height:36,borderRadius:8,border:`1px solid ${T.border}`,
                    background:T.bgRaise,color:T.textPri,fontSize:18,cursor:"pointer"}}>
                  −
                </button>
                <div style={{flex:1,height:4,borderRadius:2,background:T.bgRaise,overflow:"hidden"}}>
                  <div style={{width:`${((editWeeks-2)/22)*100}%`,height:"100%",
                    background:T.teal,borderRadius:2}}/>
                </div>
                <button aria-label="Increase weeks"
                  onClick={()=>setEditWeeks(w=>Math.min(24,w+1))}
                  style={{width:36,height:36,borderRadius:8,border:`1px solid ${T.border}`,
                    background:T.bgRaise,color:T.textPri,fontSize:18,cursor:"pointer"}}>
                  +
                </button>
              </div>
            </div>
            {/* Frequency */}
            <div style={{flex:1}}>
              <div style={{fontSize:11,color:T.textSec,marginBottom:10,
                textTransform:"uppercase",letterSpacing:"0.06em"}}>
                Freq: {editFreq}× / week
              </div>
              <div style={{display:"flex",gap:4}}>
                {[2,3,4,5,6].map(f=>(
                  <button key={f} onClick={()=>setEditFreq(f)}
                    aria-label={`${f} days per week`}
                    style={{flex:1,height:36,borderRadius:8,
                      border:`1px solid ${editFreq===f?T.teal:T.border}`,
                      background:editFreq===f?`${T.teal}18`:T.bgRaise,
                      color:editFreq===f?T.teal:T.textSec,
                      fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                    {f}
                  </button>
                ))}
              </div>
            </div>
          </div>
        </Card>

        {/* Description */}
        <Card style={{marginBottom:10}}>
          <div style={{fontSize:11,color:T.textSec,marginBottom:6,
            textTransform:"uppercase",letterSpacing:"0.06em"}}>Description</div>
          <textarea
            value={editDesc}
            onChange={e=>setEditDesc(e.target.value)}
            maxLength={500}
            placeholder="Describe this program's purpose, who it's for, and key training principles…"
            rows={3}
            style={{width:"100%",padding:"11px 14px",borderRadius:12,
              border:`1px solid ${T.border}`,background:T.bgInput,
              color:T.textPri,fontSize:13,fontFamily:"inherit",
              outline:"none",resize:"vertical",lineHeight:1.5,
              boxSizing:"border-box"}}
            onFocus={e=>e.target.style.borderColor=T.teal}
            onBlur={e=>e.target.style.borderColor=T.border}
          />
        </Card>

        {/* Weekly split builder */}
        <Card style={{marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div style={{fontSize:11,color:T.textSec,textTransform:"uppercase",letterSpacing:"0.06em"}}>
              Weekly split
            </div>
            <button aria-label="Add training day"
              onClick={addSplitDay}
              disabled={editSplit.length>=7}
              style={{fontSize:11,fontWeight:700,color:T.teal,
                background:`${T.teal}12`,border:`1px solid ${T.teal}40`,
                borderRadius:8,padding:"4px 10px",cursor:"pointer",
                fontFamily:"inherit",opacity:editSplit.length>=7?0.4:1}}>
              + Add day
            </button>
          </div>

          {editSplit.length===0&&(
            <div style={{textAlign:"center",padding:"20px 0",color:T.textTer,fontSize:12}}>
              No training days yet. Tap "+ Add day" to build your split.
            </div>
          )}

          {editSplit.map((d,di)=>(
            <div key={di} style={{display:"flex",gap:6,alignItems:"center",marginBottom:8}}>
              {/* Day selector */}
              <select
                aria-label={`Day ${di+1} of week`}
                value={d.day}
                onChange={e=>{
                  const next=[...editSplit];
                  next[di]={...next[di],day:e.target.value};
                  setEditSplit(next);
                }}
                style={{width:58,padding:"7px 4px",borderRadius:8,
                  border:`1px solid ${T.border}`,background:T.bgInput,
                  color:T.teal,fontSize:12,fontWeight:700,
                  fontFamily:"inherit",outline:"none",cursor:"pointer",
                  flexShrink:0}}>
                {DAYS.map(day=>(
                  <option key={day} value={day}>{day}</option>
                ))}
              </select>

              {/* Focus input */}
              <input
                value={d.focus}
                onChange={e=>{
                  const next=[...editSplit];
                  next[di]={...next[di],focus:e.target.value};
                  setEditSplit(next);
                }}
                placeholder="e.g. Chest + Back"
                style={{flex:1,padding:"7px 10px",borderRadius:8,
                  border:`1px solid ${T.border}`,background:T.bgInput,
                  color:T.textPri,fontSize:12,fontFamily:"inherit",outline:"none"}}
                onFocus={e=>e.target.style.borderColor=T.teal}
                onBlur={e=>e.target.style.borderColor=T.border}
              />

              {/* Move up/down */}
              <div style={{display:"flex",flexDirection:"column",gap:2,flexShrink:0}}>
                <button aria-label="Move day up"
                  onClick={()=>moveSplitDay(di,-1)}
                  disabled={di===0}
                  style={{width:22,height:18,borderRadius:4,border:`1px solid ${T.border}`,
                    background:T.bgRaise,color:di===0?T.textTer:T.textSec,
                    cursor:di===0?"default":"pointer",fontSize:9,
                    display:"flex",alignItems:"center",justifyContent:"center"}}>
                  ▲
                </button>
                <button aria-label="Move day down"
                  onClick={()=>moveSplitDay(di,1)}
                  disabled={di===editSplit.length-1}
                  style={{width:22,height:18,borderRadius:4,border:`1px solid ${T.border}`,
                    background:T.bgRaise,
                    color:di===editSplit.length-1?T.textTer:T.textSec,
                    cursor:di===editSplit.length-1?"default":"pointer",fontSize:9,
                    display:"flex",alignItems:"center",justifyContent:"center"}}>
                  ▼
                </button>
              </div>

              {/* Remove day */}
              <button aria-label={`Remove ${d.day}`}
                onClick={()=>setEditSplit(prev=>prev.filter((_,j)=>j!==di))}
                style={{width:28,height:28,borderRadius:8,border:`1px solid ${T.border}`,
                  background:"none",color:T.textTer,cursor:"pointer",
                  fontSize:13,display:"flex",alignItems:"center",justifyContent:"center",
                  flexShrink:0,transition:"all 0.15s"}}
                onMouseEnter={e=>{e.currentTarget.style.borderColor=T.red;e.currentTarget.style.color=T.red;}}
                onMouseLeave={e=>{e.currentTarget.style.borderColor=T.border;e.currentTarget.style.color=T.textTer;}}>
                ✕
              </button>
            </div>
          ))}
        </Card>

        <Btn style={{width:"100%",background:T.teal,color:"#000"}}
          onClick={saveEdit}
          disabled={!editName.trim()}>
          {isNew?"Create template":"Save changes"}
        </Btn>
      </div>
    );
  }

  // ── Assign-to-client screen ──
  if(view==="assign"){
    const t=templates[activeIdx];
    const currentAssigned=assigned[activeIdx]||[];

    async function doAssign(){
      if(currentAssigned.length===0) return;
      setAssigning(true);
      setAssignResult(null);
      let successCount=0;
      for(const clientId of currentAssigned){
        const ok=await assignProgramToAthlete(coachId, clientId, t);
        if(ok) successCount++;
      }
      setAssigning(false);
      if(successCount>0){
        setAssignResult({ok:true, msg:`Program sent to ${successCount} athlete${successCount!==1?"s":""}. They'll see it next time they open the app.`});
        setAssigned(prev=>({...prev,[activeIdx]:currentAssigned}));
      } else {
        setAssignResult({ok:false, msg:"Assignment failed — check your connection and try again."});
      }
    }

    if(clients.length===0){
      return(
        <div style={{animation:"slideUp 0.45s cubic-bezier(0.22,1,0.36,1) both"}}>
          <button aria-label="Cancel assignment"
            onClick={()=>setView("list")}
            style={{background:"none",border:"none",color:T.textSec,cursor:"pointer",
              fontSize:13,padding:0,marginBottom:20,minHeight:44,
              display:"flex",alignItems:"center"}}>
            ← Back
          </button>
          <Card style={{textAlign:"center",padding:"40px 20px"}}>
            <div style={{fontSize:28,marginBottom:12,opacity:0.3}}>◉</div>
            <div style={{fontSize:14,fontWeight:600,marginBottom:6}}>No clients yet</div>
            <div style={{fontSize:13,color:T.textSec}}>
              Add clients from the Clients tab before assigning programs.
            </div>
          </Card>
        </div>
      );
    }
    return(
      <div style={{animation:"slideUp 0.45s cubic-bezier(0.22,1,0.36,1) both"}}>
        <button aria-label="Cancel assignment"
          onClick={()=>setView("list")}
          style={{background:"none",border:"none",color:T.textSec,cursor:"pointer",
            fontSize:13,padding:0,marginBottom:16,minHeight:44,
            display:"flex",alignItems:"center"}}>
          ← Back
        </button>
        <div style={{fontSize:18,fontWeight:700,marginBottom:4}}>Assign program</div>
        <div style={{fontSize:13,color:T.textSec,marginBottom:16}}>
          {t.name} — select athletes to send this program to
        </div>

        {/* Success / error result */}
        {assignResult&&(
          <div style={{
            marginBottom:12,padding:"10px 14px",borderRadius:12,
            background:assignResult.ok?`${T.success}15`:`${T.red}15`,
            border:`1px solid ${assignResult.ok?T.success:T.red}40`,
            fontSize:12,color:assignResult.ok?T.success:T.red,fontWeight:600,
          }}>
            {assignResult.msg}
          </div>
        )}

        <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:16}}>
          {clients.map(c=>{
            const isOn=currentAssigned.includes(c.clientId);
            return(
              <button key={c.clientId}
                aria-label={`${isOn?"Remove":"Add"} ${c.name}`}
                onClick={()=>{
                  setAssignResult(null);
                  setAssigned(prev=>({
                    ...prev,
                    [activeIdx]: isOn
                      ? (prev[activeIdx]||[]).filter(id=>id!==c.clientId)
                      : [...(prev[activeIdx]||[]),c.clientId],
                  }));
                }}
                style={{display:"flex",alignItems:"center",gap:12,
                  padding:"12px 14px",borderRadius:12,
                  border:`1px solid ${isOn?T.teal:T.border}`,
                  background:isOn?`${T.teal}12`:T.bgRaise,
                  cursor:"pointer",textAlign:"left",width:"100%"}}>
                <div style={{width:36,height:36,borderRadius:12,
                  background:`${T.teal}20`,border:`1px solid ${T.teal}40`,
                  display:"flex",alignItems:"center",justifyContent:"center",
                  fontSize:14,fontWeight:700,color:T.teal,flexShrink:0}}>
                  {c.name?.split(" ").map(n=>n[0]).join("").toUpperCase().slice(0,2)||"?"}
                </div>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,fontWeight:600,
                    color:isOn?T.teal:T.textPri}}>{c.name}</div>
                  <div style={{fontSize:11,color:T.textTer}}>{c.clientId}</div>
                </div>
                <div style={{width:20,height:20,borderRadius:8,
                  border:`2px solid ${isOn?T.teal:T.border}`,
                  background:isOn?T.teal:"transparent",
                  display:"flex",alignItems:"center",justifyContent:"center",
                  flexShrink:0}}>
                  {isOn&&<span style={{fontSize:10,color:"#000",fontWeight:700}}>✓</span>}
                </div>
              </button>
            );
          })}
        </div>
        <Btn
          style={{width:"100%",background:assigning?T.bgRaise:T.teal,color:assigning?"#fff":"#000"}}
          disabled={currentAssigned.length===0||assigning}
          onClick={doAssign}>
          {assigning
            ? "Sending program…"
            : `Send to ${currentAssigned.length} athlete${currentAssigned.length!==1?"s":""}`}
        </Btn>
      </div>
    );
  }

  // ── Template list ──
  const GOAL_COLOR={Hypertrophy:T.accent, Strength:T.orange, Peak:T.purple};
  return(
    <div style={{animation:"fadeUp 0.45s cubic-bezier(0.22,1,0.36,1) both"}}>
      <div style={{marginBottom:20}}>
        <div style={{fontSize:22,fontWeight:700}}>Program Templates</div>
        <div style={{fontSize:13,color:T.textSec,marginTop:4}}>
          {templates.length} template{templates.length!==1?"s":""} · tap to preview
        </div>
      </div>

      {templates.map((t,i)=>{
        const assignedCount=(assigned[i]||[]).length;
        const isExpanded=expandedIdx===i;
        const col=GOAL_COLOR[t.goal]||T.accent;
        return(
          <Card key={i} style={{marginBottom:10}}>
            {/* Header row */}
            <div style={{display:"flex",justifyContent:"space-between",
              alignItems:"flex-start",marginBottom:8}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:14,fontWeight:700,marginBottom:2}}>{t.name}</div>
                <div style={{fontSize:12,color:T.textSec}}>

function CoachNotes({ allNotes, clients=[], onSendNote }){
  const [noteText,setNoteText]=useState("");
  const [selectedClientId,setSelectedClientId]=useState("");
  const [sent,setSent]=useState(false);
  const [showCompose,setShowCompose]=useState(false);

  function handleSend(){
    if(!noteText.trim()||!selectedClientId) return;
    const client=clients.find(c=>c.clientId===selectedClientId);
    onSendNote?.(selectedClientId, noteText.trim());
    setNoteText("");
    setSent(true);
    setTimeout(()=>setSent(false),2500);
    setShowCompose(false);
  }

  return(
    <div style={{animation:"fadeUp 0.45s cubic-bezier(0.22,1,0.36,1) both"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div>
          <div style={{fontSize:22,fontWeight:700}}>Notes</div>
          <div style={{fontSize:13,color:T.textSec,marginTop:2}}>{allNotes.length} note{allNotes.length!==1?"s":""} sent</div>
        </div>
        {clients.length>0&&(
          <button
              aria-label="Toggle compose note"
            onClick={()=>setShowCompose(v=>!v)}
            style={{display:"flex",alignItems:"center",gap:5,padding:"8px 14px",borderRadius:12,border:`1px solid ${showCompose?T.teal:T.border}`,background:showCompose?`${T.teal}15`:T.bgRaise,color:showCompose?T.teal:T.textSec,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",transition:"all 0.2s"}}>
            <span style={{fontSize:14}}>{showCompose?"✕":"✎"}</span>
            {showCompose?"Cancel":"New note"}
          </button>
        )}
      </div>

      {/* Success toast */}
      {sent&&(
        <div role="status" style={{background:`${T.success}15`,border:`1px solid ${T.success}40`,borderRadius:12,padding:"10px 14px",fontSize:12,color:T.success,marginBottom:12,animation:"fadeUp 0.3s ease both"}}>
          ✓ Note sent
        </div>
      )}

      {/* Inline compose panel */}
      {showCompose&&(
        <Card style={{marginBottom:16,border:`1px solid ${T.teal}40`,animation:"fadeUp 0.3s cubic-bezier(0.22,1,0.36,1) both"}}>
          <div style={{fontSize:12,fontWeight:700,color:T.teal,marginBottom:12}}>New coaching note</div>

          {/* Client picker */}
          <div style={{marginBottom:10}}>
            <label htmlFor="note-client-select" style={{display:"block",fontSize:10,color:T.textTer,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:5}}>Send to</label>
            <select
              id="note-client-select"
              value={selectedClientId}
              onChange={e=>setSelectedClientId(e.target.value)}
              style={{width:"100%",padding:"10px 12px",borderRadius:12,border:`1px solid ${selectedClientId?T.teal:T.border}`,background:T.bgInput,color:selectedClientId?T.textPri:T.textTer,fontSize:13,fontFamily:"inherit",outline:"none",cursor:"pointer",appearance:"none",WebkitAppearance:"none"}}>
              <option value="">Select a client…</option>
              {clients.map(c=>(
                <option key={c.clientId} value={c.clientId}>{c.name}</option>
              ))}
            </select>
          </div>

          {/* Note textarea */}
          <div style={{marginBottom:10}}>
            <label htmlFor="notes-compose-input" style={{display:"block",fontSize:10,color:T.textTer,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:5}}>Note</label>
            <textarea
              id="notes-compose-input"
              aria-label="Write coaching note"
              value={noteText}
              onChange={e=>setNoteText(e.target.value)}
              placeholder="Write your feedback, cue, or programme adjustment…"
              rows={3}
              style={{width:"100%",padding:"10px 12px",borderRadius:12,border:`1px solid ${T.border}`,background:T.bgInput,color:T.textPri,fontSize:13,fontFamily:"inherit",outline:"none",resize:"none",boxSizing:"border-box"}}
              onFocus={e=>e.target.style.borderColor=T.teal}
              onBlur={e=>e.target.style.borderColor=T.border}
            />
            <div style={{fontSize:10,color:T.textTer,marginTop:3,textAlign:"right"}}>{noteText.length} chars</div>
          </div>

          <Btn
            onClick={handleSend}
            disabled={!noteText.trim()||!selectedClientId}
            style={{width:"100%",background:T.teal,color:"#000"}}>
            Send note →
          </Btn>
        </Card>
      )}

      {/* Notes log */}
      {allNotes.length===0?(
        <Card style={{textAlign:"center",padding:"40px 20px"}}>
          <div style={{fontSize:32,marginBottom:12,opacity:0.3}}>✎</div>
          <div style={{fontSize:13,color:T.textSec,marginBottom:4}}>No notes sent yet.</div>
          <div style={{fontSize:12,color:T.textTer}}>{clients.length>0?"Tap 'New note' above to send your first note.":"Add a client first to send coaching notes."}</div>
        </Card>
      ):(
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {[...allNotes].reverse().map((n,i)=>(
            <Card key={i}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}>
                <div style={{fontSize:11,color:T.teal,fontWeight:700}}>To: {n.clientName}</div>
                <div style={{fontSize:10,color:T.textTer}}>{new Date(n.ts).toLocaleDateString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</div>
              </div>
              <div style={{fontSize:13,color:T.textSec,lineHeight:1.5}}>{n.text}</div>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
}
