// ─── Design tokens — theme-aware ─────────────────────────────
const THEMES = {
  dark: {
    bg:      "#0A0A0B",
    bgCard:  "#111114",
    bgRaise: "#18181C",
    bgInput: "#1E1E23",
    border:  "#2A2A32",
    borderHi:"#3A3A46",
    textPri: "#F0F0F2",
    textSec: "#8A8A96",
    textTer: "#6A6A7A",
  },
  light: {
    bg:      "#F5F5F7",

    bgRaise: "#EBEBED",
    bgInput: "#FFFFFF",
    border:  "#D1D1D6",
    borderHi:"#B0B0B8",
    textPri: "#1C1C1E",
    textSec: "#6E6E73",
    textTer: "#8E8E93",
  },
};

// T is built at render time from the active theme — see buildTheme()
// For module-level constants we use dark defaults
const T_DARK = {
  ...THEMES.dark,
  accent:  "#E8FF47",
  red:     "#FF4444",
  orange:  "#FF8C42",
  teal:    "#2DD4BF",
  blue:    "#3B82F6",
  purple:  "#A78BFA",
  success: "#4ADE80",
  warning: "#FBBF24",
  tsXs:10, tsSm:12, tsMd:14, tsLg:17, tsXl:22, ts2xl:28, ts3xl:38,
  sp1:4, sp2:8, sp3:12, sp4:16, sp5:20, sp6:24, sp8:32, sp10:40,
};

// Module-level T — overwritten per render via buildTheme
let T = {...T_DARK};

function buildTheme(mode="dark"){
  T = {
    ...T_DARK,
    ...THEMES[mode]||THEMES.dark,
    // Accent colors stay consistent across themes
    accent:  "#E8FF47",
    red:     "#FF4444",
    orange:  "#FF8C42",
    teal:    "#2DD4BF",
    blue:    "#3B82F6",
    purple:  "#A78BFA",
    success: "#4ADE80",
    warning: "#FBBF24",
    tsXs:10, tsSm:12, tsMd:14, tsLg:17, tsXl:22, ts2xl:28, ts3xl:38,
    sp1:4, sp2:8, sp3:12, sp4:16, sp5:20, sp6:24, sp8:32, sp10:40,
  };
  // In light mode, darken the accent slightly for better contrast
  if(mode==="light"){
    T.accent="#B8CC00"; // darker lime on white
    T.success="#2D9E5E";
    T.warning="#B87000";
    T.orange="#C45E00";
    T.teal="#1A9E8A";
    T.purple="#7B5EA7";
  }
  return T;
}

function makeGlobalCSS(theme){
  const t=buildTheme(theme);

body{

}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:${t.border};border-radius:4px;}
:focus-visible{

}
input:focus-visible,textarea:focus-visible{outline:none;}
/* ── Animations — spring easing, generous duration ── */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(18px);}
  to  {opacity:1;transform:translateY(0);  }
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

}

.anim-fadeUp  {animation:fadeUp  0.45s cubic-bezier(0.22,1,0.36,1) both;}

.anim-fadeUp > *:nth-child(5){animation:fadeUp 0.45s cubic-bezier(0.22,1,0.36,1) 0.20s both;}
.anim-fadeUp > *:nth-child(6){animation:fadeUp 0.45s cubic-bezier(0.22,1,0.36,1) 0.24s both;}
.anim-fadeUp > *:nth-child(7){animation:fadeUp 0.45s cubic-bezier(0.22,1,0.36,1) 0.28s both;}

}

// ─── Fisher-Yates shuffle ─────────────────────────────────────
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function pickExercisesForDay(muscles, tag, splitType="2-major") {
  const chosen = [];
  const usedIds = new Set();

  const secondaryMuscles = {
    chest:["arms"], back:["arms"], legs:["shoulders"],
    shoulders:["arms"], arms:["chest"],
  };

  let targetMuscles=[...muscles];
  if(splitType==="1-major-1-sec"&&muscles.length===1){
    const sec=(secondaryMuscles[muscles[0]]||["arms"])[0];
    targetMuscles=[muscles[0],sec];
  }
  const isMajorSec=splitType==="1-major-1-sec"&&targetMuscles.length>=2;

  targetMuscles.forEach((muscle,mIdx)=>{
    const tagPool  = ALL_EXERCISES.filter(e=>e.muscleGroup===muscle&&e.goal===tag&&!usedIds.has(e.id));
    const fullPool = ALL_EXERCISES.filter(e=>e.muscleGroup===muscle&&!usedIds.has(e.id));

    // Need at least (count+1) exercises in tagPool to use it — otherwise fall back
    // to fullPool so there is enough variety to pick from
    const count = isMajorSec ? (mIdx===0 ? 2 : 1) : 2;
    const pool = tagPool.length >= count + 1 ? tagPool : fullPool;

    // Sort by difficulty descending to identify the "compound tier"
    const sorted = [...pool].sort((a,b)=>b.diff-a.diff);

    // Anchor = randomly chosen from the top-tier exercises (same max diff)
    // This prevents always locking in the same compound when multiple share peak diff
    const maxDiff = sorted[0]?.diff ?? 0;
    const topTier = sorted.filter(e=>e.diff===maxDiff);
    const shuffledTop = shuffle(topTier);
    const anchor = shuffledTop[0];

    // Fill remaining slots from a shuffled pool of the rest
    const rest = shuffle(sorted.filter(e=>e.id!==anchor?.id));

    if(anchor){ chosen.push(anchor); usedIds.add(anchor.id); }
    for(const ex of rest){
      if(chosen.filter(e=>e.muscleGroup===muscle).length>=count) break;
      if(!usedIds.has(ex.id)){ chosen.push(ex); usedIds.add(ex.id); }
    }
  });

  return chosen;
}

  const MUSCLE_LABELS = {
    chest:"Chest", back:"Back", legs:"Legs", shoulders:"Shoulders",
    arms:"Arms", core:"Core",
  };
  const secondaryMuscles = {
    chest:["arms"], back:["arms"], legs:["shoulders"],
    shoulders:["arms"], arms:["chest"],
  };
  let targetMuscles=[...muscles];
  if(splitType==="1-major-1-sec"&&muscles.length===1){
    const sec=(secondaryMuscles[muscles[0]]||["arms"])[0];
    targetMuscles=[muscles[0],sec];
  }
  if(splitType==="1-major-1-sec"&&targetMuscles.length>=2){
    const primary   = MUSCLE_LABELS[targetMuscles[0]] || targetMuscles[0];
    const secondary = MUSCLE_LABELS[targetMuscles[1]] || targetMuscles[1];
    return `${primary} + ${secondary} (accessory)`;
  }
  return targetMuscles.map(m=>MUSCLE_LABELS[m]||m).join(" + ");
}

// Fatigue score formula — returns 0–100
// Inputs: pump 1–5, soreness 1–5, avgRIR
// ═══════════════════════════════════════════════════════════════
// EXPERIENCE + GOAL AWARE VOLUME LANDMARKS
// MEV/MAV/MRV vary by training experience AND goal.
// Science basis: Israetel et al. + Helms, Morgan, Valdez (MASS)
//
// Multipliers vs Intermediate Hypertrophy baseline:
//   Beginner:     MEV lower (responds to less), MRV lower (can't recover as much)
//   Advanced:     MEV higher (needs more to stimulate), MRV higher (superior recovery)
//   Strength:     Lower absolute volume, higher intensity per set
//   Peak:         Minimum volume to maintain, MRV = MEV (no volume building)
// ═══════════════════════════════════════════════════════════════

const BASE_LANDMARKS = {
  // Intermediate Hypertrophy baseline (research-validated midpoints)
  chest:      { mev:8,  mav:14, mrv:22 },
  deltoids:   { mev:6,  mav:12, mrv:20 },
  back:       { mev:10, mav:16, mrv:26 },
  biceps:     { mev:4,  mav:10, mrv:20 },
  triceps:    { mev:4,  mav:12, mrv:18 },
  forearms:   { mev:2,  mav:6,  mrv:14 },
  traps:      { mev:4,  mav:8,  mrv:14 },
  core:       { mev:4,  mav:10, mrv:16 },
  obliques:   { mev:4,  mav:8,  mrv:14 },
  quads:      { mev:8,  mav:14, mrv:22 },
  hamstrings: { mev:6,  mav:12, mrv:20 },
  glutes:     { mev:4,  mav:10, mrv:16 },
  calves:     { mev:6,  mav:10, mrv:16 },
};

// Returns MEV/MAV/MRV adjusted for goal + experience
function getMuscleVolumeLandmarks(muscle, goal="Hypertrophy", exp="Intermediate"){
  const base = BASE_LANDMARKS[muscle] || { mev:4, mav:10, mrv:16 };

  // Experience multipliers (applied to all three landmarks)
  const expScale = { Beginner:0.70, Intermediate:1.00, Advanced:1.30 };
  const scale    = expScale[exp] || 1.00;

  // Goal adjustments (relative to hypertrophy baseline)
  // Strength: fewer sets, higher intensity — roughly 60% of hypertrophy volume
  // Peak: maintenance only — MEV to MEV+2
  if(goal === "Strength"){
    return {
      mev: Math.round(base.mev * scale * 0.55),
      mav: Math.round(base.mav * scale * 0.55),
      mrv: Math.round(base.mrv * scale * 0.60),
    };
  }
  if(goal === "Peak"){
    const mev = Math.round(base.mev * scale * 0.45);
    return { mev, mav: mev + 1, mrv: mev + 2 }; // tight band — maintenance only
  }
  // Hypertrophy (default)
  return {
    mev: Math.round(base.mev * scale),
    mav: Math.round(base.mav * scale),
    mrv: Math.round(base.mrv * scale),
  };
}

// Backwards-compatible MUSCLE_LANDMARKS for code that doesn't pass goal/exp
const MUSCLE_LANDMARKS = BASE_LANDMARKS;

// ── Experience-aware fatigue parameters ──────────────────────
// Beginners accumulate fatigue faster (lower work capacity, less neural efficiency)
// and recover slower (less adapted connective tissue, hormonal response)
// Advanced athletes accumulate more acute fatigue per session (higher absolute loads)
// but recover significantly faster (superior satellite cell response, adaptation)
const EXP_FATIGUE = {
  //                  score×  decay/day
  Beginner:     { mul:11, decay:0.78 },
  Intermediate: { mul:14, decay:0.85 },
  Advanced:     { mul:17, decay:0.90 },
};

function getExpFatigue(exp){
  return EXP_FATIGUE[exp] || EXP_FATIGUE.Intermediate;
}

function calcFatigueScore(pump, soreness, avgRIR, exp="Intermediate"){
  const p = Math.max(1,Math.min(5, pump    || 1));
  const s = Math.max(1,Math.min(5, soreness|| 1));
  const r = Math.max(0,Math.min(3, avgRIR  ?? 2));
  const raw = s*0.5 + p*0.3 + (3-r)*0.2;
  return Math.min(100, raw * getExpFatigue(exp).mul);
}

function applyFatigueDecay(fatigue, days=1, exp="Intermediate"){
  const { decay } = getExpFatigue(exp);
  const next = {};
  for(const m of ALL_TRACKED_MUSCLES){
    next[m] = Math.max(0, (fatigue[m]||0) * Math.pow(decay, days));
  }
  return next;
}

// Map fatigue% → colour for SVG fill
function fatigueColor(pct){
  if(pct <= 0)   return null;             // no data — use default grey
  if(pct < 30)   return "#4ADE80";        // green — recovered
  if(pct < 55)   return "#FCD34D";        // amber — moderate
  if(pct < 75)   return "#FB923C";        // orange — elevated
  return         "#F87171";               // red — high fatigue
}

// Build CSS overrides for fatigue coloring on SVG paths
// Returns a CSS string to inject into <style>
function buildFatigueCSS(fatigue, viewClass){
  if(!fatigue) return "";
  return ALL_TRACKED_MUSCLES.map(m=>{
    const col = fatigueColor(fatigue[m]||0);
    if(!col) return "";
    return `.${viewClass}[data-muscle="${m}"]{fill:${col}!important;opacity:0.9;}`;
  }).join('');
}

// Update fatigue after a completed session
// sessionData: { loggedSets, soreness, overallRPE, timestamp }
// program: used to know today's exercise patterns
// prevFatigue: existing fatigue map
// prevTimestamp: timestamp of last session (for decay calc)
function updateMuscleFatigue(sessionData, patterns=[], prevFatigue={}, prevTimestamp=null, exp="Intermediate"){
  const now = sessionData.timestamp || Date.now();
  const daysElapsed = prevTimestamp
    ? Math.floor((now - prevTimestamp) / 86400000)
    : 0;
  let fatigue = daysElapsed > 0
    ? applyFatigueDecay(prevFatigue, daysElapsed, exp)
    : {...prevFatigue};

  const sets = sessionData.loggedSets || [];
  const avgPump   = sets.length ? sets.reduce((a,s)=>a+(s.pump||3),0)/sets.length : 3;
  const avgRIR    = sets.length ? sets.reduce((a,s)=>a+s.rir,0)/sets.length : 2;
  const soreness  = sessionData.soreness || 2;
  const score     = calcFatigueScore(avgPump, soreness, avgRIR, exp);

  for(const pattern of patterns){
    const map = FATIGUE_MUSCLE_MAP[pattern];
    if(!map) continue;
    map.primary.forEach(m=>{
      fatigue[m] = Math.min(100, (fatigue[m]||0) + score);
    });
    map.secondary.forEach(m=>{
      fatigue[m] = Math.min(100, (fatigue[m]||0) + score*0.5);
    });
  }
  return { fatigue, timestamp: now };
}

function applyDecaySinceLastSession(fatigue, lastFatigueTimestamp, exp="Intermediate"){
  if(!lastFatigueTimestamp || !fatigue) return fatigue||{};
  const days = Math.floor((Date.now()-lastFatigueTimestamp)/86400000);
  if(days <= 0) return fatigue;
  return applyFatigueDecay(fatigue, days, exp);
}

// Fatigue suggestions — returns array of warning strings
function getFatigueSuggestions(fatigue){
  if(!fatigue) return [];
  const suggestions=[];
  const high   = ALL_TRACKED_MUSCLES.filter(m=>(fatigue[m]||0)>=75);
  const moderate = ALL_TRACKED_MUSCLES.filter(m=>(fatigue[m]||0)>=55&&(fatigue[m]||0)<75);
  const LABELS = {
    chest:"Chest",deltoids:"Shoulders",back:"Back",biceps:"Biceps",
    triceps:"Triceps",forearms:"Forearms",traps:"Traps",core:"Core",
    obliques:"Obliques",quads:"Quads",hamstrings:"Hamstrings",
    glutes:"Glutes",calves:"Calves",
  };
  high.forEach(m=>{
    suggestions.push({
      level:"high", muscle:m,
      label:LABELS[m]||m,
      msg:`${LABELS[m]||m} is highly fatigued — consider skipping or reducing volume today`,
    });
  });
  moderate.forEach(m=>{
    suggestions.push({
      level:"moderate", muscle:m,
      label:LABELS[m]||m,
      msg:`${LABELS[m]||m} has elevated fatigue — consider lighter loads or fewer sets`,
    });
  });
  return suggestions;
}

// ── Stimulus calculation ──────────────────────────────────────
// Returns 0–10. Combines pump (effort proxy), proximity to failure (RIR),
// and whether performance improved vs last session.
function calcStimulus(pump, avgRIR, performanceTrend){
  const p = Math.max(1, Math.min(5, pump     || 3));
  const r = Math.max(0, Math.min(3, avgRIR   ?? 2));
  const b = performanceTrend === 1 ? 1 : performanceTrend === -1 ? -1 : 0;
  return Math.max(0, Math.min(10,
    p * 0.4 + (3 - r) * 0.4 * (10/4.8) + b
  ));
}

// ── Performance tracking ──────────────────────────────────────
// Compares volume load (weight × reps) for each exercise across
// the two most recent sessions. Returns per-muscle trend map.
function calcPerformanceTrends(sessions){
  if(sessions.length < 2) return {};
  const last    = sessions[sessions.length - 1]?.loggedSets || [];
  const prev    = sessions[sessions.length - 2]?.loggedSets || [];
  const trends  = {};

  // Group by exercise for both sessions
  function byExercise(sets){
    return sets.reduce((acc, s) => {
      if(!acc[s.exercise]) acc[s.exercise] = [];
      acc[s.exercise].push(s);
      return acc;
    }, {});
  }
  const lastByEx = byExercise(last);
  const prevByEx = byExercise(prev);

  for(const ex of Object.keys(lastByEx)){
    if(!prevByEx[ex]) continue;
    // Volume load = sum(weight × reps) across all sets
    const lastVol = lastByEx[ex].reduce((a,s)=> a + (s.load||0)*(parseInt(s.reps)||0), 0);
    const prevVol = prevByEx[ex].reduce((a,s)=> a + (s.load||0)*(parseInt(s.reps)||0), 0);
    const muscle  = lastByEx[ex][0]?.muscleGroup || null;
    if(!muscle) continue;
    const trend = lastVol > prevVol * 1.01 ? 1 : lastVol < prevVol * 0.99 ? -1 : 0;
    // Take the best trend if multiple exercises hit the same muscle
    if(trends[muscle] === undefined || trend > trends[muscle]) trends[muscle] = trend;
  }
  return trends;
}

// Initial muscle state — starts at goal+exp appropriate MAV
function initMuscleState(goal="Hypertrophy", exp="Intermediate"){
  const state = {};
  for(const m of Object.keys(BASE_LANDMARKS)){
    const { mev, mav, mrv } = getMuscleVolumeLandmarks(m, goal, exp);
    state[m] = {
      fatigue:          0,
      stimulus:         0,
      performanceTrend: 0,
      volume:           mav,
      mev, mav, mrv,
    };
  }
  return state;
}

// ── Volume adjustment decision engine — experience-aware ───────
// Volume increment and fatigue thresholds differ by experience:
//   Beginner:     conservative (+1 only when very fresh, -1 on stress)
//   Intermediate: standard (+1 / hold / -2 / -3)
//   Advanced:     aggressive (+2 when progressing, -1 on mild fatigue)
function adjustMuscleVolume(muscleData, exp="Intermediate"){
  const { fatigue, performanceTrend, volume, mev, mrv } = muscleData;
  let newVolume = volume;

  if(exp === "Beginner"){
    // Beginners: smaller increments, more conservative thresholds
    if(fatigue > 75)         newVolume = Math.max(mev, volume - 2);
    else if(fatigue > 55 && performanceTrend <= 0) newVolume = volume - 1;
    else if(fatigue >= 45 && performanceTrend === 0) newVolume = volume; // hold
    else if(fatigue < 45 && performanceTrend >= 0) newVolume = volume + 1;
  } else if(exp === "Advanced"){
    // Advanced: larger increments when progressing, tighter fatigue tolerance
    if(fatigue > 82)         newVolume = Math.max(mev, volume - 4);
    else if(fatigue > 70 && performanceTrend <= 0) newVolume = volume - 2;
    else if(fatigue >= 55 && performanceTrend === 0) newVolume = volume;
    else if(fatigue < 55 && performanceTrend > 0)  newVolume = volume + 2;
    else if(fatigue < 55 && performanceTrend === 0) newVolume = volume + 1;
  } else {
    // Intermediate (default)
    if(fatigue > 85)         newVolume = Math.max(mev, volume - 3);
    else if(fatigue > 75 && performanceTrend <= 0) newVolume = volume - 2;
    else if(fatigue >= 60 && fatigue <= 75 && performanceTrend === 0) newVolume = volume;
    else if(fatigue < 60 && performanceTrend >= 0) newVolume = volume + 1;
  }

  return Math.max(mev, Math.min(mrv, newVolume));
}

// ── Weekly adaptation runner ──────────────────────────────────
// Called at end of each training week. Updates all muscle states.
// Returns updated muscleState object.
function runWeeklyAdaptation(muscleState, sessions, exp="Intermediate"){
  if(!muscleState || sessions.length === 0) return muscleState;

  const lastSession  = sessions[sessions.length - 1];
  const lastSets     = lastSession?.loggedSets || [];
  const avgPump      = lastSets.length ? lastSets.reduce((a,s)=>a+(s.pump||3),0)/lastSets.length : 3;
  const avgRIR       = lastSets.length ? lastSets.reduce((a,s)=>a+s.rir,0)/lastSets.length : 2;
  const trends       = calcPerformanceTrends(sessions);
  const updated      = {};

  for(const muscle of Object.keys(BASE_LANDMARKS)){
    const prev   = muscleState[muscle] || initMuscleState()[muscle];
    const trend  = trends[muscle] ?? prev.performanceTrend;
    const stim   = calcStimulus(avgPump, avgRIR, trend);
    const newVol = adjustMuscleVolume({ ...prev, performanceTrend: trend }, exp);

    updated[muscle] = {
      ...prev,
      stimulus:         +stim.toFixed(2),
      performanceTrend: trend,
      volume:           newVol,
    };
  }
  return updated;
}

// ── Exercise swap logic ───────────────────────────────────────
// If a secondary muscle is too fatigued for a given pattern,
// returns the safest alternative exercise from the library.
const SWAP_RULES = {
  // Pattern → { if secondary muscle fatigued > threshold → swap to this pattern }
  horizontal_push: { guard:"deltoids", threshold:80, swapTo:"fly",            reason:"High shoulder fatigue — isolate chest with fly instead" },
  vertical_push:   { guard:"triceps",  threshold:80, swapTo:"shoulder_abduct",reason:"High tricep fatigue — switch to lateral raises for pure delt stimulus" },
  horizontal_pull: { guard:"biceps",   threshold:80, swapTo:"rear_delt",      reason:"High bicep fatigue — use rear delt fly to spare elbow flexors" },
  elbow_flexion:   { guard:"forearms", threshold:75, swapTo:"elbow_flexion",  reason:"High forearm fatigue — use machine curl to reduce grip demand" },
  squat:           { guard:"back",     threshold:80, swapTo:"knee_extension", reason:"High lower back fatigue — substitute leg press or extension" },
  hip_hinge:       { guard:"back",     threshold:80, swapTo:"knee_flexion",   reason:"High back fatigue — switch to leg curl to spare erectors" },
};

// Returns swap suggestion or null
function getExerciseSwap(pattern, muscleState){
  const rule = SWAP_RULES[pattern];
  if(!rule) return null;
  const guardFatigue = muscleState?.[rule.guard]?.fatigue ?? 0;
  if(guardFatigue <= rule.threshold) return null;
  return {
    from:    pattern,
    to:      rule.swapTo,
    guard:   rule.guard,
    fatigue: Math.round(guardFatigue),
    reason:  rule.reason,
  };
}

// ── Smart recommendations ─────────────────────────────────────
// Generates prioritised coaching cards from current muscle state.
function getSmartRecommendations(muscleState, sessions, goal="Hypertrophy", exp="Intermediate"){
  if(!muscleState || sessions.length === 0) return [];
  const cfg = getGoalConfig(goal, exp);
  const recs = [];
  const LABELS = {
    chest:"Chest",deltoids:"Shoulders",back:"Back",biceps:"Biceps",
    triceps:"Triceps",forearms:"Forearms",traps:"Traps",core:"Core",
    obliques:"Obliques",quads:"Quads",hamstrings:"Hamstrings",
    glutes:"Glutes",calves:"Calves",
  };

  for(const [muscle, state] of Object.entries(muscleState)){
    const { fatigue, stimulus, performanceTrend, volume, mev, mrv } = state;
    const label = LABELS[muscle] || muscle;

    // 1. High fatigue
    if(fatigue > cfg.fatigue_red){
      const targetVol = adjustMuscleVolume(state, exp);
      recs.push({
        priority:3, type:"deload", icon:"–", muscle, label, color:"#F87171",
        title:`Reduce ${label} volume`,
        msg: exp==="Beginner"
          ? `${label} fatigue at ${Math.round(fatigue)}% — your body needs more recovery time. Drop to ${targetVol} sets and focus on form.`
          : fatigue>85
            ? `${label} aggressive deload needed (${Math.round(fatigue)}%). Current ${volume} → ${targetVol} sets.`
            : `${label} fatigue at ${Math.round(fatigue)}% — drop 2 sets to allow recovery. Current ${volume} → ${targetVol} sets.`,
      });
    }
    // 2. Elevated fatigue, still progressing — maintain
    else if(fatigue > cfg.fatigue_amber && performanceTrend > 0){
      recs.push({
        priority:2, type:"maintain", icon:"=", muscle, label, color:"#FCD34D",
        title:`Hold ${label} volume`,
        msg: exp==="Advanced"
          ? `${label} fatigue elevated (${Math.round(fatigue)}%) but performance trending up. Hold at ${volume} sets — don't push through at this level.`
          : `Performance improving but fatigue is elevated (${Math.round(fatigue)}%). Hold at ${volume} sets.`,
      });
    }
    // 3. Progressive overload opportunity
    else if(fatigue < cfg.optimalFatigue[1] && performanceTrend > 0 && stimulus < 5){
      recs.push({
        priority:2, type:"volume", icon:"+", muscle, label, color:"#4ADE80",
        title:`Progress ${label}`,
        msg: exp==="Beginner"
          ? `${label} is recovering well and improving. ${goal==="Strength"?"Increase load by 2.5kg on your next session.":"Add 1 working set next session — consistency beats intensity at this stage."}`
          : exp==="Advanced"
            ? `${label} primed for overload — fatigue ${Math.round(fatigue)}%, performance up. Add 2 sets and ${goal==="Strength"?"hit a new top single":"increase load 2.5–5%"} next session.`
            : `${label} ready to progress — fatigue manageable, performance improving. Add 1 set and increase load 2.5–5%.`,
      });
    }
    // 4. Insufficient stimulus
    else if(stimulus < 4 && performanceTrend <= 0 && sessions.length >= 2){
      recs.push({
        priority:1, type:"intensity", icon:"!", muscle, label, color:"#FB923C",
        title:`Increase ${label} effort`,
        msg: exp==="Beginner"
          ? `${label} stimulus score ${stimulus.toFixed(1)}/10. Focus on controlled technique and consistent progressive overload rather than training to failure.`
          : goal==="Strength"
            ? `${label} stimulus ${stimulus.toFixed(1)}/10. Add a heavy top single or cluster set — neural adaptations require high-force output.`
            : `${label} stimulus ${stimulus.toFixed(1)}/10. Reduce RIR to ${cfg.rir_target} and add a drop set or mechanical drop.`,
      });
    }
    // 5. Near MRV
    if(volume >= mrv - 1){
      recs.push({
        priority:3, type:"deload", icon:"!", muscle, label, color:"#F87171",
        title:`${label} near MRV`,
        msg: exp==="Beginner"
          ? `${label} at ${volume} sets — you're at your recovery ceiling. Deload now to consolidate gains.`
          : `${label} at ${volume}/${mrv} sets — approaching max recoverable volume. Plan a deload after this week.`,
      });
    }
  }

  return recs.sort((a,b)=>b.priority-a.priority).slice(0,6);
}

function runAPE({ pump, soreness, rir, sessions=[], muscleGroups=[] }) {
  // Clamp inputs to valid ranges
  const p = Math.max(0, Math.min(5, pump||0));
  const s = Math.max(0, Math.min(5, soreness||0));
  const r = Math.max(0, Math.min(5, rir||2));
  const results = [];

  // ── Fatigue / recovery signal ──
  if(s >= 4){
    results.push({
      icon:"–", type:"deload",
      msg:`Soreness ${s}/5 — high residual fatigue detected. Drop volume by 1 set per exercise and reduce load 5–10% until soreness clears.`,
    });
  } else if(s <= 1 && sessions.length >= 2){
    results.push({
      icon:"+", type:"volume",
      msg:`Soreness only ${s}/5 — recovery is excellent. Ready to absorb more volume. Consider adding 1 working set next session.`,
    });
  }

  // ── Pump / hypertrophy stimulus ──
  if(p >= 4 && r <= 2){
    results.push({
      icon:"+", type:"load+volume",
      msg:`Strong pump (${p}/5) with low RIR (${r}) — you're in the MAV zone. Increase load by 2.5 kg and hold volume steady next week.`,
    });
  } else if(p >= 4 && r >= 3){
    results.push({
      icon:"+", type:"volume",
      msg:`High pump (${p}/5) but RIR ${r} — stimulus is good, effort below ceiling. Add 1 set before increasing load.`,
    });
  } else if(p <= 2 && r <= 2){
    results.push({
      icon:"=", type:"technique",
      msg:`Low pump (${p}/5) despite low RIR ${r} — mind-muscle connection may be limiting. Focus on controlled eccentrics and peak contraction.`,
    });
  } else if(p <= 2 && r >= 3){
    results.push({
      icon:"+", type:"load",
      msg:`Low pump (${p}/5) and high RIR (${r}) — load is too light to drive stimulus. Increase working weight by 5% next session.`,
    });
  } else if(p === 3 && r <= 1){
    results.push({
      icon:"+", type:"volume",
      msg:`Moderate pump (${p}/5) at near-failure RIR ${r} — approaching MRV. Hold load, add 1 set if soreness stays below 3.`,
    });
  }

  // ── RIR / intensity signal (only if no other signal fired) ──
  if(results.length === 0){
    if(r >= 4){
      results.push({
        icon:"+", type:"load",
        msg:`RIR ${r} indicates too much reserve left. Increase working load by 5–7.5% and aim for RIR 1–2 next session.`,
      });
    } else if(r === 0){
      results.push({
        icon:"–", type:"intensity",
        msg:`Training to failure (RIR 0) — reduce intensity slightly. Leave 1 rep in reserve to preserve technique and manage fatigue.`,
      });
    } else {
      results.push({
        icon:"◆", type:"maintain",
        msg:`Pump ${p}/5 · Soreness ${s}/5 · RIR ${r} — well within MEV–MAV range. Maintain current volume and load for 1 more week before reassessing.`,
      });
    }
  }

  // ── Trend signal from multiple sessions ──
  if(sessions.length >= 3){
    const recent=sessions.slice(-3);
    const avgRecentRir=recent.flatMap(s=>s.loggedSets||[]).reduce((a,s,_,arr)=>a+s.rir/arr.length,0);
    if(avgRecentRir >= 3 && r < 2){
      results.push({
        icon:"+", type:"trend",
        msg:`Trend: RIR has been dropping over the last 3 sessions (avg ${avgRecentRir.toFixed(1)} → ${r}). Effort is increasing — good progressive overload signal.`,
      });
    }
    const recentSoreness=recent.map(s=>s.soreness||2);
    const trending=recentSoreness.every((v,i)=>i===0||v>=recentSoreness[i-1]);
    if(trending && recentSoreness[recentSoreness.length-1]>=3){
      results.push({
        icon:"!", type:"fatigue-trend",
        msg:`Soreness trending upward over last 3 sessions (${recentSoreness.join(" → ")}). Consider a deload week after this session.`,
      });
    }
  }

  return results;
}

function clamp(v,mn,mx){return Math.min(mx,Math.max(mn,v));}
function fmt(n){return Number.isInteger(n)?String(n):parseFloat(n.toFixed(1)).toString();}
// Unit-aware weight formatter — converts kg→lbs when prefs.units is not "kg"
const KG_TO_LBS = 2.20462;
function fmtW(kg, units="kg"){
  if(!units||units==="kg") return `${fmt(kg)} kg`;
  if(units==="lbs") return `${fmt(Math.round(kg*KG_TO_LBS*10)/10)} lbs`;
  return `${fmt(kg)} ${units}`; // custom unit label, no conversion
}

// ─── Set Logger ───────────────────────────────────────────────
function SetLogger({ exercise, setNum, onLog, onUndo, canUndo, units="kg" }){
  const defaultReps=parseInt((exercise.reps||"10").split("–")[0])||10;
  const [reps,setReps]=useState(defaultReps);
  const [load,setLoad]=useState(20);
  const [loadInput,setLoadInput]=useState("20"); // separate string for type-in
  const [rir,setRir]=useState(exercise.rir??2);
  const [pump,setPump]=useState(0);
  const [step,setStep]=useState("log");

  // Keep loadInput in sync when +/- changes load
  function adjustLoad(delta){
    const next=+(Math.max(0,Math.min(300,load+delta)).toFixed(2));
    setLoad(next);
    setLoadInput(String(next));
  }
  function handleLoadInput(val){
    setLoadInput(val);
    const parsed=parseFloat(val);
    if(!isNaN(parsed) && parsed>=0 && parsed<=300){
      setLoad(+(parsed.toFixed(2)));
    }
  }
  function handleLoadBlur(){
    // On blur snap to valid value
    const parsed=parseFloat(loadInput);
    const clamped=isNaN(parsed)?load:+(Math.max(0,Math.min(300,parsed)).toFixed(2));
    setLoad(clamped);
    setLoadInput(String(clamped));
  }

  if(step==="feedback"){
    return(
      <div style={{animation:"fadeUp 0.45s cubic-bezier(0.22,1,0.36,1) both"}}>
        <div style={{fontSize:12,color:T.textSec,marginBottom:10,fontFamily:"'SF Mono','Menlo',monospace"}}>SET {setNum} — {reps} reps @ {fmtW(load,units)} · RIR {rir}</div>
        <div style={{marginBottom:12}}>
          <div style={{fontSize:12,color:T.textSec,marginBottom:8,textTransform:"uppercase",letterSpacing:"0.05em"}}>
            Pump rating <span style={{fontSize:11,color:T.textTer,textTransform:"none",letterSpacing:0}}>(how good was the muscle contraction?)</span>
          </div>
          <StarRating value={pump} onChange={setPump} color={T.accent} label="Pump rating"/>
        </div>
        <div style={{display:"flex",gap:8}}>
          <Btn onClick={()=>onLog({reps,load,rir,pump})} style={{flex:1}}>Confirm & next set →</Btn>
          {canUndo&&<Btn variant="ghost" style={{padding:"12px 14px",fontSize:12}} onClick={()=>{onUndo();setStep("log");}} aria-label="Undo last set">← Undo</Btn>}
        </div>
      </div>
    );
  }

  const btnStyle={
    width:44,height:44,borderRadius:12,
    border:`1px solid ${T.border}`,background:T.bgRaise,
    color:T.textPri,fontSize:20,cursor:"pointer",
    display:"flex",alignItems:"center",justifyContent:"center",
    flexShrink:0,
  };

  return(
    <div style={{animation:"fadeUp 0.45s cubic-bezier(0.22,1,0.36,1) both"}}>
      <div style={{fontSize:12,color:T.textSec,marginBottom:14,textTransform:"uppercase",letterSpacing:"0.08em",fontFamily:"'SF Mono','Menlo',monospace"}}>Set {setNum} · {exercise.name}</div>

      {/* Perfectly symmetrical 3-col stepper — REPS | KG | RIR */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginBottom:12}}>
        {[
          {
            label:"REPS", value:reps, display:String(reps),
            onMinus:()=>setReps(v=>Math.max(1,v-1)),
            onPlus: ()=>setReps(v=>Math.min(30,v+1)),
            color:T.accent, isKg:false,
          },
          {
            label:"KG", value:load, display:fmtW(load,units),
            onMinus:()=>adjustLoad(-0.5),
            onPlus: ()=>adjustLoad(0.5),
            color:T.accent, isKg:true,
          },
          {
            label:"RIR", value:rir, display:String(rir),
            onMinus:()=>setRir(v=>Math.max(0,v-1)),
            onPlus: ()=>setRir(v=>Math.min(5,v+1)),
            color:T.teal, isKg:false,
          },
        ].map(col=>(
          <div key={col.label} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
            {/* Column label */}
            <div style={{fontSize:10,color:T.textTer,letterSpacing:"0.08em",fontWeight:700,
              textTransform:"uppercase",fontFamily:"'SF Mono','Menlo',monospace"}}>
              {col.label}
            </div>
            {/* Stepper row — fixed button widths so value box always has room */}
            <div style={{display:"flex",alignItems:"center",width:"100%",gap:3}}>
              <button
                aria-label={`Decrease ${col.label}`}
                onClick={col.onMinus}
                style={{
                  width:28,height:44,borderRadius:8,flexShrink:0,
                  border:`1px solid ${T.border}`,background:T.bgRaise,
                  color:T.textPri,fontSize:18,cursor:"pointer",
                  display:"flex",alignItems:"center",justifyContent:"center",
                }}>−</button>

              {col.isKg?(
                <input
                  type="number"
                  inputMode="decimal"
                  aria-label="Load weight"
                  min="0" max="9999"
                  value={loadInput}
                  onChange={e=>handleLoadInput(e.target.value)}
                  onBlur={e=>{ handleLoadBlur(); e.target.style.borderColor=T.border; }}
                  onFocus={e=>{ e.target.style.borderColor=col.color; e.target.select(); }}
                  style={{
                    flex:1,minWidth:0,width:0,
                    height:44,
                    textAlign:"center",
                    borderRadius:8,
                    border:`1px solid ${T.border}`,
                    background:T.bgRaise,
                    color:col.color,
                    fontSize:18,fontWeight:800,
                    fontFamily:"'SF Mono','Menlo',monospace",
                    outline:"none",
                    WebkitAppearance:"none",
                    MozAppearance:"textfield",
                  }}
                />
              ):(
                <div style={{
                  flex:1,minWidth:0,
                  height:44,
                  display:"flex",alignItems:"center",justifyContent:"center",
                  borderRadius:8,
                  background:T.bgRaise,
                  border:`1px solid ${T.border}`,
                  color:col.color,
                  fontSize:18,fontWeight:800,
                  fontFamily:"'SF Mono','Menlo',monospace",
                  userSelect:"none",
                }}>
                  {col.display}
                </div>
              )}

              <button
                aria-label={`Increase ${col.label}`}
                onClick={col.onPlus}
                style={{
                  width:28,height:44,borderRadius:8,flexShrink:0,
                  border:`1px solid ${T.border}`,background:T.bgRaise,
                  color:T.textPri,fontSize:18,cursor:"pointer",
                  display:"flex",alignItems:"center",justifyContent:"center",
                }}>+</button>
            </div>
          </div>
        ))}
      </div>

      {/* Quick load chips */}
      <div style={{display:"flex",gap:5,marginBottom:16,justifyContent:"center"}}>
        {[-5,-2.5,2.5,5].map(d=>(
          <button key={d}
            aria-label={`${d>0?"Increase":"Decrease"} load by ${Math.abs(d)} kg`}
            onClick={()=>adjustLoad(d)}
            style={{padding:"4px 10px",borderRadius:16,border:`1px solid ${T.border}`,background:T.bgRaise,
              color:d>0?T.accent:T.textSec,fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
            {d>0?"+"+d:d}
          </button>
        ))}
      </div>

      <div style={{display:"flex",gap:8}}>
        <Btn onClick={()=>setStep("feedback")} style={{flex:1}}>Log set ✓</Btn>
        {canUndo&&<Btn variant="ghost" style={{padding:"12px 14px",fontSize:12}} onClick={onUndo} aria-label="Undo last set">← Undo</Btn>}
      </div>
      <AbbrLegend terms={["RIR"]}/>
    </div>
  );
}

// AUTH SCREEN — with role selection
// ═══════════════════════════════════════════════════════════════
function AuthScreen({ onAuth }){
  const [view,setView]=useState("welcome"); // welcome | role | athlete-signup | coach-signup | login
  const [role,setRole]=useState(""); // "athlete" | "coach"
  const [name,setName]=useState(""); const [email,setEmail]=useState(""); const [password,setPassword]=useState("");
  const [goal,setGoal]=useState(""); const [exp,setExp]=useState("");
  const [loading,setLoading]=useState(false); const [error,setError]=useState("");

  async function doAthleteSignup(){
    if(!name.trim()){setError("Please enter your name.");return;}
    const emailValid=email.includes("@")&&email.includes(".")&&email.indexOf("@")>0&&email.length>4;
    if(!emailValid){setError("Enter a valid email.");return;}
    if(password.length<6){setError("Password must be 6+ characters.");return;}
    if(!goal){setError("Select your primary goal.");return;}
    if(!exp){setError("Select your experience level.");return;}
    setError("");setLoading(true);
    try{
      const clientId = generateClientId();
      // 1. Create Supabase auth user
      // 1. Create auth user
      await sbSignUp(email, password, { name, role:"athlete" });
      // 2. Sign in so session is established before RLS-protected insert
      const authUser = await sbSignIn(email, password);
      console.log("doAthleteSignup: signed in, uid =", authUser.id);
      // 3. Create profile row
      const userData = {
        id: authUser.id,
        name, email, goal, exp,
        role:"athlete", clientId, coachConsent:true,
      };
      await registerUser(userData);
      setPassword("");
      onAuth(userData);
    }catch(e){
      setError(e.message || "Signup failed — please try again.");
    }finally{
      setLoading(false);
    }
  }

  async function doCoachSignup(){
    if(!name.trim()){setError("Please enter your name.");return;}
    const emailValid=email.includes("@")&&email.includes(".")&&email.indexOf("@")>0&&email.length>4;
    if(!emailValid){setError("Enter a valid email.");return;}
    if(password.length<6){setError("Password must be 6+ characters.");return;}
    setError("");setLoading(true);
    try{
      const coachId = "C-" + generateClientId();
      // 1. Create auth user
      await sbSignUp(email, password, { name, role:"coach" });
      // 2. Sign in so session is established before RLS-protected insert
      const authUser = await sbSignIn(email, password);
      console.log("doCoachSignup: signed in, uid =", authUser.id);
      // 3. Create profile row
      const userData = {
        id: authUser.id,
        name, email,
        role:"coach", coachId, clientId:coachId,
        clients:[], notes:{},
      };
      await registerUser(userData);
      setPassword("");
      onAuth(userData);
    }catch(e){
      setError(e.message || "Signup failed — please try again.");
    }finally{
      setLoading(false);
    }
  }

  async function doLogin(){
    const emailValid=email.includes("@")&&email.includes(".")&&email.indexOf("@")>0&&email.length>4;
    if(!emailValid||!password){setError("Enter valid email and password.");return;}
    setError("");setLoading(true);
    try{
      const authUser = await sbSignIn(email, password);
      console.log("doLogin: signed in as", authUser.id);
      // Fetch their profile
      const { data: profile, error: profileError } = await sb.from("profiles")
        .select("*").eq("id", authUser.id).single();
      console.log("doLogin: profile =", profile, "error =", profileError);
      if(profileError) throw new Error("Profile error: " + profileError.message + " (code: " + profileError.code + ")");
      if(!profile) throw new Error("No profile row found for this account. The signup may have failed to save your profile — try signing up again.");

      // Fetch sessions + muscle state for athletes only (coaches have neither)
      let sessions = [], ms = null;
      if(profile.role === "athlete"){
        const { data: sData } = await sb.from("sessions")
          .select("*").eq("athlete_id", authUser.id)
          .order("completed_at", { ascending: false });
        sessions = sData || [];
        const { data: msData } = await sb.from("muscle_state")
          .select("*").eq("athlete_id", authUser.id).maybeSingle();
        ms = msData;
      }

      // Load program for athletes
      let program = null;
      if(profile.role === "athlete"){
        // Load the athlete's most recent self-created program
        // Use broad filter then pick in JS to avoid PostgREST null-comparison quirks
        const { data: progRows } = await sb.from("programs")
          .select("*")
          .eq("owner_id", authUser.id)
          .eq("is_template", false)
          .order("created_at", { ascending: false })
          .limit(10);

        // Pick first row that is self-created (no coach assignment) or accepted
        const progData = (progRows||[]).find(r=>
          r.assigned_by_coach === null &&
          (r.assignment_status === null ||
           r.assignment_status === "accepted" ||
           r.assignment_status === undefined)
        ) || null;

        console.log("doLogin: progRows=", progRows?.length, "picked=", progData?.name||"none");

        if(progData) program = {
          name:        progData.name,
          goal:        progData.goal,
          weeks:       progData.weeks,
          freq:        progData.freq,
          currentWeek: progData.current_week,
          days:        progData.days || [],
          _id:         progData.id,
        };
      }

      // Load clients and templates for coaches
      let coachClients = [];
      let coachTemplates = null;
      if(profile.role === "coach"){
        coachClients   = await fetchCoachClients(authUser.id);
        coachTemplates = await loadCoachTemplates(authUser.id);
      }

      // Load coach notes for athletes
      let coachNotes = [];
      if(profile.role === "athlete"){
        const { data: notesData } = await sb.from("coach_notes")
          .select("text, created_at")
          .eq("athlete_id", authUser.id)
          .order("created_at", { ascending: true });
        coachNotes = (notesData||[]).map(n=>({ text:n.text, ts:new Date(n.created_at).getTime() }));
      }

      const userData = {
        id:           profile.id,
        role:         profile.role,
        name:         profile.name,
        email:        profile.email,
        goal:         profile.goal,
        exp:          profile.exp,
        clientId:     profile.client_id,
        coachId:      profile.coach_id,
        coachConsent: profile.coach_consent,
        prefs:        profile.prefs || {},
        // Restore tier from prefs saved in Supabase
        tier:         (profile.prefs || {}).tier,
        sessions:     (sessions||[]).map(mapSession),
        muscleFatigue:ms?.fatigue || {},
        muscleState:  ms?.state   || {},
        program,
        coachClients,
        coachTemplates,
        coachNotes,
      };
      setPassword("");
      onAuth(userData);
    }catch(e){
      setError(e.message || "Login failed — check your email and password.");
    }finally{
      setLoading(false);
    }
  }

  const inputStyle={
    width:"100%",padding:"12px 14px",borderRadius:12,
    border:`1px solid ${T.border}`,background:T.bgInput,
    color:T.textPri,fontSize:14,fontFamily:"inherit",outline:"none",
  };

  // ── Welcome ──
  if(view==="welcome") return(
    <div style={{display:"flex",flexDirection:"column",justifyContent:"space-between",minHeight:"100vh",padding:"60px 28px 50px",animation:"fadeIn 0.35s ease both"}}>
      <div>
        <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:20}}>
          <IACMark size={52} variant="dark"/>
          <div>
            <div style={{fontSize:11,color:T.textTer,letterSpacing:"0.15em",textTransform:"uppercase",fontFamily:"'SF Mono','Menlo',monospace",marginBottom:4}}>Evidence-based training</div>
            <div style={{fontSize:28,fontWeight:800,lineHeight:1.1,letterSpacing:"-1px"}}>Iron <span style={{color:T.accent}}>Adaptive</span> Coach</div>
          </div>
        </div>
        <div style={{fontSize:14,color:T.textSec,marginTop:18,lineHeight:1.7}}>An intelligent coach that auto-regulates volume, load, and exercise selection — for athletes and their coaches.</div>
        <div style={{marginTop:28,display:"flex",flexDirection:"column",gap:10}}>
          {[["⚡","APE adaptive programming"],["◈","Goal-specific mesocycles"],["⊛","Coach-client monitoring platform"]].map(([icon,text])=>(
            <div key={text} style={{display:"flex",gap:12,alignItems:"center"}}>
              <div style={{width:32,height:32,borderRadius:12,background:`${T.accent}15`,border:`1px solid ${T.accent}30`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,color:T.accent,flexShrink:0}}>{icon}</div>
              <div style={{fontSize:13,color:T.textSec}}>{text}</div>
            </div>
          ))}
        </div>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        <Btn onClick={()=>setView("role")} style={{width:"100%",padding:"15px"}}>Get started →</Btn>
        <Btn variant="ghost" onClick={()=>setView("login")} style={{width:"100%",padding:"15px"}}>I already have an account</Btn>
      </div>
    </div>
  );

  // ── Role selection ──
  if(view==="role") return(
    <div style={{padding:"60px 24px 40px",animation:"slideUp 0.45s cubic-bezier(0.22,1,0.36,1) both",minHeight:"100vh",display:"flex",flexDirection:"column"}}>
      <button
              aria-label="Back to welcome" aria-label="Back"
              onClick={()=>setView("welcome")} style={{background:"none",border:"none",color:T.textSec,cursor:"pointer",fontSize:13,padding:0,marginBottom:36}}>← Back</button>
      <div style={{flex:1}}>
        <div style={{fontSize:26,fontWeight:700,marginBottom:8}}>Who are you?</div>
        <div style={{fontSize:14,color:T.textSec,marginBottom:32,lineHeight:1.6}}>We'll build your experience around your role.</div>

        {/* Athlete card */}
        <button onClick={()=>{setRole("athlete");setView("athlete-signup");}}
          style={{width:"100%",textAlign:"left",padding:20,borderRadius:16,border:`2px solid ${T.border}`,background:T.bgCard,cursor:"pointer",marginBottom:14,transition:"all 0.2s"}}
          onMouseEnter={e=>{e.currentTarget.style.borderColor=T.accent;e.currentTarget.style.background=`${T.accent}08`;}}
          onMouseLeave={e=>{e.currentTarget.style.borderColor=T.border;e.currentTarget.style.background=T.bgCard;}}>
          <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:10}}>
            <div style={{width:44,height:44,borderRadius:12,background:`${T.accent}18`,border:`1px solid ${T.accent}40`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>▶</div>
            <div>
              <div style={{fontSize:17,fontWeight:700,color:T.textPri}}>I'm an Athlete</div>
              <div style={{fontSize:12,color:T.textSec,marginTop:2}}>Training, tracking, and progress</div>
            </div>
          </div>
          <div style={{fontSize:12,color:T.textTer,lineHeight:1.6}}>
            Get a personalised program, track your sessions, and let the APE engine adapt your training. You'll receive a unique Client ID to share with your coach.
          </div>
        </button>

        {/* Coach card */}
        <button onClick={()=>{setRole("coach");setView("coach-signup");}}
          style={{width:"100%",textAlign:"left",padding:20,borderRadius:16,border:`2px solid ${T.border}`,background:T.bgCard,cursor:"pointer",transition:"all 0.2s"}}
          onMouseEnter={e=>{e.currentTarget.style.borderColor=T.teal;e.currentTarget.style.background=`${T.teal}08`;}}
          onMouseLeave={e=>{e.currentTarget.style.borderColor=T.border;e.currentTarget.style.background=T.bgCard;}}>
          <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:10}}>
            <div style={{width:44,height:44,borderRadius:12,background:`${T.teal}18`,border:`1px solid ${T.teal}40`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0,color:T.teal}}>◈</div>
            <div>
              <div style={{fontSize:17,fontWeight:700,color:T.textPri}}>I'm a Coach</div>
              <div style={{fontSize:12,color:T.textSec,marginTop:2}}>Monitor and manage clients</div>
            </div>
          </div>
          <div style={{fontSize:12,color:T.textTer,lineHeight:1.6}}>
            Add clients by their Client ID. View their sessions, assign programs, track volume and fatigue, and send coaching notes — all in one place.
          </div>
        </button>
      </div>
    </div>
  );

  // ── Athlete signup ──
  if(view==="athlete-signup") return(
    <div style={{padding:"50px 24px 40px",animation:"slideUp 0.45s cubic-bezier(0.22,1,0.36,1) both",minHeight:"100vh",display:"flex",flexDirection:"column"}}>
      <button
              aria-label="Back to role selection" aria-label="Back to role selection"
              onClick={()=>setView("role")} style={{background:"none",border:"none",color:T.textSec,cursor:"pointer",fontSize:13,padding:0,marginBottom:24}}>← Back</button>
      <div style={{flex:1}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>

        {error&&<div role="alert" style={{background:`${T.red}15`,border:`1px solid ${T.red}40`,borderRadius:12,padding:"10px 14px",fontSize:12,color:T.red,marginBottom:14}}>{error}</div>}
        <TextInput label="Full name" value={name} onChange={setName} placeholder="Your name" maxLength={60}/>
        <TextInput label="Email" value={email} onChange={setEmail} maxLength={120} type="email" placeholder="you@email.com"/>
        <TextInput label="Password" value={password} onChange={setPassword} type="password" placeholder="6+ characters"/>
        <div style={{marginBottom:14}}>
          <div id="goal-label" style={{fontSize:11,color:T.textSec,marginBottom:8,textTransform:"uppercase",letterSpacing:"0.08em"}}>Primary goal</div>

            ))}
          </div>
        </div>
        <div style={{marginBottom:22}}>
          <div id="exp-label" style={{fontSize:11,color:T.textSec,marginBottom:8,textTransform:"uppercase",letterSpacing:"0.08em"}}>Experience</div>

              <button key={l} onClick={()=>setExp(l)}
                aria-pressed={exp===l}
                style={{flex:1,padding:"9px 0",borderRadius:12,border:`1px solid ${exp===l?T.teal:T.border}`,background:exp===l?`${T.teal}15`:T.bgRaise,color:exp===l?T.teal:T.textSec,fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit",transition:"all 0.15s"}}>

          <span style={{fontSize:11,color:T.textTer}}>Already have an account? </span>

              aria-label="Sign in instead" aria-label="Already have an account? Sign in"
              onClick={()=>setView("login")} style={{background:"none",border:"none",color:T.accent,fontSize:11,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>Sign in</button>
        </div>

      <div style={{flex:1}}>

        <TextInput label="Password" value={password} onChange={setPassword} type="password" placeholder="6+ characters"/>

        {/* Coach value props */}
        <div style={{marginBottom:22,padding:16,background:T.bgRaise,borderRadius:12,border:`1px solid ${T.border}`}}>
          <div style={{fontSize:12,fontWeight:600,marginBottom:10,color:T.textSec,textTransform:"uppercase",letterSpacing:"0.06em"}}>Coach dashboard includes:</div>
          {["Add clients by 6-char ID — no email required","View any client's sessions, program & fatigue","Assign custom programs remotely","Send session notes and coaching feedback","Real-time APE data for all clients"].map(f=>(
            <div key={f} style={{display:"flex",gap:8,marginBottom:7,alignItems:"flex-start"}}>
              <span style={{color:T.teal,fontSize:12,marginTop:1,flexShrink:0}}>✓</span>
              <span style={{fontSize:12,color:T.textSec}}>{f}</span>
            </div>
          ))}
        </div>

        <Btn onClick={doCoachSignup} style={{width:"100%",padding:"14px",background:T.teal,color:"#000"}} disabled={loading}>
          {loading?<><Spinner/> Creating coach account…</>:"Create coach account →"}
        </Btn>
        <div style={{textAlign:"center",marginTop:14}}>
          <span style={{fontSize:11,color:T.textTer}}>Already have an account? </span>
          <button aria-label="Sign in instead" onClick={()=>setView("login")} style={{background:"none",border:"none",color:T.accent,fontSize:11,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>Sign in</button>
        </div>
      </div>
    </div>
  );

  // ── Login ──
  return(
    <div style={{padding:"60px 24px 40px",animation:"slideUp 0.45s cubic-bezier(0.22,1,0.36,1) both",minHeight:"100vh",display:"flex",flexDirection:"column"}}>
      <button aria-label="Back" onClick={()=>setView("welcome")} style={{background:"none",border:"none",color:T.textSec,cursor:"pointer",fontSize:13,padding:0,marginBottom:32}}>← Back</button>
      <div style={{flex:1}}>
        <div style={{fontSize:28,fontWeight:700,marginBottom:6}}>Welcome back</div>
        <div style={{fontSize:13,color:T.textSec,marginBottom:28}}>Sign in to continue</div>
        {error&&<div role="alert" style={{background:`${T.red}15`,border:`1px solid ${T.red}40`,borderRadius:12,padding:"10px 14px",fontSize:12,color:T.red,marginBottom:14}}>{error}</div>}
        <TextInput label="Email" value={email} onChange={setEmail} maxLength={120} type="email" placeholder="you@email.com"/>
        <TextInput label="Password" value={password} onChange={setPassword} type="password" placeholder="••••••••"/>
        <div style={{marginBottom:16,fontSize:11,color:T.textTer}}>Coaches: include "coach" in your email to demo the coach interface.</div>
        <Btn onClick={doLogin} style={{width:"100%",padding:"14px"}} disabled={loading}>{loading?<><Spinner/> Signing in…</>:"Sign in →"}</Btn>
        <div style={{textAlign:"center",marginTop:18}}>
          <span style={{fontSize:12,color:T.textSec}}>No account? </span>
          <button
              aria-label="Back" onClick={()=>setView("role")} style={{background:"none",border:"none",color:T.accent,fontSize:12,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>Sign up free</button>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// SETUP WIZARD — shown on first login before any program exists
// ═══════════════════════════════════════════════════════════════
function SetupWizard({ user, prefs, onPrefsChange, onProgramReady }){
  const [step,setStep]=useState(0);
  const [goal,setGoal]=useState(user?.goal||"");
  const [freq,setFreq]=useState(4);
  const [splitType,setSplitType]=useState(prefs?.splitType||"2-major");
  const [bodyweight,setBodyweight]=useState(prefs?.bodyweight||"");
  const [units,setUnits]=useState(prefs?.units||"kg");
  const [animDir,setAnimDir]=useState("forward");

  function goNext(){ setAnimDir("forward"); setStep(s=>s+1); }
  function goBack(){ setAnimDir("back");    setStep(s=>s-1); }

  function generate(){
    setStep(4);
    onPrefsChange?.({...prefs, bodyweight, units, splitType});
    setTimeout(()=>{
      const g=goal||"Hypertrophy";
      const template=PROGRAM_TEMPLATES[g]?.[freq]||PROGRAM_TEMPLATES[g]?.[4]||PROGRAM_TEMPLATES.Hypertrophy[4];
      const days=template.map(d=>({
        ...d,
        focus: makeDayFocusLabel(d.muscles, splitType),
        exercises: pickExercisesForDay(d.muscles, d.tag, splitType),
      }));
      onProgramReady({name:`${g} Block A`,goal:g,weeks:6,freq,currentWeek:1,days});
    },1400);
  }

  const steps=[
    {
      icon:"◈", label:"Training goal",
      content:(
        <>
          <div style={{fontSize:13,color:T.textSec,marginBottom:20,lineHeight:1.6}}>
            This shapes your entire program — rep ranges, rest periods, exercise selection, and how the APE engine adapts your training week to week.
          </div>
          {[
            {id:"Hypertrophy",label:"Hypertrophy",sub:"8–15 reps · pump-driven · muscle growth"},
            {id:"Strength",   label:"Strength",   sub:"3–6 reps · load-driven · max force output"},
            {id:"Peak",    label:"Peak",    sub:"1–5 reps · competition prep · minimal volume"},
          ].map(g=>(
            <button key={g.id} onClick={()=>setGoal(g.id)}
              style={{width:"100%",textAlign:"left",padding:"14px 16px",marginBottom:8,borderRadius:12,
                border:`2px solid ${goal===g.id?T.accent:T.border}`,
                background:goal===g.id?`${T.accent}10`:T.bgRaise,
                cursor:"pointer",transition:"all 0.15s"}}>
              <div style={{fontSize:14,fontWeight:700,color:goal===g.id?T.accent:T.textPri}}>{g.label}</div>
              <div style={{fontSize:11,color:T.textSec,marginTop:2}}>{g.sub}</div>
            </button>
          ))}
        </>
      ),
      canNext:!!goal,
    },
    {
      icon:"▶", label:"Training days per week",
      content:(
        <>
          <div style={{fontSize:13,color:T.textSec,marginBottom:20,lineHeight:1.6}}>
            How many days per week can you consistently train? Be realistic — recovery is part of the program.
          </div>
          <div style={{display:"flex",gap:8,marginBottom:16}}>
            {[3,4,5].map(f=>(
              <button key={f} onClick={()=>setFreq(f)}
                style={{flex:1,padding:"20px 0",borderRadius:12,
                  border:`2px solid ${freq===f?T.accent:T.border}`,
                  background:freq===f?`${T.accent}10`:T.bgRaise,
                  cursor:"pointer",transition:"all 0.15s"}}>
                <div style={{fontSize:26,fontWeight:800,color:freq===f?T.accent:T.textPri,fontFamily:"'SF Mono','Menlo',monospace"}}>{f}</div>
                <div style={{fontSize:11,color:T.textSec,marginTop:4}}>days/week</div>
              </button>
            ))}
          </div>
          <div style={{padding:"10px 14px",background:T.bgRaise,borderRadius:12,fontSize:12,color:T.textTer}}>
            {freq===3?"3× — Lower frequency, higher volume per session. Good for beginners."
             :freq===4?"4× — Balanced split. Most popular choice for consistent gains."
             :"5× — High frequency. Best for advanced athletes with good recovery."}
          </div>
        </>
      ),
      canNext:true,
    },
    {
      icon:"◎", label:"Your bodyweight",
      content:(
        <>
          <div style={{fontSize:13,color:T.textSec,marginBottom:20,lineHeight:1.6}}>
            Your bodyweight lets the AI coach set personalised relative strength targets and scale load recommendations to your body.
          </div>
          <div style={{marginBottom:16}}>
            <div style={{fontSize:11,color:T.textSec,marginBottom:8,textTransform:"uppercase",letterSpacing:"0.06em"}}>Units</div>
            <div style={{display:"flex",gap:8}}>
              {["kg","lbs"].map(u=>(
                <button key={u} onClick={()=>setUnits(u)}
                  style={{padding:"8px 20px",borderRadius:8,border:`1px solid ${units===u?T.teal:T.border}`,
                    background:units===u?`${T.teal}18`:T.bgRaise,color:units===u?T.teal:T.textSec,
                    fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"'SF Mono','Menlo',monospace"}}>
                  {u}
                </button>
              ))}
            </div>
          </div>
          <div style={{fontSize:11,color:T.textSec,marginBottom:8,textTransform:"uppercase",letterSpacing:"0.06em"}}>Bodyweight ({units})</div>
          <input
            type="number"
            value={bodyweight}
            onChange={e=>setBodyweight(e.target.value)}
            placeholder={units==="lbs"?"e.g. 180":"e.g. 82"}
            style={{width:"100%",padding:"14px 16px",borderRadius:12,border:`1px solid ${T.border}`,
              background:T.bgInput,color:T.textPri,fontSize:18,fontFamily:"'SF Mono','Menlo',monospace",
              fontWeight:700,outline:"none",marginBottom:8}}
            onFocus={e=>e.target.style.borderColor=T.teal}
            onBlur={e=>e.target.style.borderColor=T.border}
          />
          {bodyweight&&(
            <div style={{padding:"10px 14px",background:`${T.teal}10`,borderRadius:12,border:`1px solid ${T.teal}30`,fontSize:12,color:T.textSec}}>
              Strength targets: Beginner {goal==="Strength"?"0.8×":"0.5×"} BW · Intermediate {goal==="Strength"?"1.5×":"1.0×"} BW · Advanced {goal==="Strength"?"2×":"1.5×"} BW
            </div>
          )}
          <div style={{marginTop:12,fontSize:11,color:T.textTer}}>You can update this any time in Profile → Weight & units.</div>
        </>
      ),
      canNext:true,
    },
    {
      icon:"◈",
      label:"Session structure",
      content:(
        <>
          <div style={{fontSize:13,color:T.textSec,marginBottom:20,lineHeight:1.6}}>
            Controls how each training day is split between muscle groups. This affects exercise count and training density per session.
          </div>
          {[
            {
              id:"2-major",
              label:"2 Major muscle groups",
              sub:"Higher total volume per session — e.g. Chest + Back with full exercise selection for both.",
              detail:"Best for: athletes who prefer fewer, longer sessions.",
            },
            {
              id:"1-major-1-sec",
              label:"1 Major + 1 Secondary",
              sub:"Focused primary muscle with one accessory group — e.g. Chest (2 exercises) + Shoulders (1 exercise).",
              detail:"Best for: athletes who prefer focused sessions with a supporting muscle.",
            },
          ].map(opt=>(
            <button key={opt.id} onClick={()=>setSplitType(opt.id)}
              style={{
                display:"block",width:"100%",textAlign:"left",
                marginBottom:10,padding:"14px 16px",borderRadius:12,
                border:`2px solid ${splitType===opt.id?T.accent:T.border}`,
                background:splitType===opt.id?`${T.accent}10`:T.bgRaise,
                cursor:"pointer",transition:"all 0.15s",
              }}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                <div style={{fontSize:14,fontWeight:700,
                  color:splitType===opt.id?T.accent:T.textPri}}>
                  {opt.label}
                </div>
                {splitType===opt.id&&(
                  <div style={{width:20,height:20,borderRadius:8,
                    background:`${T.accent}20`,
                    display:"flex",alignItems:"center",justifyContent:"center",
                    fontSize:11,color:T.accent,fontWeight:800,flexShrink:0}}>
                    ✓
                  </div>
                )}
              </div>
              <div style={{fontSize:12,color:T.textSec,lineHeight:1.5,marginBottom:4}}>
                {opt.sub}
              </div>
              <div style={{fontSize:11,color:T.textTer}}>{opt.detail}</div>
            </button>
          ))}
        </>
      ),
      canNext:true,
    },
  ];

  // Generating screen — step 4
  if(step===4) return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"60vh",animation:"fadeIn 0.35s ease both"}}>
      <div style={{width:64,height:64,borderRadius:16,background:`${T.accent}15`,border:`1px solid ${T.accent}30`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,marginBottom:20}}>⚡</div>
      <div style={{fontSize:20,fontWeight:700,marginBottom:8}}>Building your program</div>
      <div style={{fontSize:13,color:T.textSec,textAlign:"center",marginBottom:24,lineHeight:1.6}}>
        Generating a personalised {goal} block<br/>based on your profile…
      </div>
      <Spinner/>
    </div>
  );

  const current=steps[step];
  const animName=animDir==="forward"?"stepIn":"stepBack";

  return(
    <div style={{animation:"fadeUp 0.45s cubic-bezier(0.22,1,0.36,1) both"}}>
      {/* Header — stays static, only content animates */}
      <div style={{marginBottom:24}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
          <div style={{fontSize:22,transition:"all 0.3s ease"}}>{current.icon}</div>
          <div style={{fontSize:11,color:T.accent,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.1em",fontFamily:"'SF Mono','Menlo',monospace"}}>
            Step {step+1} of {steps.length}
          </div>
        </div>
        <div style={{fontSize:22,fontWeight:700,marginBottom:4}}>{current.label}</div>
        {/* Progress bar */}
        <div style={{height:3,background:T.border,borderRadius:2,marginTop:10}}>
          <div style={{height:"100%",width:`${((step+1)/steps.length)*100}%`,background:T.accent,borderRadius:2,transition:"width 0.4s ease"}}/>
        </div>
      </div>

      {/* Step content — animates in from direction of travel */}
      <div
        key={step}
        style={{marginBottom:24,animation:`${animName} 0.28s cubic-bezier(0.22,1,0.36,1) both`}}>
        {current.content}
      </div>

      {/* Actions */}
      <div style={{display:"flex",gap:10}}>
        {step>0&&(
          <Btn variant="ghost" onClick={goBack} style={{padding:"14px 20px"}}>← Back</Btn>
        )}
        {step<steps.length-1?(
          <Btn onClick={goNext} disabled={!current.canNext} style={{flex:1,padding:"14px"}}>
            Continue →
          </Btn>
        ):(
          <Btn onClick={generate} style={{flex:1,padding:"14px"}}>
            Generate my program →
          </Btn>
        )}
      </div>

      <div style={{textAlign:"center",marginTop:14,fontSize:11,color:T.textTer}}>
        You can change all of this later in your profile settings.
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════════════════════════════
function Dashboard({ onNavigate, user, program, sessions=[], currentDayIdx=0, prefs, onPrefsChange, onProgramReady, showOnboarding, onboardStep, onNextOnboard, onSkipOnboard, muscleFatigue={}, lastFatigueTs=null }){
  const today=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"});
  const todayDay=program?.days?.[currentDayIdx];
  const nextDayIdx=program?((currentDayIdx+1)%program.days.length):null;
  const nextDay=program?.days?.[nextDayIdx];
  const hasData=sessions.length>0;
  const totalSets=sessions.reduce((a,s)=>a+(s.loggedSets?.length||0),0);
  const lastSession=sessions[sessions.length-1];
  const avgPump=lastSession?.loggedSets?.length
    ?lastSession.loggedSets.reduce((a,s)=>a+(s.pump||3),0)/lastSession.loggedSets.length
    :null;
  const fatigueLabel=avgPump===null?"—":avgPump>=4?"High":avgPump>=3?"Moderate":"Low";
  const pumpFatigueColor=avgPump===null?T.textTer:avgPump>=4?T.orange:avgPump>=3?T.warning:T.success;

  // ── Coach-assigned program notification ──────────────────────────
  const [pendingCoachProgram,setPendingCoachProgram]=useState(null);
  const [acceptingProgram,setAcceptingProgram]=useState(false);

  // Check for pending coach assignments on mount and every 60 seconds
  useEffect(()=>{
    if(!user?.id || user?.role!=="athlete") return;
    async function checkPending(){
      const pending=await checkCoachAssignedProgram(user.id);
      if(pending) setPendingCoachProgram(pending);
    }
    checkPending();
    const interval=setInterval(checkPending, 60000);
    return()=>clearInterval(interval);
  },[user?.id]);

  async function handleAcceptCoachProgram(){
    if(!pendingCoachProgram) return;
    setAcceptingProgram(true);
    await acceptCoachProgram(pendingCoachProgram._id);
    // Activate the program in the app
    onProgramReady({
      name:        pendingCoachProgram.name,
      goal:        pendingCoachProgram.goal,
      weeks:       pendingCoachProgram.weeks,
      freq:        pendingCoachProgram.freq,
      days:        pendingCoachProgram.days,
      currentWeek: 1,
      _id:         pendingCoachProgram._id,
    });
    setPendingCoachProgram(null);
    setAcceptingProgram(false);
  }

  async function handleDeclineCoachProgram(){
    if(!pendingCoachProgram) return;
    await declineCoachProgram(pendingCoachProgram._id);
    setPendingCoachProgram(null);
  }

  // No program yet — show greeting + setup wizard inline
  if(!program){
    return(
      <div style={{animation:"fadeUp 0.45s cubic-bezier(0.22,1,0.36,1) both"}}>

        {/* Coach-assigned program notification — shown even before self-setup */}
        {pendingCoachProgram&&(
          <div style={{
            marginBottom:20,padding:"14px 16px",
            background:`${T.teal}0E`,
            border:`2px solid ${T.teal}40`,
            borderRadius:16,
            animation:"fadeUp 0.4s cubic-bezier(0.22,1,0.36,1) both",
          }}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
              <div style={{width:28,height:28,borderRadius:8,background:`${T.teal}20`,
                display:"flex",alignItems:"center",justifyContent:"center",
                fontSize:14,flexShrink:0}}>📋</div>
              <div>
                <div style={{fontSize:12,fontWeight:700,color:T.teal}}>
                  {pendingCoachProgram.coachName} sent you a program
                </div>
                <div style={{fontSize:11,color:T.textSec,marginTop:1}}>
                  {pendingCoachProgram.name} · {pendingCoachProgram.weeks} weeks · {pendingCoachProgram.freq}×/week
                </div>
              </div>
            </div>
            <div style={{display:"flex",gap:8}}>
              <Btn variant="ghost" style={{flex:1,fontSize:12}}
                onClick={handleDeclineCoachProgram}>
                Keep my own
              </Btn>
              <Btn style={{flex:2,background:T.teal,color:"#000",fontSize:12}}
                onClick={handleAcceptCoachProgram}
                disabled={acceptingProgram}>
                {acceptingProgram?"Activating…":"Accept program →"}
              </Btn>
            </div>
          </div>
        )}
        <div style={{marginBottom:20}}>
          <div style={{fontSize:11,color:T.textSec,letterSpacing:"0.1em",textTransform:"uppercase"}}>{today}</div>
          <div style={{fontSize:26,fontWeight:700,lineHeight:1.1,marginTop:4}}>
            Hey {user?.name?.split(" ")[0]},<br/>
            <span style={{color:T.accent}}>let's build your program.</span>
          </div>
          <div style={{fontSize:13,color:T.textSec,marginTop:8,lineHeight:1.5}}>
            Answer a few quick questions and Iron Coach will generate your first training block.
          </div>
        </div>
        <SetupWizard
          user={user}
          prefs={prefs}
          onPrefsChange={onPrefsChange}
          onProgramReady={onProgramReady}
        />
      </div>
    );
  }

  return(
    <div style={{animation:"fadeUp 0.45s cubic-bezier(0.22,1,0.36,1) both"}}>

      {/* Coach-assigned program notification — shown when athlete already has a program */}
      {pendingCoachProgram&&(
        <div style={{
          marginBottom:16,padding:"14px 16px",
          background:`${T.teal}0E`,
          border:`2px solid ${T.teal}40`,
          borderRadius:16,
          animation:"fadeUp 0.4s cubic-bezier(0.22,1,0.36,1) both",
        }}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
            <div style={{width:28,height:28,borderRadius:8,background:`${T.teal}20`,
              display:"flex",alignItems:"center",justifyContent:"center",
              fontSize:14,flexShrink:0}}>📋</div>
            <div>
              <div style={{fontSize:12,fontWeight:700,color:T.teal}}>
                {pendingCoachProgram.coachName} sent you a new program
              </div>
              <div style={{fontSize:11,color:T.textSec,marginTop:1}}>
                {pendingCoachProgram.name} · {pendingCoachProgram.weeks} weeks · {pendingCoachProgram.freq}×/week
              </div>
            </div>
          </div>
          <div style={{fontSize:11,color:T.textSec,marginBottom:10,lineHeight:1.5}}>
            Accepting will replace your current program. Your logged sessions are kept.
          </div>
          <div style={{display:"flex",gap:8}}>
            <Btn variant="ghost" style={{flex:1,fontSize:12}}
              onClick={handleDeclineCoachProgram}>
              Keep mine
            </Btn>
            <Btn style={{flex:2,background:T.teal,color:"#000",fontSize:12}}
              onClick={handleAcceptCoachProgram}
              disabled={acceptingProgram}>
              {acceptingProgram?"Activating…":"Switch to coach program →"}
            </Btn>
          </div>
        </div>
      )}

      <div style={{marginBottom:20}}>
        <div style={{fontSize:11,color:T.textTer,letterSpacing:"0.1em",textTransform:"uppercase"}}>{today}</div>
        <div style={{fontSize:26,fontWeight:700,lineHeight:1.1,marginTop:4}}>Hey {user?.name?.split(" ")[0]},<br/><span style={{color:T.accent}}>ready to train?</span></div>
      </div>

      {/* Onboarding carousel — in-page, matches coach tips style */}
      {showOnboarding&&(
        <AthleteOnboarding
          step={onboardStep}
          total={ONBOARD_STEPS.length}
          onNext={onNextOnboard}
          onSkip={onSkipOnboard}
        />
      )}
      {program&&(
        <Card style={{marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div style={{fontSize:13,fontWeight:600}}>{program.name}</div>
            <Badge color={T.purple}>{program.goal}</Badge>
          </div>
          <ProgressBar value={program.currentWeek} max={program.weeks}/>
          <div style={{display:"flex",justifyContent:"space-between",marginTop:5}}>
            <div style={{fontSize:11,color:T.textSec}}>Week {program.currentWeek}</div>
            <div style={{fontSize:11,color:T.textSec}}>{program.weeks} weeks total</div>
          </div>
        </Card>
      )}

      {/* Up next */}
      {nextDay&&sessions.length>0&&(
        <Card style={{marginBottom:12,border:`1px solid ${T.border}`}} onClick={()=>onNavigate("workout")}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{fontSize:10,color:T.textTer,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:4}}>Up next</div>
              <div style={{fontSize:15,fontWeight:700}}>{nextDay.focus}</div>
              <div style={{fontSize:11,color:T.textSec,marginTop:2}}>{nextDay.exercises.length} exercises</div>
            </div>
            <div style={{color:T.textTer,fontSize:18}}>›</div>
          </div>
        </Card>
      )}

      {/* Weekly summary — more useful than raw stats */}
      {hasData&&(()=>{
        const weekAgo=Date.now()-7*24*60*60*1000;
        const weekSessions=sessions.filter(s=>s.timestamp>weekAgo);
        const weekSets=weekSessions.reduce((a,s)=>a+(s.loggedSets?.length||0),0);
        // Real streak: count unique calendar days worked back from today without a gap
        const DAY_MS=24*60*60*1000;
        const todayMidnight=new Date(); todayMidnight.setHours(0,0,0,0);
        const trainedDays=new Set(sessions.map(s=>
          new Date(s.timestamp).toDateString()
        ));
        let streak=0;
        let check=new Date(todayMidnight);
        while(trainedDays.has(check.toDateString())){
          streak++;
          check=new Date(check.getTime()-DAY_MS);
        }
        // If today not trained yet, also check if yesterday was (streak still alive)
        if(streak===0){
          const yesterday=new Date(todayMidnight.getTime()-DAY_MS);
          check=new Date(yesterday);
          while(trainedDays.has(check.toDateString())){
            streak++;
            check=new Date(check.getTime()-DAY_MS);
          }
        }
        return(
          <Card style={{marginBottom:12,background:`linear-gradient(135deg,${T.bgCard},${T.bgRaise})`}}>
            <div style={{fontSize:11,color:T.textSec,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.08em"}}>This week</div>
            <div style={{display:"flex",gap:0}}>
              {[
                {label:"Sessions",value:weekSessions.length,color:T.accent},
                {label:"Sets",    value:weekSets,           color:T.teal},
                {label:"Streak",  value:`${streak}`,       color:T.orange},
              ].map(({label,value,color},i)=>(
                <div key={label} style={{flex:1,textAlign:"center",padding:"4px 0",borderRight:i<2?`1px solid ${T.border}`:"none"}}>
