                  <div style={{fontSize:10,color:T.textSec,marginTop:2}}>{label}</div>
                </div>
              ))}
            </div>
          </Card>
        );
      })()}

      {/* Muscle fatigue map — only when fatigue data exists AND user has logged sessions */}
      {sessions.length > 0 && Object.values(muscleFatigue).some(v=>v>5)&&(()=>{
        const hasFatigue = muscleFatigue;
        const suggestions = getFatigueSuggestions(hasFatigue);
        const highCount = suggestions.filter(s=>s.level==="high").length;
        // Build scoped CSS for fatigue colours on the mini diagram
        const fatigueCSS = buildFatigueCSS(hasFatigue,"mg-fatigue");
        // Top 3 fatigued muscles for summary
        const sorted = ALL_TRACKED_MUSCLES
          .filter(m=>(hasFatigue[m]||0)>5)
          .sort((a,b)=>(hasFatigue[b]||0)-(hasFatigue[a]||0))
          .slice(0,4);
        const LABELS={chest:"Chest",deltoids:"Shoulders",back:"Back",biceps:"Biceps",
          triceps:"Triceps",forearms:"Forearms",traps:"Traps",core:"Core",
          obliques:"Obliques",quads:"Quads",hamstrings:"Hamstrings",glutes:"Glutes",calves:"Calves"};
        return(
          <Card style={{marginBottom:12,border:`1px solid ${highCount>0?T.red+"50":T.border}`}}>
            <style>{`
              .mg-fatigue{fill:#5a5a66;stroke:#2a2d33;stroke-width:0.7;transition:fill 0.3s ease;}
              ${fatigueCSS}
            `}</style>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div>
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:1}}>
                  {highCount>0&&(
                    <div style={{width:7,height:7,borderRadius:"50%",
                      background:T.red,flexShrink:0}}/>
                  )}
                  <div style={{fontSize:12,fontWeight:700,
                    color:highCount>0?T.red:T.warning}}>
                    {highCount>0?"High fatigue detected":"Muscle fatigue map"}
                  </div>
                </div>
                <div style={{fontSize:11,color:T.textSec}}>
                  Based on last session · updates daily
                </div>
              </div>
              <button
                aria-label="View adaptation engine"
                onClick={()=>onNavigate("adapt")}
                style={{background:"none",border:"none",color:T.accent,
                  fontSize:11,cursor:"pointer",fontWeight:600,padding:0}}>
                Full report →
              </button>
            </div>

            {/* Mini dual SVG front+back */}
            <div style={{display:"flex",gap:12,alignItems:"flex-start",marginBottom:10}}>
              {["front","back"].map(view=>{
                const paths = view==="front" ? SVG_PATHS_FRONT : SVG_PATHS_BACK;
                const scoped = paths.replace(/class="mg"/g,'class="mg mg-fatigue"');
                return(
                  <div key={view} style={{flex:1,textAlign:"center"}}>
                    <div style={{fontSize:10,color:T.textSec,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:3}}>
                      {view}
                    </div>
                    {/* SVG_PATHS_FRONT/BACK are static constants — never user input */}
                    <svg width="100%" viewBox="80 45 340 540" fill="none"
                      dangerouslySetInnerHTML={{__html:scoped}}
                      style={{display:"block",maxWidth:90,margin:"0 auto"}}/>
                  </div>
                );
              })}
              {/* Muscle fatigue bars */}
              <div style={{flex:1,display:"flex",flexDirection:"column",gap:5}}>
                {sorted.map(m=>{
                  const pct = Math.round(hasFatigue[m]||0);
                  const col = fatigueColor(pct)||T.textTer;
                  return(
                    <div key={m}>
                      <div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}>
                        <span style={{fontSize:10,color:T.textSec}}>{LABELS[m]||m}</span>
                        <span style={{fontSize:10,color:col,fontWeight:700,fontFamily:"'SF Mono','Menlo',monospace"}}>{pct}%</span>
                      </div>
                      <div style={{height:4,borderRadius:2,background:T.bgRaise,overflow:"hidden"}}>
                        <div style={{width:`${pct}%`,height:"100%",background:col,borderRadius:2,transition:"width 0.4s ease"}}/>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Suggestions */}
            {suggestions.slice(0,2).map((s,i)=>(
              <div key={i} style={{
                display:"flex",gap:7,alignItems:"flex-start",
                background:s.level==="high"?`${T.red}10`:`${T.warning}10`,
                border:`1px solid ${s.level==="high"?T.red+"30":T.warning+"30"}`,
                borderRadius:8,padding:"6px 10px",marginBottom:4,
              }}>
                <span style={{fontSize:11,color:s.level==="high"?T.red:T.warning,flexShrink:0}}>
                  {s.level==="high"?"●":"◐"}
                </span>
                <span style={{fontSize:11,color:T.textSec,lineHeight:1.4}}>{s.msg}</span>
              </div>
            ))}

            {/* Colour legend */}
            <div style={{display:"flex",gap:10,marginTop:8}}>
              {[["#4ADE80","Recovered"],["#FCD34D","Moderate"],["#FB923C","Elevated"],["#F87171","High"]].map(([col,lbl])=>(
                <div key={lbl} style={{display:"flex",alignItems:"center",gap:3}}>
                  <div style={{width:7,height:7,borderRadius:2,background:col,flexShrink:0}}/>
                  <span style={{fontSize:10,color:T.textSec}}>{lbl}</span>
                </div>
              ))}
            </div>
          </Card>
        );
      })()}

      {/* Coach insight — primary AI voice on the Dashboard */}
      {hasData?(
        <Card style={{
          background:`${T.accent}0A`,
          border:`2px solid ${T.accent}35`,
          padding:"16px 16px",
        }}>
          {/* Header */}
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
            <div style={{
              width:30,height:30,borderRadius:8,
              background:`${T.accent}20`,
              display:"flex",alignItems:"center",justifyContent:"center",
              fontSize:14,color:T.accent,flexShrink:0,
            }}>⚡</div>
            <div>
              <div style={{fontSize:11,fontWeight:700,color:T.accent,
                textTransform:"uppercase",letterSpacing:"0.08em"}}>
                Coach insight
              </div>
              <div style={{fontSize:10,color:T.textTer,marginTop:1}}>
                Based on your last session
              </div>
            </div>
          </div>
          {/* Insight text — larger, more prominent */}
          <div style={{fontSize:14,color:T.textPri,lineHeight:1.6,marginBottom:12,fontWeight:500}}>
            {(()=>{
              const apeResults=runAPE({
                pump:avgPump||0,
                soreness:lastSession?.soreness||2,
                rir:lastSession?.loggedSets?.length
                  ? lastSession.loggedSets.reduce((a,s)=>a+s.rir,0)/lastSession.loggedSets.length
                  : 2,
                sessions,
              });
              return apeResults[0]?.msg || "Keep logging sessions — the engine will surface personalised recommendations as your data builds.";
            })()}
          </div>
          <button
            aria-label="View adaptation engine"
            onClick={()=>onNavigate("adapt")}
            style={{
              background:T.accent,border:"none",borderRadius:8,
              color:"#000",fontSize:12,fontWeight:700,
              cursor:"pointer",padding:"7px 14px",fontFamily:"inherit",
            }}>
            View full analysis →
          </button>
        </Card>
      ):(
        <Card style={{
          border:`1px solid ${T.accent}25`,
          background:`${T.accent}05`,
          padding:"20px 18px",
        }}>
          <div style={{display:"flex",gap:14,alignItems:"flex-start"}}>
            <div style={{
              width:40,height:40,borderRadius:12,flexShrink:0,
              background:`${T.accent}15`,
              display:"flex",alignItems:"center",justifyContent:"center",
              fontSize:18,color:T.accent,
            }}>⚡</div>
            <div style={{flex:1}}>
              <div style={{fontSize:14,fontWeight:700,color:T.textPri,marginBottom:5}}>
                Your AI coach is ready
              </div>
              <div style={{fontSize:12,color:T.textSec,lineHeight:1.6,marginBottom:12}}>
                Log your first session and Iron Coach will immediately analyse your pump, RIR, and soreness — then tell you exactly what to adjust next time.
              </div>
              <button
                onClick={()=>onNavigate("workout")}
                style={{
                  background:T.accent,border:"none",borderRadius:8,
                  color:"#000",fontSize:12,fontWeight:700,
                  cursor:"pointer",padding:"7px 14px",fontFamily:"inherit",
                }}>
                Start first session →
              </button>
            </div>
          </div>
        </Card>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// LIVE WORKOUT — with full exercise customisation
// ═══════════════════════════════════════════════════════════════
function WorkoutScreen({ onNavigate, program, onSessionComplete, currentDayIdx=0, prefs={} }){
  const units=prefs.units||"kg";
  const todayDay=program?.days?.[currentDayIdx];
  const nextDayIdx=program?((currentDayIdx+1)%program.days.length):null;
  const nextDay=program?.days?.[nextDayIdx];

  const [exercises,setExercises]=useState(()=>todayDay?.exercises||[]);
  const [exIdx,setExIdx]=useState(0);
  const [setNum,setSetNum]=useState(1);
  const [loggedSets,setLoggedSets]=useState([]);
  const [phase,setPhase]=useState("active");
  const [overallRPE,setOverallRPE]=useState(0);
  const [soreness,setSoreness]=useState(0);
  const [showFinish,setShowFinish]=useState(false);
  const [showAdd,setShowAdd]=useState(false);
  const [addSearch,setAddSearch]=useState("");
  const [addFilter,setAddFilter]=useState("all");
  const [pendingAdds,setPendingAdds]=useState([]); // exercises selected but not yet confirmed
  const [confirmEnd,setConfirmEnd]=useState(false);
  const [restJustDone,setRestJustDone]=useState(false);

  // Sync exercises when the program or current day changes.
  // Because WorkoutScreen is always mounted (display:none when inactive),
  // the useState initialiser only runs once — this effect keeps exercises
  // in sync when a new program is generated or the day advances.
  const todayDayId = todayDay ? `${currentDayIdx}-${todayDay.focus}` : null;
  React.useEffect(()=>{
    if(todayDay?.exercises?.length){
      setExercises(todayDay.exercises);
      setExIdx(0);
      setSetNum(1);
      setLoggedSets([]);
      setPhase("active");
      // Reset timer for new session
      setElapsed(0);
      setSessionStarted(false);
      startRef.current=null;
    }
  },[todayDayId]);

  // ── Touch swipe refs for exercise navigation ──
  const touchStartX=useRef(0);
  const touchStartY=useRef(0);
  const [cardSlideDir,setCardSlideDir]=useState(null); // "left"|"right"|null

  // ── Persistent elapsed timer — starts on first logged set, not on mount ──
  const [elapsed,setElapsed]=useState(0);
  const [paused,setPaused]=useState(false);
  const [sessionStarted,setSessionStarted]=useState(false);
  const tickRef=useRef(null);
  const startRef=useRef(null);

  useEffect(()=>{
    if(!sessionStarted) return; // don't tick until first set logged
    if(!startRef.current) startRef.current=Date.now();
    function tick(){
      if(!paused) setElapsed(Math.floor((Date.now()-startRef.current)/1000));
    }
    tickRef.current=setInterval(tick,500);
    return()=>clearInterval(tickRef.current);
  },[paused, sessionStarted]);

  // Call this when the first set is logged to start the timer
  function ensureTimerStarted(){
    if(!sessionStarted){
      startRef.current=Date.now();
      setSessionStarted(true);
    }
  }

  // When paused, freeze the reference point so elapsed doesn't jump on resume
  const pausedElapsedRef=useRef(0);
  function togglePause(){
    if(!paused){
      pausedElapsedRef.current=elapsed;
      setPaused(true);
      clearInterval(tickRef.current);
    } else {
      // Shift startRef so elapsed continues from where it stopped
      startRef.current=Date.now()-pausedElapsedRef.current*1000;
      setPaused(false);
    }
  }

  // ── Stable rest timer (survives nav) ──
  const [restRemaining,setRestRemaining]=useState(0);
  const [restRunning,setRestRunning]=useState(false);
  const restEndRef=useRef(null);   // absolute timestamp when rest ends
  const restTickRef=useRef(null);
  const restDuration=program?.goal==="Strength"?180:90;

  // Track which exercise owns the current rest period
  // When the user swipes to a different exercise the timer pauses visually;
  // returning to the owner exercise resumes it. Tab navigation (display:none)
  // has no effect — the timer keeps running in the background.
  const [restOwnerExIdx,setRestOwnerExIdx]=useState(null);
  const isRestOwner = restOwnerExIdx === exIdx;

  function startRest(){
    restEndRef.current=Date.now()+restDuration*1000;
    setRestRemaining(restDuration);
    setRestRunning(true);
    setRestOwnerExIdx(exIdx);
  }
  function skipRest(){
    setRestRunning(false);
    setRestRemaining(0);
    setRestOwnerExIdx(null);
    handleRestDone();
  }
  function addRestTime(s){
    restEndRef.current=(restEndRef.current||Date.now())+s*1000;
  }
  function toggleRestPause(){
    setRestRunning(r=>{
      if(r){
        const rem=Math.max(0,Math.ceil((restEndRef.current-Date.now())/1000));
        restEndRef.current=Date.now()+rem*1000;
      }
      return !r;
    });
  }

  useEffect(()=>{
    if(!restRunning){ clearInterval(restTickRef.current); return; }
    restTickRef.current=setInterval(()=>{
      const rem=Math.max(0,Math.ceil((restEndRef.current-Date.now())/1000));
      setRestRemaining(rem);
      if(rem<=0){
        clearInterval(restTickRef.current);
        setRestRunning(false);
        setRestOwnerExIdx(null);
        handleRestDone();
      }
    },250);
    return()=>clearInterval(restTickRef.current);
  },[restRunning]);

  const elapsedStr = sessionStarted
    ? `${Math.floor(elapsed/60)}:${String(elapsed%60).padStart(2,"0")}`
    : "0:00";
  const setsPerEx=program?.goal==="Strength"?5:3;
  const totalSets=exercises.length*setsPerEx;
  const completedSets=loggedSets.length;
  const currentEx=exercises[exIdx];

  // Current set number: how many sets logged for this exercise + 1
  // This updates immediately when a set is logged, even during rest phase
  const setsLoggedForCurrent=loggedSets.filter(s=>s.exercise===currentEx?.name).length;
  const currentSetDisplay=Math.min(setsLoggedForCurrent+1, setsPerEx);

  function handleLog(data){
    ensureTimerStarted(); // start timer on first logged set
    setLoggedSets(p=>[...p,{...data,exercise:currentEx.name,muscleGroup:currentEx.muscleGroup}]);
    setPhase("rest");
    startRest();
  }
  function handleRestDone(){
    setRestJustDone(true);
    setTimeout(()=>setRestJustDone(false),800);
    if(setNum<setsPerEx){setSetNum(s=>s+1);setPhase("active");}
    else if(exIdx<exercises.length-1){setExIdx(i=>i+1);setSetNum(1);setPhase("active");}
    else setPhase("done");
  }
  function handleUndo(){
    if(loggedSets.length===0)return;
    setLoggedSets(p=>p.slice(0,-1));
    // step back set counter
    if(setNum>1){ setSetNum(s=>s-1); }
    else if(exIdx>0){ setExIdx(i=>i-1); setSetNum(setsPerEx); }
    setPhase("active");
  }
  function removeEx(idx){
    if(exercises.length<=1)return;
    const next=exercises.filter((_,i)=>i!==idx);
    setExercises(next);
    if(exIdx>=next.length)setExIdx(next.length-1);
  }
  function addEx(ex){if(!exercises.find(e=>e.id===ex.id))setExercises(p=>[...p,ex]);setShowAdd(false);setAddSearch("");}
  function moveEx(idx,dir){
    const a=[...exercises];const s=idx+dir;
    if(s<0||s>=a.length)return;
    [a[idx],a[s]]=[a[s],a[idx]];setExercises(a);
    if(exIdx===idx)setExIdx(s);else if(exIdx===s)setExIdx(idx);
  }

  const equipLabel={barbell:"BAR",dumbbell:"DB",cable:"CBL",machine:"MCH",bodyweight:"BW"};

  // Add exercise panel
  if(showAdd){
    const groups=["all",...Object.keys(EXERCISES)];
    const seen=new Set();
    const allUnique=ALL_EXERCISES.filter(ex=>{
      if(seen.has(ex.name)) return false;
      seen.add(ex.name); return true;
    });
    const filtered=allUnique.filter(ex=>
      (addFilter==="all"||ex.muscleGroup===addFilter)&&
      ex.name.toLowerCase().includes(addSearch.toLowerCase())&&
      !exercises.find(e=>e.id===ex.id)&&
      !pendingAdds.find(e=>e.id===ex.id)
    );
    return(
      <div style={{
        position:"fixed",inset:0,
        background:T.bgApp,
        zIndex:300,
        display:"flex",flexDirection:"column",
        paddingTop:"env(safe-area-inset-top,0px)",
      }}>
        {/* Header */}
        <div style={{
          padding:"14px 16px 10px",
          borderBottom:`1px solid ${T.border}`,
          flexShrink:0,
        }}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div>
              <div style={{fontSize:17,fontWeight:800}}>Add exercises</div>
              {pendingAdds.length>0&&(
                <div style={{fontSize:11,color:T.accent,marginTop:1}}>
                  {pendingAdds.length} selected
                </div>
              )}
            </div>
            <button
              onClick={()=>{ setShowAdd(false); setPendingAdds([]); }}
              style={{background:"none",border:`1px solid ${T.border}`,
                borderRadius:8,color:T.textSec,cursor:"pointer",
                fontSize:12,fontWeight:700,padding:"5px 12px",fontFamily:"inherit"}}>
              Cancel
            </button>
          </div>

          {/* Selected chips */}
          {pendingAdds.length>0&&(
            <div style={{display:"flex",gap:5,overflowX:"auto",paddingBottom:4,marginBottom:6}}>
              {pendingAdds.map(ex=>(
                <div key={ex.id} style={{
                  display:"flex",alignItems:"center",gap:4,flexShrink:0,
                  padding:"3px 8px 3px 10px",borderRadius:20,
                  background:`${T.accent}18`,border:`1px solid ${T.accent}40`,
                  fontSize:10,fontWeight:700,color:T.accent,
                }}>
                  {ex.name}
                  <button onClick={()=>setPendingAdds(p=>p.filter(e=>e.id!==ex.id))}
                    style={{background:"none",border:"none",color:T.accent,
                      cursor:"pointer",fontSize:13,lineHeight:1,padding:"0 0 0 2px"}}>×</button>
                </div>
              ))}
            </div>
          )}

          {/* Search */}
          <div style={{position:"relative",marginBottom:8}}>
            <input value={addSearch}
              onChange={e=>setAddSearch(e.target.value)}
              placeholder="Search exercises…" autoFocus
              style={{width:"100%",padding:"8px 12px 8px 30px",borderRadius:10,
                border:`1px solid ${T.border}`,background:T.bgInput,
                color:T.textPri,fontSize:13,fontFamily:"inherit",outline:"none"}}/>
            <span style={{position:"absolute",left:9,top:"50%",transform:"translateY(-50%)",
              color:T.textTer,fontSize:11,fontFamily:"'SF Mono','Menlo',monospace"}}>⌕</span>
          </div>

          {/* Filter chips */}
          <div style={{display:"flex",gap:4,overflowX:"auto",paddingBottom:2}}>
            {groups.map(g=>(
              <button key={g} onClick={()=>setAddFilter(g)} style={{
                flexShrink:0,padding:"4px 10px",borderRadius:12,
                border:`1px solid ${addFilter===g?T.accent:T.border}`,
                background:addFilter===g?`${T.accent}18`:T.bgRaise,
                color:addFilter===g?T.accent:T.textSec,
                fontSize:10,fontWeight:700,cursor:"pointer",
                fontFamily:"inherit",textTransform:"capitalize",
              }}>{g}</button>
            ))}
          </div>
        </div>

        {/* Count */}
        <div style={{padding:"6px 16px",fontSize:10,color:T.textTer,
          fontFamily:"'SF Mono','Menlo',monospace",flexShrink:0}}>
          {filtered.length} exercise{filtered.length!==1?"s":""}
          {addFilter!=="all"?` · ${addFilter}`:""}
        </div>

        {/* Exercise list — fills all available space */}
        <div style={{flex:1,overflowY:"auto",padding:"0 16px"}}>
          <div style={{display:"flex",flexDirection:"column",gap:6,paddingBottom:8}}>
            {filtered.map(ex=>{
              const isPending=pendingAdds.find(e=>e.id===ex.id);
              return(
                <div key={ex.id}
                  onClick={()=>setPendingAdds(p=>
                    isPending ? p.filter(e=>e.id!==ex.id) : [...p,ex]
                  )}
                  style={{display:"flex",alignItems:"center",gap:10,
                    background:isPending?`${T.accent}10`:T.bgCard,
                    border:`1px solid ${isPending?T.accent:T.border}`,
                    borderRadius:12,padding:"9px 11px",cursor:"pointer",
                    transition:"all 0.12s"}}>
                  <div style={{width:30,height:30,borderRadius:8,
                    background:T.bgRaise,border:`1px solid ${T.border}`,
                    display:"flex",alignItems:"center",justifyContent:"center",
                    flexShrink:0}}>
                    <span style={{fontSize:9,fontWeight:700,
                      fontFamily:"'SF Mono','Menlo',monospace",color:T.textSec}}>
                      {equipLabel[ex.equip]||"—"}
                    </span>
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:12,fontWeight:700,
                      color:isPending?T.accent:T.textPri,
                      whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                      {ex.name}
                    </div>
                    <div style={{fontSize:10,color:T.textSec,textTransform:"capitalize"}}>
                      {ex.muscleGroup} · {ex.equip} · {ex.reps} reps
                    </div>
                  </div>
                  <div style={{
                    width:20,height:20,borderRadius:6,flexShrink:0,
                    border:`2px solid ${isPending?T.accent:T.border}`,
                    background:isPending?T.accent:"transparent",
                    display:"flex",alignItems:"center",justifyContent:"center",
                    fontSize:11,color:"#000",fontWeight:800,
                    transition:"all 0.12s",
                  }}>{isPending?"✓":""}</div>
                </div>
              );
            })}
            {filtered.length===0&&(
              <div style={{textAlign:"center",color:T.textTer,padding:40,fontSize:13}}>
                No exercises found{addFilter!=="all"?` in ${addFilter}`:""}
              </div>
            )}
          </div>
        </div>

        {/* Confirm button — sticky above bottom nav */}
        <div style={{
          padding:"10px 16px",
          padding:`10px 16px max(env(safe-area-inset-bottom,10px),10px)`,
          borderTop:`1px solid ${T.border}`,
          background:T.bgCard,
          flexShrink:0,
        }}>
          <button
            disabled={pendingAdds.length===0}
            onClick={()=>{
              pendingAdds.forEach(ex=>addEx(ex));
              setShowAdd(false);
              setPendingAdds([]);
            }}
            style={{
              width:"100%",padding:"13px",borderRadius:12,border:"none",
              background:pendingAdds.length>0?T.accent:T.bgRaise,
              color:pendingAdds.length>0?"#000":T.textTer,
              fontWeight:800,fontSize:14,cursor:pendingAdds.length>0?"pointer":"default",
              fontFamily:"inherit",transition:"all 0.2s",
            }}>
            {pendingAdds.length>0
              ? `Add ${pendingAdds.length} exercise${pendingAdds.length!==1?"s":""} →`
              : "Select exercises above to add"}
          </button>
        </div>
      </div>
    );
  }

  // Finish summary
  if(showFinish){
    const avgPump=loggedSets.reduce((a,s)=>a+(s.pump||3),0)/(loggedSets.length||1);
    const avgRir=loggedSets.reduce((a,s)=>a+s.rir,0)/(loggedSets.length||1);
    const ape=runAPE({pump:avgPump,soreness,rir:avgRir});
    return(
      <div style={{animation:"fadeUp 0.45s cubic-bezier(0.22,1,0.36,1) both"}}>
        <div style={{textAlign:"center",marginBottom:20}}>
          <div style={{fontSize:48,fontWeight:800,color:T.accent,fontFamily:"'SF Mono','Menlo',monospace",lineHeight:1}}>★</div>
          <div style={{fontSize:21,fontWeight:800,color:T.accent,marginTop:8}}>Workout complete</div>
          <div style={{fontSize:13,color:T.textSec,marginTop:4}}>{completedSets} sets · {elapsedStr} · {todayDay?.focus||"Custom"}</div>
        </div>
        <Card style={{marginBottom:12}}>
          <div style={{fontSize:11,color:T.textSec,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.08em"}}>Session summary</div>
          {exercises.map(ex=>{const sets=loggedSets.filter(s=>s.exercise===ex.name);return sets.length>0?(<div key={ex.id} style={{marginBottom:10}}><div style={{fontSize:12,fontWeight:700,marginBottom:3}}>{ex.name}</div>{sets.map((s,i)=><div key={i} style={{fontSize:11,color:T.textSec}}>{s.reps} × {fmtW(s.load,units)} · RIR {s.rir}</div>)}</div>):null;})}
        </Card>
        <Card style={{marginBottom:12,background:`${T.accent}08`,border:`1px solid ${T.accent}25`}}>
          <div style={{fontSize:12,fontWeight:700,color:T.accent,marginBottom:8}}>⚡ APE Adaptation</div>
          {ape.map((r,i)=><div key={i} style={{fontSize:13,color:T.textSec,lineHeight:1.5}}>{r.icon} {r.msg}</div>)}
        </Card>
        {nextDay&&(
          <Card style={{marginBottom:12,border:`1px solid ${T.teal}40`,background:`${T.teal}06`}}>
            <div style={{fontSize:11,color:T.teal,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:6}}>Up next</div>
            <div style={{fontSize:15,fontWeight:700,marginBottom:4}}>{nextDay.focus}</div>
            <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
              {nextDay.exercises.slice(0,3).map(ex=><div key={ex.id} style={{background:T.bgRaise,borderRadius:8,padding:"2px 7px",fontSize:10,color:T.textSec}}>{ex.name}</div>)}
              {nextDay.exercises.length>3&&<div style={{background:T.bgRaise,borderRadius:8,padding:"2px 7px",fontSize:10,color:T.textTer}}>+{nextDay.exercises.length-3}</div>}
            </div>
          </Card>
        )}
        <button
          aria-label="Back to dashboard"
          onClick={()=>onNavigate("dashboard")}
          style={{background:"none",border:"none",color:T.textSec,cursor:"pointer",
            fontSize:13,padding:"4px 0",minHeight:44,display:"flex",alignItems:"center",
            gap:4,fontFamily:"inherit",width:"100%",justifyContent:"center"}}>
          ← Back to home
        </button>
      </div>
    );
  }

  // Wrap-up
  if(phase==="done"){
    const RPE_LABELS  =["","Very easy","Easy","Moderate","Hard","Max effort"];
    const SORE_LABELS =["","No soreness","Mild","Moderate","Strong","Very sore"];
    return(
      <div style={{animation:"fadeUp 0.45s cubic-bezier(0.22,1,0.36,1) both"}}>
        <div style={{marginBottom:18}}><div style={{fontSize:20,fontWeight:800,marginBottom:6}}>Session wrap-up</div><div style={{fontSize:13,color:T.textSec}}>How did it feel?</div></div>
        <Card style={{marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:8}}>
            <div style={{fontSize:12,color:T.textSec}}>Overall RPE</div>
            {overallRPE>0&&<div style={{fontSize:11,color:T.orange,fontWeight:600}}>{RPE_LABELS[overallRPE]}</div>}
          </div>
          <StarRating value={overallRPE} onChange={setOverallRPE} color={T.orange} label="Overall RPE"/>
          <div style={{display:"flex",justifyContent:"space-between",marginTop:6}}>
            <span style={{fontSize:10,color:T.textTer}}>1 — Easy</span>
            <span style={{fontSize:10,color:T.textTer}}>5 — Max effort</span>
          </div>
        </Card>
        <Card style={{marginBottom:18}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:8}}>
            <div style={{fontSize:12,color:T.textSec}}>Expected muscle soreness</div>
            {soreness>0&&<div style={{fontSize:11,color:T.red,fontWeight:600}}>{SORE_LABELS[soreness]}</div>}
          </div>
          <StarRating value={soreness} onChange={setSoreness} color={T.red} label="Muscle soreness"/>
          <div style={{display:"flex",justifyContent:"space-between",marginTop:6}}>
            <span style={{fontSize:10,color:T.textTer}}>1 — None</span>
            <span style={{fontSize:10,color:T.textTer}}>5 — Very sore</span>
          </div>
        </Card>
        <Btn onClick={()=>{onSessionComplete?.({loggedSets,soreness,overallRPE});setShowFinish(true);}} style={{width:"100%"}} disabled={!overallRPE||!soreness}>Finish & get adaptation →</Btn>
      </div>
    );
  }

  // Confirm end dialog
  if(confirmEnd){
    return(
      <div style={{animation:"fadeUp 0.45s cubic-bezier(0.22,1,0.36,1) both",padding:"20px 0"}}>
        <div style={{fontSize:20,fontWeight:700,marginBottom:8}}>End this session?</div>
        <div style={{fontSize:14,color:T.textSec,marginBottom:6,lineHeight:1.6}}>
          You've logged <strong style={{color:T.textPri}}>{completedSets} sets</strong> in <strong style={{color:T.textPri}}>{elapsedStr}</strong>.
        </div>
        <div style={{fontSize:13,color:T.textTer,marginBottom:24,lineHeight:1.5}}>
          Your progress will be saved and you'll get your APE adaptation report.
        </div>
        <div style={{display:"flex",gap:8}}>
          <Btn variant="ghost" style={{flex:1}} onClick={()=>setConfirmEnd(false)}>Keep going</Btn>
          <Btn variant="danger" style={{flex:1}} onClick={()=>{setConfirmEnd(false);setPhase("done");}}>End workout</Btn>
        </div>
      </div>
    );
  }

  // Live session
  const restPct=restRemaining>0?(restRemaining/restDuration)*100:0;
  const restMins=Math.floor(restRemaining/60);
  const restSecs2=String(restRemaining%60).padStart(2,"0");

  // Smart tab label: show first 2 meaningful words, skip "Plate-Loaded/Pin-Select" prefixes
  // Build deduplicated tab labels for all exercises at once so collision detection works
  const tabLabels = (() => {
    const STRIP = /^(Plate-Load(?:ed|ing)\s+|Pin-Select\s+)/i;
    // First pass: generate 2-word candidate for each exercise
    const candidates = exercises.map(ex => {
      const cleaned = ex.name.replace(STRIP,"");
      const words = cleaned.split(" ");
      return words.slice(0,2).join(" ");
    });
    // Second pass: for any candidate shared by 2+ tabs, extend to 3 words or add equipment suffix
    const counts = {};
    candidates.forEach(c => { counts[c]=(counts[c]||0)+1; });
    return exercises.map((ex,i) => {
      if(counts[candidates[i]] > 1){
        const cleaned = ex.name.replace(STRIP,"");
        const words = cleaned.split(" ");
        // Try 3 words first, fall back to equip suffix
        if(words.length >= 3) return words.slice(0,3).join(" ");
        const suffix = {barbell:"BB",dumbbell:"DB",cable:"CBL",machine:"MCH",bodyweight:"BW"}[ex.equip]||"";
        return suffix ? `${candidates[i]} (${suffix})` : candidates[i];
      }
      return candidates[i];
    });
  })();

  return(
    <div style={{animation:"fadeUp 0.45s cubic-bezier(0.22,1,0.36,1) both"}}>
      {/* Header with pause */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:T.sp3}}>
        <div>
          <div style={{fontSize:11,color:T.textTer,fontFamily:"'SF Mono','Menlo',monospace",letterSpacing:"0.06em"}}>{(todayDay?.focus||"CUSTOM").toUpperCase()} · WEEK {program?.currentWeek||1}</div>
          <div style={{fontSize:T.tsLg,fontWeight:700,marginTop:2}}>Live session</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:T.sp2}}>
          <div role="timer" aria-label={`Session time: ${elapsedStr}`} style={{fontFamily:"'SF Mono','Menlo',monospace",color:paused?T.warning:T.accent,fontSize:T.tsMd,fontWeight:700}}>{elapsedStr}</div>
          <button
            aria-label={paused?"Resume session":"Pause session"}
            onClick={togglePause}
            style={{width:44,height:44,borderRadius:12,border:`1px solid ${paused?T.warning:T.border}`,background:paused?`${T.warning}18`:T.bgRaise,color:paused?T.warning:T.textSec,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
            {paused
              ? <PlayIcon size={13} color={T.warning}/>
              : <PauseIcon size={14} color={T.textSec}/>
            }
          </button>
        </div>
      </div>

      {paused&&(
        <div role="status" style={{marginBottom:T.sp3,padding:"10px 14px",background:`${T.warning}15`,border:`1px solid ${T.warning}40`,borderRadius:12,fontSize:13,color:T.warning,textAlign:"center"}}>
          Session paused — tap the play button to resume
        </div>
      )}

      <div style={{marginBottom:T.sp3}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
          <div style={{fontSize:12,color:T.textSec}} aria-label={`${completedSets} of ${totalSets} sets completed`}>{completedSets}/{totalSets} sets</div>
          <div style={{fontSize:12,color:T.textSec}}>Ex {exIdx+1}/{exercises.length}</div>
        </div>
        <ProgressBar value={completedSets} max={Math.max(totalSets,1)}/>
      </div>

      {/* Exercise navigation — swipe left/right on touch to cycle, tabs for quick jump */}
      <div
        role="tablist"
        aria-label="Exercises"
        onTouchStart={e=>{touchStartX.current=e.touches[0].clientX;touchStartY.current=e.touches[0].clientY;}}
        onTouchEnd={e=>{
          const dx=e.changedTouches[0].clientX-touchStartX.current;
          const dy=Math.abs(e.changedTouches[0].clientY-touchStartY.current);
          if(Math.abs(dx)<40||dy>Math.abs(dx)) return;
          // Only reset phase to active when no rest is running for this exercise.
          // If a rest is running, just move exIdx — the timer keeps ticking in background.
          if(dx<0&&exIdx<exercises.length-1){
            setCardSlideDir("left");
            setExIdx(i=>i+1);
            if(!restRunning) setPhase("active");
          } else if(dx>0&&exIdx>0){
            setCardSlideDir("right");
            setExIdx(i=>i-1);
            if(!restRunning) setPhase("active");
          }
        }}
        style={{display:"flex",gap:5,overflowX:"auto",paddingBottom:4,marginBottom:4,WebkitOverflowScrolling:"touch"}}>
        {exercises.map((ex,i)=>(
          <button
            key={ex.id}
            role="tab"
            aria-selected={i===exIdx}
            aria-label={ex.name}
            onClick={()=>{
              setExIdx(i);
              if(!restRunning) setPhase("active");
            }}
            style={{
              flexShrink:0,
              background:i===exIdx?T.accent:T.bgRaise,
              color:i===exIdx?"#000":T.textSec,
              border:`1px solid ${i===exIdx?T.accent:T.border}`,
              borderRadius:12,padding:"6px 11px",fontSize:11,
              cursor:"pointer",fontFamily:"inherit",fontWeight:700,
              transition:"all 0.15s",whiteSpace:"nowrap",
            }}>
            {tabLabels[i]}
          </button>
        ))}
        <button
          aria-label="Add exercise to session"
          onClick={()=>setShowAdd(true)}
          style={{flexShrink:0,background:"transparent",color:T.accent,border:`1px dashed ${T.accent}60`,borderRadius:12,padding:"6px 11px",fontSize:11,cursor:"pointer",fontWeight:700}}>
          + Add
        </button>
      </div>

      {/* Swipe hint + remove row */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:T.sp3}}>
        <div style={{display:"flex",alignItems:"center",gap:6,minWidth:0,flex:1,overflow:"hidden"}}>
          {exercises.length>1&&(
            <div style={{fontSize:10,color:T.textTer,display:"flex",alignItems:"center",gap:3,flexShrink:0}}>
              <span style={{opacity:exIdx>0?0.8:0.2}}>‹</span>
              <span>swipe</span>
              <span style={{opacity:exIdx<exercises.length-1?0.8:0.2}}>›</span>
            </div>
          )}
          <span style={{fontSize:11,color:T.textSec,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
            {currentEx?.name}
          </span>
        </div>
        <button
          aria-label="Remove this exercise from session"
          onClick={()=>removeEx(exIdx)}
          disabled={exercises.length<=1}
          style={{width:36,height:36,borderRadius:8,border:`1px solid ${T.red}40`,background:`${T.red}10`,color:exercises.length<=1?T.border:T.red,cursor:exercises.length<=1?"not-allowed":"pointer",fontSize:12,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginLeft:8}}>
          ✕
        </button>
      </div>

      {currentEx&&(
        <Card
          key={exIdx}
          style={{
            marginBottom:T.sp3,
            border:`1px solid ${T.accent}30`,
            animation: cardSlideDir==="left"?"stepIn 0.22s cubic-bezier(0.22,1,0.36,1) both"
                      :cardSlideDir==="right"?"stepBack 0.22s cubic-bezier(0.22,1,0.36,1) both"
                      :"none",
          }}
          onTouchStart={e=>{touchStartX.current=e.touches[0].clientX;touchStartY.current=e.touches[0].clientY;}}
          onTouchEnd={e=>{
            const dx=e.changedTouches[0].clientX-touchStartX.current;
            const dy=Math.abs(e.changedTouches[0].clientY-touchStartY.current);
            if(Math.abs(dx)<40||dy>Math.abs(dx)) return;
            if(dx<0&&exIdx<exercises.length-1){setCardSlideDir("left");setExIdx(i=>i+1);setSetNum(1);setPhase("active");}
            else if(dx>0&&exIdx>0){setCardSlideDir("right");setExIdx(i=>i-1);setSetNum(1);setPhase("active");}
          }}
        >
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:T.sp2}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:T.tsLg,fontWeight:700}}>{currentEx.name}</div>
              <div style={{fontSize:12,color:T.textSec,marginTop:3}}>{currentEx.reps} reps · RIR {currentEx.rir} · <span style={{color:T.textTer,textTransform:"capitalize"}}>{currentEx.equip}</span></div>
              {/* Bodyweight-relative strength target — shown when BW is set and exercise is a major compound */}
              {(()=>{
                const bw = parseFloat(prefs?.bodyweight);
                if(!bw || isNaN(bw)) return null;
                const BW_TARGETS = {
                  squat:      {mult:1.5, label:"Squat"},
                  hip_hinge:  {mult:1.75,label:"Deadlift"},
                  horizontal_push:{mult:1.0,label:"Bench"},
                  vertical_push:  {mult:0.75,label:"OHP"},
                };
                const tgt = BW_TARGETS[currentEx.pattern];
                if(!tgt) return null;
                const targetKg = Math.round(bw * tgt.mult * 10) / 10;
                const display = units==="lbs"
                  ? `${Math.round(targetKg*2.20462)} lbs`
                  : `${targetKg} kg`;
                return(
                  <div style={{marginTop:6,display:"inline-flex",alignItems:"center",gap:5,background:`${T.teal}12`,border:`1px solid ${T.teal}30`,borderRadius:8,padding:"3px 8px"}}>
                    <span style={{fontSize:10,color:T.teal}}>◎</span>
                    <span style={{fontSize:10,color:T.teal,fontWeight:600}}>BW target: {display}</span>
                    <span style={{fontSize:10,color:T.textTer}}>({tgt.mult}× BW)</span>
                  </div>
                );
              })()}
            </div>
            <Badge color={T.accent}>Set {currentSetDisplay}/{setsPerEx}</Badge>
          </div>
          <div style={{display:"flex",gap:5,marginBottom:T.sp3,flexWrap:"wrap"}}>
            {currentEx.cues?.map((c,i)=><div key={i} style={{fontSize:11,color:T.textTer,background:T.bgRaise,borderRadius:8,padding:"3px 8px"}}>{c}</div>)}
          </div>
          {loggedSets.filter(s=>s.exercise===currentEx.name).length>0&&(
            <div style={{marginBottom:T.sp3}}>
              <div style={{fontSize:11,color:T.textTer,marginBottom:5,textTransform:"uppercase",letterSpacing:"0.08em"}}>Previous sets</div>
              {loggedSets.filter(s=>s.exercise===currentEx.name).map((s,i)=>(
                <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"5px 10px",background:`${T.success}15`,borderRadius:8,marginBottom:4,fontSize:12,color:T.success}}>
                  <span>Set {i+1}</span>
                  <span style={{fontFamily:"'SF Mono','Menlo',monospace"}}>{s.reps} × {fmtW(s.load,units)} · RIR {s.rir}</span>
                </div>
              ))}
            </div>
          )}
          {/* When resting on a different exercise, show a paused indicator
              so the athlete knows where the timer lives */}
          {phase==="rest" && !isRestOwner && restRunning && (
            <div style={{
              margin:"12px 0",padding:"12px 16px",
              borderRadius:12,
              background:`${T.accent}0A`,
              border:`1px solid ${T.accent}30`,
              display:"flex",alignItems:"center",gap:12,
            }}>
              <div style={{
                width:36,height:36,borderRadius:12,
                background:`${T.accent}15`,flexShrink:0,
                display:"flex",alignItems:"center",justifyContent:"center",
                fontSize:14,fontWeight:800,
                fontFamily:"'SF Mono','Menlo',monospace",
                color:T.accent,
              }}>
                {restMins}:{restSecs2}
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:12,fontWeight:700,color:T.accent}}>
                  Rest timer running on {exercises[restOwnerExIdx]?.name||"previous exercise"}
                </div>
                <div style={{fontSize:11,color:T.textSec,marginTop:2}}>
                  Swipe back to see it · auto-advances when done
                </div>
              </div>
            </div>
          )}

          {(phase==="active" || (phase==="rest" && !isRestOwner && !restRunning))?(
            <SetLogger
              exercise={currentEx}
              setNum={setNum}
              onLog={handleLog}
              onUndo={handleUndo}
              canUndo={loggedSets.length>0}
              units={units}
            />
          ):(
            <div>
              {/* ── Exercise completion signal ── */}
              {(()=>{
                const isLastSetOfExercise = setsLoggedForCurrent >= setsPerEx;
                const isLastExercise      = exIdx >= exercises.length - 1;
                const nextEx              = !isLastExercise ? exercises[exIdx + 1] : null;
                return(
                  <>
                    {/* Show completion banner when all sets of this exercise are done */}
                    {isLastSetOfExercise && !isLastExercise && (
                      <div style={{
                        marginBottom:T.sp3,
                        padding:"10px 14px",
                        background:`${T.success}12`,
                        border:`1px solid ${T.success}35`,
                        borderRadius:12,
                        display:"flex",alignItems:"center",gap:10,
                      }}>
                        <div style={{
                          width:28,height:28,borderRadius:8,
                          background:`${T.success}20`,
                          display:"flex",alignItems:"center",justifyContent:"center",
                          fontSize:14,color:T.success,flexShrink:0,fontWeight:700,
                        }}>✓</div>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:12,fontWeight:700,color:T.success}}>
                            {currentEx.name} — done
                          </div>
                          {nextEx&&(
                            <div style={{fontSize:11,color:T.textSec,marginTop:2}}>
                              Next: <span style={{fontWeight:600,color:T.textPri}}>{nextEx.name}</span>
                            </div>
                          )}
                        </div>
                      </div>
                    )}
                    {isLastSetOfExercise && isLastExercise && (
                      <div style={{
                        marginBottom:T.sp3,
                        padding:"10px 14px",
                        background:`${T.accent}12`,
                        border:`1px solid ${T.accent}35`,
                        borderRadius:12,
                        display:"flex",alignItems:"center",gap:10,
                      }}>
                        <div style={{
                          width:28,height:28,borderRadius:8,
                          background:`${T.accent}20`,
                          display:"flex",alignItems:"center",justifyContent:"center",
                          fontSize:14,color:T.accent,flexShrink:0,fontWeight:700,
                        }}>★</div>
                        <div>
                          <div style={{fontSize:12,fontWeight:700,color:T.accent}}>
                            All exercises complete
                          </div>
                          <div style={{fontSize:11,color:T.textSec,marginTop:2}}>
                            Finish the rest, then end your session
                          </div>
                        </div>
                      </div>
                    )}
                    {!isLastSetOfExercise && (
                      <div style={{
                        fontSize:12,color:T.textSec,
                        textAlign:"center",marginBottom:T.sp2,
                        fontWeight:600,letterSpacing:"0.05em",
                        textTransform:"uppercase",fontSize:10,
                      }}>
                        Rest · Set {setsLoggedForCurrent + 1} of {setsPerEx} next
                      </div>
                    )}
                  </>
                );
              })()}

              {/* ── Rest timer — larger, more prominent ── */}
              <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:T.sp3,padding:"4px 0 10px"}}>
                <div
                  role="timer"
                  aria-label={`Rest timer: ${restMins} minutes ${restSecs2} seconds`}
                  aria-live="off"
                  style={{
                    position:"relative",width:130,height:130,
                    animation:restJustDone?"restDone 0.8s ease-out":"none",
                  }}>
                  <svg width="130" height="130" style={{transform:"rotate(-90deg)"}}>
                    {/* Track */}
                    <circle cx="65" cy="65" r="56" fill="none" stroke={T.bgRaise} strokeWidth="7"/>
                    {/* Progress */}
                    <circle cx="65" cy="65" r="56" fill="none"
                      stroke={restRemaining===0?T.success:T.accent} strokeWidth="7"
                      strokeDasharray={`${2*Math.PI*56}`}
                      strokeDashoffset={`${2*Math.PI*56*(1-restPct/100)}`}
                      strokeLinecap="round"
                      style={{
                        transition:"stroke-dashoffset 0.25s linear",
                        filter:`drop-shadow(0 0 6px ${restRemaining===0?T.success:T.accent}80)`,
                      }}/>
                  </svg>
                  {/* Centre content */}
                  <div style={{
                    position:"absolute",top:"50%",left:"50%",
                    transform:"translate(-50%,-50%)",
                    textAlign:"center",
                  }}>
                    <div style={{
                      fontFamily:"'SF Mono','Menlo',monospace",
                      fontSize:restRemaining===0?22:26,
                      fontWeight:800,
                      color:restRemaining===0?T.success:T.accent,
                      lineHeight:1,
                    }}>
                      {restRemaining===0?"Go!":` ${restMins}:${restSecs2}`}
                    </div>
                    {restRemaining>0&&(
                      <div style={{fontSize:9,color:T.textTer,marginTop:3,
                        textTransform:"uppercase",letterSpacing:"0.08em"}}>
                        sec left
                      </div>
                    )}
                  </div>
                </div>

                {/* Controls */}
                <div style={{display:"flex",gap:6,alignItems:"center"}}>
                  {[15,30].map(n=>(
                    <button key={n}
                      aria-label={`Add ${n} seconds to rest`}
                      onClick={()=>addRestTime(n)}
                      style={{height:40,borderRadius:12,border:`1px solid ${T.border}`,
                        background:T.bgRaise,color:T.textSec,cursor:"pointer",
                        fontSize:12,padding:"0 12px",fontFamily:"inherit"}}>
                      +{n}s
                    </button>
                  ))}
                  <button
                    aria-label={restRunning?"Pause rest timer":"Resume rest timer"}
                    onClick={toggleRestPause}
                    style={{width:40,height:40,borderRadius:12,border:`1px solid ${T.border}`,
                      background:T.bgRaise,color:T.textSec,cursor:"pointer",
                      display:"flex",alignItems:"center",justifyContent:"center"}}>
                    {restRunning
                      ? <PauseIcon size={13} color={T.textSec}/>
                      : <PlayIcon size={12} color={T.textSec}/>
                    }
                  </button>
                  <button
                    aria-label="Skip rest and continue"
                    onClick={skipRest}
                    style={{height:40,borderRadius:12,
                      border:`1px solid ${T.accent}50`,
                      background:`${T.accent}12`,
                      color:T.accent,cursor:"pointer",
                      fontSize:12,fontWeight:700,
                      padding:"0 14px",fontFamily:"inherit"}}>
                    Skip →
                  </button>
                </div>
              </div>
            </div>
          )}
        </Card>
      )}

      {/* End workout — now opens confirm dialog */}
      <button
        aria-label="End workout"
        onClick={()=>setConfirmEnd(true)}
        style={{width:"100%",padding:"14px",borderRadius:12,border:`1px solid ${T.red}40`,background:`${T.red}12`,color:T.red,fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit",transition:"all 0.15s"}}
        onMouseEnter={e=>e.currentTarget.style.background=`${T.red}20`}
        onMouseLeave={e=>e.currentTarget.style.background=`${T.red}12`}>
        End workout
      </button>
    </div>
  );
}

// ANALYTICS — driven by real logged session data
// ═══════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════
// TREND ANALYSIS ENGINE
// Pure functions — all computed from sessions + muscleStateHistory.
// No extra storage tables needed.
// ═══════════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════════
// TREND ANALYSIS ENGINE — v2
// Goal-aware (hypertrophy / strength / peak), science-based,
// all derived from sessions[] + muscleStateHistory[].
// All pure functions — memoised at call site.
// ═══════════════════════════════════════════════════════════════

// ── Goal-specific constants ───────────────────────────────────
const GOAL_CONFIG = {
  Hypertrophy: {
    perfMetric:"volumeLoad", rir_target:2,
    fatigue_amber:55, fatigue_red:75,
    plateau_sessions:3, optimalFatigue:[40,70], junkVolumeAbove:"mav",
  },
  Strength: {
    perfMetric:"e1rm", rir_target:1,
    fatigue_amber:65, fatigue_red:82,
    plateau_sessions:4, optimalFatigue:[45,75], junkVolumeAbove:"mev",
  },
  Peak: {
    perfMetric:"maxLoad", rir_target:0,
    fatigue_amber:45, fatigue_red:60,
    plateau_sessions:2, optimalFatigue:[20,50], junkVolumeAbove:"mev",
  },
};

// Experience modifies plateau window, optimal fatigue zone, and RIR benchmark
// Beginners: longer plateau window (skill learning masks true plateau)
//            wider optimal zone (they grow on almost anything)
//            higher RIR target (technique > proximity to failure)
// Advanced:  shorter plateau window (stagnation is a real signal, not noise)
//            narrower optimal zone (requires precise fatigue management)
//            lower RIR target (max proximity to failure needed for adaptation)
const EXP_GOAL_OVERRIDES = {
  Beginner: {
    plateau_sessions_add: +2,  // e.g. Hypertrophy: 3+2=5 sessions to flag plateau
    optimalFatigue_shift: [+5,+10], // [min, max] — wider/higher zone for beginners
    rir_target_add: +1,        // Hypertrophy: 2+1=3 RIR (more conservative)
  },
  Intermediate: {
    plateau_sessions_add: 0,
    optimalFatigue_shift: [0,0],
    rir_target_add: 0,
  },
  Advanced: {
    plateau_sessions_add: -1,  // Hypertrophy: 3-1=2 sessions
    optimalFatigue_shift: [-5,0],
    rir_target_add: -1,        // Hypertrophy: 2-1=1 RIR (closer to failure)
  },
};

function getGoalConfig(goal, exp="Intermediate"){
  const base    = GOAL_CONFIG[goal] || GOAL_CONFIG.Hypertrophy;
  const expMod  = EXP_GOAL_OVERRIDES[exp] || EXP_GOAL_OVERRIDES.Intermediate;
  return {
    ...base,
    rir_target:       Math.max(0, base.rir_target + expMod.rir_target_add),
    plateau_sessions: Math.max(2, base.plateau_sessions + expMod.plateau_sessions_add),
    optimalFatigue:   [
      base.optimalFatigue[0] + expMod.optimalFatigue_shift[0],
      base.optimalFatigue[1] + expMod.optimalFatigue_shift[1],
    ],
  };
}

// ── Performance metric — goal-aware ──────────────────────────
function calcPerfScore(load, reps, goal){
  if(!load||!reps) return 0;
  const cfg=getGoalConfig(goal);
  if(cfg.perfMetric==="e1rm"){
    if(reps>10) return Math.round(load*(1+reps/30));
    return Math.round(load/(1-reps/30));
  }
  if(cfg.perfMetric==="maxLoad") return load;
  return load*reps;
}

// ── Performance series ────────────────────────────────────────
function buildPerformanceSeries(sessions, exerciseName, goal="Hypertrophy"){
  return sessions
    .filter(s=>s.loggedSets?.some(ls=>ls.exercise===exerciseName))
    .map(s=>{
      const sets=s.loggedSets.filter(ls=>ls.exercise===exerciseName);
      const best=sets.reduce((b,ls)=>{
        const reps=parseInt(ls.reps)||0;
        const score=calcPerfScore(ls.load||0,reps,goal);
        return score>b.score?{score,load:ls.load,reps}:b;
      },{score:0,load:0,reps:0});
      return{
        timestamp:s.timestamp,
        date:new Date(s.timestamp).toLocaleDateString("en-GB",{day:"numeric",month:"short"}),
        score:best.score, load:best.load, reps:best.reps,
      };
    })
    .filter(p=>p.score>0);
}

// ── Fatigue series ────────────────────────────────────────────
function buildFatigueSeries(muscleStateHistory, muscle){
  return muscleStateHistory.map(snap=>({
    timestamp:snap.timestamp,
    date:new Date(snap.timestamp).toLocaleDateString("en-GB",{day:"numeric",month:"short"}),
    fatigue:Math.round(snap.state?.[muscle]?.fatigue??0),
    stimulus:+(snap.state?.[muscle]?.stimulus??0).toFixed(1),
    volume:snap.state?.[muscle]?.volume??0,
  }));
}

// ── Volume series ─────────────────────────────────────────────
function buildVolumeSeries(sessions){
  const weeks={};
  sessions.forEach(s=>{
    const d=new Date(s.timestamp);
    const mon=new Date(d); mon.setDate(d.getDate()-d.getDay()+1);
    const key=mon.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
    if(!weeks[key]) weeks[key]={};
    (s.loggedSets||[]).forEach(ls=>{
      const m=ls.muscleGroup;
      if(m) weeks[key][m]=(weeks[key][m]||0)+1;
    });
  });
  return Object.entries(weeks).map(([week,muscles])=>({week,muscles}));
}

// ── Volume vs Performance scatter ─────────────────────────────
function buildVolumePerformanceScatter(sessions, muscle, exerciseName, goal="Hypertrophy"){
  const volByWeek=buildVolumeSeries(sessions);
  const volMap={};
  volByWeek.forEach(w=>{if(w.muscles[muscle]) volMap[w.week]=w.muscles[muscle];});
  return sessions
    .filter(s=>s.loggedSets?.some(ls=>ls.exercise===exerciseName))
    .map(s=>{
      const d=new Date(s.timestamp);
      const mon=new Date(d); mon.setDate(d.getDate()-d.getDay()+1);
      const wk=mon.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
      const sets=s.loggedSets.filter(ls=>ls.exercise===exerciseName);
      const best=sets.reduce((b,ls)=>{
        const score=calcPerfScore(ls.load||0,parseInt(ls.reps)||0,goal);
        return score>b.score?{score,load:ls.load}:b;
      },{score:0,load:0});
      return{volume:volMap[wk]||0,score:best.score,
             date:new Date(s.timestamp).toLocaleDateString("en-GB",{day:"numeric",month:"short"})};
    })
    .filter(p=>p.score>0&&p.volume>0);
}

// ── Compliance series ─────────────────────────────────────────
function buildComplianceSeries(sessions, program){
  const freq=program?.freq??3;
  const weeks={};
  sessions.forEach(s=>{
    const d=new Date(s.timestamp);
    const mon=new Date(d); mon.setDate(d.getDate()-d.getDay()+1);
    const key=mon.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
    weeks[key]=(weeks[key]||0)+1;
  });
  return Object.entries(weeks).map(([week,completed])=>({
    week,completed,planned:freq,rate:Math.min(1,completed/freq),
  }));
}

// ── Trend direction ───────────────────────────────────────────
function getTrendDir(series, field="score", n=3){
  if(series.length<2) return 0;
  const last=series.slice(-Math.min(n,series.length));
  let up=0,down=0;
  for(let i=1;i<last.length;i++){
    if(last[i][field]>last[i-1][field]*1.02) up++;
    else if(last[i][field]<last[i-1][field]*0.98) down++;
  }
  return up>down?1:down>up?-1:0;
}

// ── Plateau detection ─────────────────────────────────────────
function detectPlateau(perfSeries, muscleState, muscle, goal){
  const cfg=getGoalConfig(goal);
  const n=cfg.plateau_sessions;
  if(perfSeries.length<n) return false;
  const recent=perfSeries.slice(-n);
  const maxV=Math.max(...recent.map(s=>s.score));
  const minV=Math.min(...recent.map(s=>s.score));
  const isFlat=maxV===0||(maxV-minV)/maxV<0.02;
  const fatigue=muscleState?.[muscle]?.fatigue??0;
  const volume=muscleState?.[muscle]?.volume??0;
  const lm=MUSCLE_LANDMARKS[muscle];
  return isFlat&&fatigue<cfg.fatigue_amber&&(lm?volume>lm.mev:true);
}

// ── Junk volume detection ─────────────────────────────────────
function detectJunkVolume(volSeries, perfSeries, muscle, muscleState, goal){
  if(volSeries.length<2||perfSeries.length<2) return false;
  const cfg=getGoalConfig(goal);
  const lm=MUSCLE_LANDMARKS[muscle];
  if(!lm) return false;
  const threshold=cfg.junkVolumeAbove==="mav"?lm.mav:lm.mev;
  const currentVol=muscleState?.[muscle]?.volume??0;
  const volTrend=getTrendDir(volSeries.map(w=>({score:w.muscles[muscle]||0})));
  const perfTrend=getTrendDir(perfSeries);
  return currentVol>threshold&&volTrend>0&&perfTrend<0;
}

// ── Vol/perf correlation ──────────────────────────────────────
function detectVolumePerformanceCorrelation(volSeries, perfSeries, muscle){
  if(volSeries.length<2||perfSeries.length<2) return null;
  const volTrend=getTrendDir(volSeries.map(w=>({score:w.muscles[muscle]||0})));
  const perfTrend=getTrendDir(perfSeries);
  if(volTrend>0&&perfTrend<0) return "overtraining";
  if(volTrend<0&&perfTrend>0) return "recovering";
  return null;
}

// ── 3-session fatigue rise ────────────────────────────────────
function detectFatigueTrend(fatigueSeries, threshold=3){
  if(fatigueSeries.length<threshold) return false;
  const recent=fatigueSeries.slice(-threshold);
  return recent.every((s,i)=>i===0||s.fatigue>recent[i-1].fatigue);
}

// ── Overreaching prediction ───────────────────────────────────
function predictOverreaching(fatigueSeries, muscleState, muscle, goal){
  const cfg=getGoalConfig(goal||"Hypertrophy","Intermediate");
  const rising3=detectFatigueTrend(fatigueSeries,3);
  const current=fatigueSeries[fatigueSeries.length-1]?.fatigue??0;
  const trend=muscleState?.[muscle]?.performanceTrend??0;
  if(rising3&&current>cfg.fatigue_amber&&trend<=0){
    const sess=current>cfg.fatigue_red?1:current>cfg.fatigue_amber+10?2:3;
    return{risk:true,sessionsToOverreach:sess,currentFatigue:current};
  }
  return{risk:false};
}

// ── Insight engine ────────────────────────────────────────────
// ── Compliance engine ─────────────────────────────────────────
function getComplianceRate(history){
  const planned   = history.filter(d=>d.planned).length;
  const completed = history.filter(d=>d.completed).length;
  return planned===0 ? null : completed/planned;
}

function getComplianceStreak(history){
  const sorted = [...history].sort((a,b)=>b.date.localeCompare(a.date));
  let streak=0;
  for(const entry of sorted){
    if(entry.completed) streak++;
    else if(entry.planned) break;
  }
  return streak;
}

function getMissedSessions(history){
  return history.filter(d=>d.planned && !d.completed).length;
}

function getComplianceBehaviorInsights(history, sessions){
  const insights=[];
  if(history.length<3) return insights;
  const rate   = getComplianceRate(history);
  const streak = getComplianceStreak(history);
  const missed = getMissedSessions(history);
  if(rate!==null && rate<0.7){
    insights.push({ level:"high",
      msg:`Overall adherence at ${Math.round(rate*100)}% — low compliance reduces AI signal quality and slows adaptation. Consider reducing program frequency to improve consistency.` });
  }
  const recent5 = history.filter(d=>d.planned).slice(-5);
  const recentMissed = recent5.filter(d=>!d.completed).length;
  if(recentMissed>=2){
    insights.push({ level:"medium",
      msg:`${recentMissed} of the last 5 planned sessions were missed. Inconsistent training creates unreliable fatigue data — the adaptive engine needs consistent input to make accurate recommendations.` });
  }
  if(streak>=5){
    insights.push({ level:"good",
      msg:`${streak}-session training streak. Consistent attendance is the single biggest driver of long-term progress — all other optimisations compound on this foundation.` });
  }
  if(rate!==null && rate<0.8 && sessions.length>=3){
    const lastVol = sessions[sessions.length-1]?.loggedSets?.length||0;
    const prevVol = sessions[sessions.length-2]?.loggedSets?.length||0;
    if(lastVol>prevVol){
      insights.push({ level:"medium",
        msg:`Volume is increasing despite ${Math.round(rate*100)}% adherence. Adding volume makes sense only when you can consistently complete sessions — focus on attendance before progression.` });
    }
  }
  return insights.slice(0,3);
}

function buildComplianceCalendar(history, program){
  const freq = program?.freq ?? 3;
  const today = new Date(); today.setHours(0,0,0,0);
  const days = [];
  for(let i=27;i>=0;i--){
    const d = new Date(today.getTime()-i*86400000);
    const dateStr = d.toISOString().slice(0,10);
    const entry = history.find(h=>h.date===dateStr);
    const dow = d.getDay();
    let planned = false;
    if(freq>=5) planned=dow>=1&&dow<=5;
    else if(freq===4) planned=[1,2,4,5].includes(dow);
    else if(freq===3) planned=[1,3,5].includes(dow);
    else if(freq===2) planned=[1,4].includes(dow);
    else planned=dow===1;
    days.push({
      date:dateStr, dow, day:d.getDate(),
      month:d.toLocaleDateString("en-GB",{month:"short"}),
      isToday:i===0,
      planned: entry?.planned ?? planned,
      completed: entry?.completed ?? false,
    });
  }
  return days;
}

function generateTrendInsights(sessions, muscleStateHistory, muscleState, program, exp="Intermediate"){
  if(sessions.length<2||!muscleState) return [];
  const goal=program?.goal||"Hypertrophy";
  const cfg=getGoalConfig(goal, exp);
  const insights=[];
  const LABELS={
    chest:"Chest",deltoids:"Shoulders",back:"Back",biceps:"Biceps",
    triceps:"Triceps",forearms:"Forearms",traps:"Traps",core:"Core",
    quads:"Quads",hamstrings:"Hamstrings",glutes:"Glutes",calves:"Calves",
  };

  for(const muscle of Object.keys(MUSCLE_LANDMARKS)){
    const fatSeries=buildFatigueSeries(muscleStateHistory,muscle);
    const volSeries=buildVolumeSeries(sessions);
    const state=muscleState?.[muscle];
    if(!state) continue;
    const label=LABELS[muscle]||muscle;
    const mainEx=sessions.flatMap(s=>s.loggedSets||[])
      .filter(ls=>ls.muscleGroup===muscle).map(ls=>ls.exercise)[0];
    const perfSeries=mainEx?buildPerformanceSeries(sessions,mainEx,goal):[];

    // 1. Overreaching prediction
    if(muscleStateHistory.length>=3){
      const pred=predictOverreaching(fatSeries,muscleState,muscle,goal);
      if(pred.risk) insights.push({
        type:"prediction",muscle,label,priority:4,color:"#F87171",
        msg:`${label} fatigue rising 3 sessions consecutively (${pred.currentFatigue}%). `+(
          goal==="Peak"?"Critical for peaking — reduce volume immediately.":
          goal==="Strength"?"CNS fatigue accumulating — deload compound movements.":
          `Overreaching likely in ~${pred.sessionsToOverreach} session${pred.sessionsToOverreach!==1?"s":""}. Reduce volume.`
        ),
      });
    }

    if(sessions.length>=3&&mainEx){
      // 2. Junk volume
      if(detectJunkVolume(volSeries,perfSeries,muscle,muscleState,goal)){
        const lm=MUSCLE_LANDMARKS[muscle];
        const thresh=cfg.junkVolumeAbove==="mav"?lm?.mav:lm?.mev;
        insights.push({
          type:"junk_volume",muscle,label,priority:3,color:"#FB923C",
          msg:`${label} volume exceeds productive threshold (${state.volume} sets vs ${cfg.junkVolumeAbove.toUpperCase()} ${thresh}) while ${mainEx} performance declining. `+(
            goal==="Strength"?"Reduce to 3–4 heavy working sets.":
            "Cut 3–4 sets, focus on progressive overload."
          ),
        });
      }
      // 3. Correlation
      const signal=detectVolumePerformanceCorrelation(volSeries,perfSeries,muscle);
      if(signal==="overtraining"&&!detectJunkVolume(volSeries,perfSeries,muscle,muscleState,goal)){
        insights.push({
          type:"correlation",muscle,label,priority:3,color:"#FB923C",
          msg:`${label}: volume climbing while ${mainEx} performance declines. `+(
            goal==="Peak"?"Stop accumulation — enter taper.":
            "Hold volume and allow recovery to catch up."
          ),
        });
      } else if(signal==="recovering"){
        insights.push({
          type:"recovering",muscle,label,priority:1,color:"#4ADE80",
          msg:`${label} responding to reduced volume — ${mainEx} improving. `+(
            goal==="Strength"?"Good time for heavy singles.":
            "Gradually re-introduce volume 1 set/session."
          ),
        });
      }
      // 4. Plateau
      if(sessions.length>=cfg.plateau_sessions&&detectPlateau(perfSeries,muscleState,muscle,goal)){
        insights.push({
          type:"plateau",muscle,label,priority:2,color:"#FCD34D",
          msg:`${label} plateau over ${cfg.plateau_sessions} sessions with manageable fatigue. `+(
            goal==="Hypertrophy"?"Add 1 working set, try new variation, or reduce RIR by 1.":
            goal==="Strength"?"Cycle intensities: PR attempt or 70% deload week.":
            "Plateau at peak phase expected — maintain, don't force."
          ),
        });
      }
    }

    // 5. Optimal zone
    const [optLow,optHigh]=cfg.optimalFatigue;
    const muscleHasData=sessions.some(s=>(s.loggedSets||[]).some(ls=>ls.muscleGroup===muscle));
    if(muscleHasData&&state.fatigue>=optLow&&state.fatigue<=optHigh&&state.performanceTrend>0){
      insights.push({
        type:"optimal",muscle,label,priority:1,color:"#4ADE80",
        msg:`${label} in ${goal.toLowerCase()} optimal zone — fatigue ${Math.round(state.fatigue)}%, performance improving. `+(
          goal==="Hypertrophy"?"Maintain volume, apply 2.5–5% load increase.":
          goal==="Strength"?"Ideal window for heavy triples.":
          "Taper working — preserve this state."
        ),
      });
    }

    // 6. Under-stimulation
    const muscleSessions=sessions.filter(s=>(s.loggedSets||[]).some(ls=>ls.muscleGroup===muscle));
    if(muscleSessions.length>=2&&state.stimulus<4&&state.performanceTrend===0&&state.fatigue<cfg.fatigue_amber){
      insights.push({
        type:"understimulated",muscle,label,priority:2,color:"#FCD34D",
        msg:`${label} stimulus ${state.stimulus.toFixed(1)}/10 with flat performance. `+(
          exp==="Beginner"
            ? "Focus on adding small, consistent load increments each session. Technique mastery drives progress more than intensity at this stage."
            : goal==="Hypertrophy"
              ? `Target RIR ${cfg.rir_target} (currently too far from failure). Add a drop set or mechanical drop to increase effective volume.`
              : goal==="Strength"
                ? "Add a heavy top single or cluster set to drive neural adaptation."
                : "No action — stimulus should be minimal during peak phase."
        ),
      });
    }
  }

  // Compliance insight
  const compSeries=buildComplianceSeries(sessions,program);
  if(compSeries.length>=2){
    const last=compSeries[compSeries.length-1];
    const prev=compSeries[compSeries.length-2];
    if(last.rate<0.7) insights.push({
      type:"compliance",muscle:null,label:"Adherence",priority:2,color:"#FB923C",
      msg:`Session adherence at ${Math.round(last.rate*100)}% this week (${Math.round(prev.rate*100)}% last). `+(
        goal==="Peak"?"Critical — missed sessions disrupt taper.":
        "Low adherence reduces AI recommendation accuracy."
      ),
    });
  }

  return insights.sort((a,b)=>b.priority-a.priority).slice(0,6);
}

      x:data.length>1?(i/(data.length-1))*width:width/2,
