          {label:"Mesos done", value:completedMesos||"0",   color:T.orange},
        ].map(({label,value,color})=>(
          <Card key={label} style={{padding:14}}><Stat label={label} value={value} color={color}/></Card>
        ))}
      </div>

      {insights.length>0&&(
        <div style={{marginBottom:12}}>
          <div style={{fontSize:10,fontWeight:700,color:T.textTer,textTransform:"uppercase",
            letterSpacing:"0.1em",marginBottom:8}}>
            Trend insights · {insights.length} signal{insights.length!==1?"s":""}
          </div>
          {insights.map((ins,i)=>(
            <div key={i} style={{
              background:`${ins.color}10`,border:`1px solid ${ins.color}35`,
              borderLeft:`3px solid ${ins.color}`,
              borderRadius:12,padding:"10px 12px",marginBottom:7,
              animation:`diffCardIn 0.4s cubic-bezier(0.22,1,0.36,1) ${i*50}ms both`,
            }}>
              <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:4,flexWrap:"wrap"}}>
                <Badge color={ins.color}>{ins.type.replace("_"," ")}</Badge>
                {ins.label&&<Badge color={T.textTer}>{ins.label}</Badge>}
              </div>
              <div style={{fontSize:12,color:T.textSec,lineHeight:1.5}}>{ins.msg}</div>
            </div>
          ))}
        </div>
      )}

      <div style={{display:"flex",gap:3,marginBottom:12,background:T.bgRaise,borderRadius:12,padding:3}}>
        {[["performance","Performance"],["fatigue","Fatigue"],["volume","Volume"],["compliance","Compliance"]].map(([id,lbl])=>(
          <button
              aria-label={`Switch to ${id} tab`} key={id} onClick={()=>setActiveTab(id)} style={{
            flex:1,padding:"6px 0",borderRadius:8,border:"none",cursor:"pointer",
            fontSize:10,fontWeight:700,fontFamily:"inherit",
            background:activeTab===id?T.bgCard:"transparent",
            color:activeTab===id?T.accent:T.textSec,
            transition:"all 0.15s ease",
          }}>{lbl}</button>
        ))}
      </div>

      {activeTab==="performance"&&(
        <div>
          <Card style={{marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div style={{fontSize:11,color:T.textSec,textTransform:"uppercase",letterSpacing:"0.08em"}}>
                {perfLabel} progress
              </div>
              <Badge color={T.purple}>{goal}</Badge>
            </div>
            {!hasData?(
              <div style={{textAlign:"center",padding:"28px 0",color:T.textTer}}>
                <div style={{fontSize:24,marginBottom:6,opacity:0.3}}>∿</div>
                <div style={{fontSize:13}}>No sessions logged yet</div>
              </div>
            ):(
              <>
                <div style={{display:"flex",gap:5,marginBottom:10,overflowX:"auto",paddingBottom:2}}>
                  {exNames.map(ex=>(
                    <button
              aria-label={`Select exercise ${ex}`} key={ex} onClick={()=>setActiveEx(ex)} style={{
                      flexShrink:0,padding:"4px 10px",borderRadius:8,fontFamily:"inherit",
                      border:`1px solid ${selectedEx===ex?T.accent:T.border}`,
                      background:selectedEx===ex?`${T.accent}18`:T.bgRaise,
                      color:selectedEx===ex?T.accent:T.textSec,
                      fontSize:10,fontWeight:700,cursor:"pointer",
                    }}>{ex}</button>
                  ))}
                </div>
                <SparkLine data={perfSeries} color={T.accent} field="score"/>
                {perfSeries.length>=2&&(()=>{
                  const first=perfSeries[0].score,last=perfSeries[perfSeries.length-1].score;
                  const delta=last-first,pct=first>0?((delta/first)*100).toFixed(1):0;
                  const dir=getTrendDir(perfSeries,"score");
                  return(
                    <div style={{display:"flex",justifyContent:"space-between",
                      marginTop:8,padding:"8px 10px",background:T.bgRaise,borderRadius:8}}>
                      <div style={{fontSize:11,color:T.textSec}}>First: <span style={{fontFamily:"'SF Mono','Menlo',monospace",color:T.textPri}}>{first}</span></div>
                      <div style={{fontSize:11,color:dir>0?T.success:dir<0?T.red:T.textSec,fontWeight:700}}>
                        {dir>0?"+":dir<0?"–":"="} {Math.abs(pct)}%
                      </div>
                      <div style={{fontSize:11,color:T.accent}}>Latest: <span style={{fontFamily:"'SF Mono','Menlo',monospace",fontWeight:700}}>{last}</span></div>
                    </div>
                  );
                })()}
              </>
            )}
          </Card>
          <Card>
            <div style={{fontSize:11,color:T.textSec,marginBottom:8,textTransform:"uppercase",letterSpacing:"0.08em"}}>
              Effort benchmark
            </div>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
              <span style={{fontSize:12,color:T.textSec}}>Avg RIR across all sessions</span>
              <span style={{fontSize:12,fontWeight:700,
                color:avgRir<=cfg.rir_target?T.success:avgRir<=cfg.rir_target+1?T.warning:T.red}}>
                {avgRir||"—"} RIR
              </span>
            </div>
            <div style={{fontSize:11,color:T.textTer,lineHeight:1.5}}>
              Target for {goal}: {cfg.rir_target} RIR ·{" "}
              {avgRir<=cfg.rir_target?"On target.":
               `Reduce by ${(avgRir-cfg.rir_target).toFixed(1)} to improve stimulus quality.`}
            </div>
          </Card>
        </div>
      )}

      {activeTab==="fatigue"&&(
        <Card style={{marginBottom:12}}>
          <div style={{fontSize:11,color:T.textSec,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.08em"}}>
            Fatigue timeline · {goal}
          </div>
          <div style={{display:"flex",gap:4,marginBottom:12,overflowX:"auto",paddingBottom:2}}>
            {Object.keys(MUSCLE_LABELS_LOCAL).map(m=>(
              <button
              aria-label={`Select ${m} muscle`} key={m} onClick={()=>setActiveMuscle(m)} style={{
                flexShrink:0,padding:"3px 9px",borderRadius:8,fontFamily:"inherit",
                border:`1px solid ${activeMuscle===m?T.teal:T.border}`,
                background:activeMuscle===m?`${T.teal}18`:T.bgRaise,
                color:activeMuscle===m?T.teal:T.textSec,
                fontSize:10,fontWeight:700,cursor:"pointer",
              }}>{MUSCLE_LABELS_LOCAL[m]}</button>
            ))}
          </div>
          <div style={{marginBottom:10}}>
            <div style={{fontSize:10,color:T.textTer,marginBottom:6}}>
              {MUSCLE_LABELS_LOCAL[activeMuscle]} — session history
            </div>
            <FatigueHeatStrip series={fatSeries}/>
            <div style={{display:"flex",justifyContent:"space-between",marginTop:4}}>
              <span style={{fontSize:10,color:T.textTer}}>Oldest</span>
              <span style={{fontSize:10,color:T.textTer}}>Latest</span>
            </div>
          </div>
          {fatSeries.length>=2&&(
            <SparkLine data={fatSeries}
              color={fatigueColor(fatSeries[fatSeries.length-1]?.fatigue)||T.teal}
              field="fatigue"/>
          )}
          <div style={{marginTop:10,padding:"8px 10px",background:T.bgRaise,borderRadius:8}}>
            <div style={{fontSize:10,fontWeight:700,color:T.textTer,textTransform:"uppercase",
              letterSpacing:"0.08em",marginBottom:5}}>{goal} thresholds</div>
            {[
              [`0 – ${cfg.optimalFatigue[0]}%`,"Undertrained",T.textTer],
              [`${cfg.optimalFatigue[0]} – ${cfg.optimalFatigue[1]}%`,"Optimal zone",T.success],
              [`${cfg.optimalFatigue[1]} – ${cfg.fatigue_red}%`,"Accumulating",T.warning],
              [`${cfg.fatigue_red}%+`,"Overreaching risk",T.red],
            ].map(([range,label,col])=>(
              <div key={label} style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                <span style={{fontSize:10,color:T.textSec,fontFamily:"'SF Mono','Menlo',monospace"}}>{range}</span>
                <span style={{fontSize:10,color:col,fontWeight:600}}>{label}</span>
              </div>
            ))}
          </div>
          {(()=>{
            const pred=predictOverreaching(fatSeries,muscleState,activeMuscle,goal);
            return pred.risk?(
              <div style={{marginTop:10,padding:"8px 11px",
                background:`${T.red}12`,border:`1px solid ${T.red}40`,borderRadius:8}}>
                <div style={{fontSize:11,fontWeight:700,color:T.red,marginBottom:2}}>Overreaching risk</div>
                <div style={{fontSize:11,color:T.textSec,lineHeight:1.5}}>
                  Rising 3 sessions ({pred.currentFatigue}%). Risk in ~{pred.sessionsToOverreach} session{pred.sessionsToOverreach!==1?"s":""}.
                </div>
              </div>
            ):null;
          })()}
          <div style={{display:"flex",gap:8,marginTop:10,flexWrap:"wrap"}}>
            {[["#4ADE80","Recovered"],["#FCD34D","Moderate"],["#FB923C","Elevated"],["#F87171","High"]].map(([col,lbl])=>(
              <div key={lbl} style={{display:"flex",alignItems:"center",gap:3}}>
                <div style={{width:8,height:8,borderRadius:2,background:col,flexShrink:0}}/>
                <span style={{fontSize:10,color:T.textSec}}>{lbl}</span>
              </div>
            ))}
          </div>
        </Card>
      )}

      {activeTab==="volume"&&(
        <div>
          <Card style={{marginBottom:10}}>
            <div style={{fontSize:11,color:T.textSec,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.08em"}}>
              Weekly volume · sets per muscle
            </div>
            <AbbrLegend terms={["MEV","MAV","MRV"]}/>
            <div style={{marginTop:10}}>
              {Object.keys(MUSCLE_LABELS_LOCAL).map(m=>{
                const logged=allSets.filter(ls=>ls.muscleGroup===m).length;
                const lm=getMuscleVolumeLandmarks(m, goal, exp);
                if(!lm) return null;
                const weekVols=volSeries.map(w=>w.muscles[m]||0);
                const wTrend=weekVols.length>=2?weekVols[weekVols.length-1]-weekVols[weekVols.length-2]:0;
                const col=fatigueColor(muscleState?.[m]?.fatigue||0)||T.teal;
                const goalTarget=goal==="Strength"?lm.mev+2:goal==="Peak"?lm.mev:lm.mav;
                return(
                  <div key={m} style={{marginBottom:12}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:3,alignItems:"center"}}>
                      <div style={{fontSize:12,fontWeight:700}}>{MUSCLE_LABELS_LOCAL[m]}</div>
                      <div style={{display:"flex",gap:8,alignItems:"center"}}>
                        {wTrend!==0&&(
                          <span style={{fontSize:10,color:wTrend>0?T.success:T.warning,fontWeight:700}}>
                            {wTrend>0?"+":""}{wTrend} wk
                          </span>
                        )}
                        <span style={{fontSize:10,fontFamily:"'SF Mono','Menlo',monospace",color:col}}>
                          {logged}/{lm.mrv}
                        </span>
                      </div>
                    </div>
                    <div style={{position:"relative",marginBottom:2}}>
                      <ProgressBar value={logged} max={lm.mrv} color={col} height={5}/>
                      <div style={{
                        position:"absolute",top:-2,
                        left:`${(goalTarget/lm.mrv)*100}%`,
                        width:2,height:9,background:T.accent,borderRadius:1,opacity:0.8,
                      }} title={`${goal} target: ${goalTarget}`}/>
                    </div>
                    <div style={{display:"flex",justifyContent:"space-between",marginTop:2}}>
                      <span style={{fontSize:10,color:T.textSec}}>MEV {lm.mev}</span>
                      <span style={{fontSize:10,color:T.accent}}>target {goalTarget}</span>
                      <span style={{fontSize:10,color:T.textSec}}>MRV {lm.mrv}</span>
                    </div>
                  </div>
                );
              })}
            </div>
          </Card>
          <Card>
            <div style={{fontSize:11,color:T.textSec,marginBottom:6,textTransform:"uppercase",letterSpacing:"0.08em"}}>
              Volume vs {perfLabel}
            </div>
            <div style={{fontSize:10,color:T.textTer,marginBottom:10,lineHeight:1.5}}>
              Each dot = one session. Regression line shows whether more volume correlates with better or worse performance.
            </div>
            <ScatterChart data={scatterData}
              xLabel={`${MUSCLE_LABELS_LOCAL[activeMuscle]||activeMuscle} weekly sets`}
              color={T.teal}/>
            <div style={{display:"flex",gap:3,marginTop:8,justifyContent:"center",flexWrap:"wrap"}}>
              {Object.keys(MUSCLE_LABELS_LOCAL).map(m=>(
                <button aria-label={`Select ${m} muscle`} key={m} onClick={()=>setActiveMuscle(m)} style={{
                  padding:"2px 7px",borderRadius:8,fontFamily:"inherit",border:"none",
                  background:activeMuscle===m?`${T.teal}25`:T.bgRaise,
                  color:activeMuscle===m?T.teal:T.textSec,
                  fontSize:10,fontWeight:700,cursor:"pointer",
                }}>{MUSCLE_LABELS_LOCAL[m]}</button>
              ))}
            </div>
          </Card>
        </div>
      )}

      {activeTab==="compliance"&&(
        <div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:12}}>
            <Card style={{padding:13,textAlign:"center"}}>
              <div style={{fontSize:24,fontWeight:800,lineHeight:1,
                color:compRate===null?T.textTer:compRate>=0.8?T.success:compRate>=0.6?T.warning:T.red}}>
                {compRate===null?"—":`${Math.round(compRate*100)}%`}
              </div>
              <div style={{fontSize:10,color:T.textSec,marginTop:4,textTransform:"uppercase",letterSpacing:"0.08em"}}>Adherence</div>
            </Card>
            <Card style={{padding:13,textAlign:"center"}}>
              <div style={{fontSize:24,fontWeight:800,lineHeight:1,
                color:compStreak>=7?T.success:compStreak>=3?T.warning:T.textSec}}>
                {compStreak}
              </div>
              <div style={{fontSize:10,color:T.textSec,marginTop:4,textTransform:"uppercase",letterSpacing:"0.08em"}}>Streak</div>
            </Card>
            <Card style={{padding:13,textAlign:"center"}}>
              <div style={{fontSize:24,fontWeight:800,lineHeight:1,
                color:compMissed>=3?T.red:compMissed>=1?T.warning:T.success}}>
                {compMissed}
              </div>
              <div style={{fontSize:10,color:T.textSec,marginTop:4,textTransform:"uppercase",letterSpacing:"0.08em"}}>Missed</div>
            </Card>
          </div>
          <Card style={{marginBottom:12}}>
            <div style={{fontSize:11,color:T.textSec,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.08em"}}>
              28-day history
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:4}}>
              {["M","T","W","T","F","S","S"].map((d,i)=>(
                <div key={i} style={{textAlign:"center",fontSize:10,color:T.textSec,fontWeight:700}}>{d}</div>
              ))}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}}>
              {calDays.map((day,i)=>{
                const bg=day.completed?T.success:day.planned&&!day.completed?T.red:T.bgRaise;
                const op=!day.planned?0.4:1;
                return(
                  <div key={i} title={`${day.date}: ${day.completed?"Done":day.planned?"Missed":"Rest"}`}
                    style={{
                      aspectRatio:"1",borderRadius:8,background:bg,opacity:op,
                      border:day.isToday?`2px solid ${T.accent}`:
                             day.completed?`1px solid ${T.success}80`:
                             day.planned&&!day.completed?`1px solid ${T.red}80`:"none",
                      display:"flex",alignItems:"center",justifyContent:"center",
                      fontSize:10,fontWeight:600,color:"#fff",position:"relative",
                    }}>
                    {day.day}
                    {day.isToday&&(
                      <div style={{position:"absolute",bottom:1,left:"50%",transform:"translateX(-50%)",
                        width:3,height:3,borderRadius:"50%",background:T.accent}}/>
                    )}
                  </div>
                );
              })}
            </div>
            <div style={{display:"flex",gap:10,marginTop:10,flexWrap:"wrap"}}>
              {[[T.success,"Completed"],[T.red,"Missed"],[T.bgRaise,"Rest"]].map(([col,lbl])=>(
                <div key={lbl} style={{display:"flex",alignItems:"center",gap:4}}>
                  <div style={{width:8,height:8,borderRadius:2,background:col}}/>
                  <span style={{fontSize:10,color:T.textTer}}>{lbl}</span>
                </div>
              ))}
            </div>
          </Card>
          {compSeries.length>=2&&(
            <Card style={{marginBottom:12}}>
              <div style={{fontSize:11,color:T.textSec,marginBottom:8,textTransform:"uppercase",letterSpacing:"0.08em"}}>
                Weekly adherence trend
              </div>
              <SparkLine
                data={compSeries.map(w=>({...w,date:w.week,score:Math.round((w.rate||0)*100)}))}
                color={T.teal} field="score" height={70}/>
            </Card>
          )}
          {compBehav.length>0&&(
            <div style={{marginBottom:12}}>
              <div style={{fontSize:10,fontWeight:700,color:T.textTer,textTransform:"uppercase",
                letterSpacing:"0.1em",marginBottom:8}}>Behavior insights</div>
              {compBehav.map((ins,i)=>{
                const col=ins.level==="high"?T.red:ins.level==="good"?T.success:T.warning;
                return(
                  <div key={i} style={{
                    background:`${col}10`,border:`1px solid ${col}30`,
                    borderLeft:`3px solid ${col}`,borderRadius:12,padding:"9px 12px",marginBottom:7,
                  }}>
                    <div style={{fontSize:12,color:T.textSec,lineHeight:1.5}}>{ins.msg}</div>
                  </div>
                );
              })}
            </div>
          )}
          {complianceHistory.length===0&&(
            <Card style={{textAlign:"center",padding:"28px 20px"}}>
              <div style={{fontSize:13,fontWeight:600,color:T.textSec,marginBottom:4}}>No compliance data yet</div>
              <div style={{fontSize:12,color:T.textTer,lineHeight:1.5}}>Complete your first session to track adherence.</div>
            </Card>
          )}
          {sessions.length>0&&(
            <Card>
              <div style={{fontSize:11,color:T.textSec,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.08em"}}>
                Session recovery signals
              </div>
              <div style={{display:"flex",gap:6}}>
                {sessions.slice(-4).map((s,i)=>{
                  const avg=(s.loggedSets||[]).reduce((a,ls)=>a+(ls.pump||3),0)/Math.max(1,(s.loggedSets||[]).length);
                  const label=avg>=4?"High":avg>=3?"Mod":"Low";
                  const color=avg>=4?T.success:avg>=3?T.warning:T.orange;
                  const date=new Date(s.timestamp).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
                  return(
                    <div key={i} style={{flex:1,background:T.bgRaise,borderRadius:12,padding:"8px 6px",textAlign:"center"}}>
                      <div style={{fontSize:10,color:T.textSec,marginBottom:3}}>{date}</div>
                      <div style={{fontSize:12,fontWeight:800,color}}>{label}</div>
                      <div style={{fontSize:10,color:T.textSec,marginTop:2}}>pump</div>
                    </div>
                  );
                })}
              </div>
            </Card>
          )}
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// EXERCISE LIBRARY
// ═══════════════════════════════════════════════════════════════
function ExerciseLibrary(){
  const [filter,setFilter]=useState("all");
  const [search,setSearch]=useState("");
  const [selected,setSelected]=useState(null);
  const groups=["all",...Object.keys(EXERCISES)];
  const filtered=ALL_EXERCISES.filter(ex=>(filter==="all"||ex.muscleGroup===filter)&&ex.name.toLowerCase().includes(search.toLowerCase()));
  const equipLabel={barbell:"BAR",dumbbell:"DB",cable:"CBL",machine:"MCH",bodyweight:"BW"};
  const diffColors=["",T.success,T.warning,T.red];
  const diffLabels=["","Beginner","Inter.","Advanced"];
  // ── MUSCLE MAP — exercise pattern → data-muscle values (matches SVG) ──
  const MUSCLE_MAP = {
    horizontal_push: { primary:["chest"],               secondary:["deltoids","triceps"] },
    fly:             { primary:["chest"],               secondary:["deltoids"] },
    vertical_push:   { primary:["deltoids"],            secondary:["triceps","traps","chest"] },
    horizontal_pull: { primary:["back"],                secondary:["biceps","deltoids"] },
    vertical_pull:   { primary:["back"],                secondary:["biceps"] },
    rear_delt:       { primary:["deltoids","back"],     secondary:["traps"] },
    squat:           { primary:["quads","glutes"],      secondary:["hamstrings","calves","back"] },
    hip_hinge:       { primary:["hamstrings","glutes"], secondary:["back","calves"] },
    knee_flexion:    { primary:["hamstrings"],          secondary:["glutes","calves"] },
    knee_extension:  { primary:["quads"],               secondary:[] },
    ankle_plantar:   { primary:["calves"],              secondary:[] },
    elbow_flexion:   { primary:["biceps"],              secondary:["forearms","deltoids"] },
    elbow_extension: { primary:["triceps"],             secondary:["chest","deltoids"] },
    shoulder_abduct: { primary:["deltoids"],            secondary:["traps"] },
  };

  const muscleMap = selected
    ? MUSCLE_MAP[selected.pattern] || { primary:[], secondary:[] }
    : { primary:[], secondary:[] };

  const MUSCLE_LABELS_MAP = {
    chest:"Chest",        deltoids:"Shoulders",  back:"Back",
    biceps:"Biceps",      triceps:"Triceps",     forearms:"Forearms",
    core:"Core",          obliques:"Obliques",   traps:"Trapezius",
    quads:"Quads",        hamstrings:"Hamstrings", glutes:"Glutes",
    calves:"Calves",      adductors:"Adductors",
  };

  // ── MuscleDiagram — CSS-based highlighting on real SVG paths ──────
  function MuscleDiagram({ muscleMap, accent }){
    const [view,setView]     = useState("front");
    const [fading,setFading] = useState(false);
    const [tip,setTip]       = useState(null);

    const isPri = (id) => muscleMap.primary.includes(id);
    const isSec = (id) => muscleMap.secondary.includes(id);

    function switchView(v){
      if(v===view) return;
      setFading(true);
      setTimeout(()=>{ setView(v); setFading(false); }, 200);
    }

    // Generate CSS rules for currently active muscles
    const activeCSS = React.useMemo(()=>{
      const rules=[];
      muscleMap.primary.forEach(m=>{
        rules.push(`.mg-${view}[data-muscle="${m}"]{fill:${accent}!important;filter:drop-shadow(0 0 6px ${accent}99);animation:md_pulse 2.4s ease-in-out infinite;}`);
      });
      muscleMap.secondary.forEach(m=>{
        rules.push(`.mg-${view}[data-muscle="${m}"]{fill:${accent}55!important;filter:none;animation:none;}`);
      });
      return rules.join('');
    },[muscleMap, view, accent]);

    function handleSVGPointer(e){
      const path=e.target.closest('[data-muscle]');
      if(!path){ setTip(null); return; }
      const m=path.getAttribute('data-muscle');
      if(!m||['head','neck','hands','feet'].includes(m)){ setTip(null); return; }
      const label=MUSCLE_LABELS_MAP[m]||m;
      const r=e.currentTarget.getBoundingClientRect();
      setTip({label, x:e.clientX-r.left, y:e.clientY-r.top});
    }

    const priLbls = muscleMap.primary.map(id=>MUSCLE_LABELS_MAP[id]).filter(Boolean);
    const secLbls = muscleMap.secondary.map(id=>MUSCLE_LABELS_MAP[id]).filter(Boolean);
    const svgPaths = view==="front" ? SVG_PATHS_FRONT : SVG_PATHS_BACK;

    // Add view-specific class to each path for scoped CSS
    const scopedPaths = svgPaths.replace(/class="mg"/g, `class="mg mg-${view}"`);

    return(
      <div style={{borderRadius:12,background:"#0E0E12",border:"1px solid #1A1A22",padding:"12px 10px",marginBottom:12}}>
        <style>{`
          @keyframes md_pulse{
            0%,100%{filter:drop-shadow(0 0 5px ${accent}99);}
            50%{filter:drop-shadow(0 0 11px ${accent}CC) drop-shadow(0 0 3px ${accent});}
          }
          .mg{fill:#5a5a66;stroke:#2a2d33;stroke-width:0.7;transition:fill 0.22s ease,filter 0.22s ease;cursor:pointer;}
          .mg:hover{fill:#727280!important;}
          ${activeCSS}
        `}</style>
        {/* Header */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <span style={{fontSize:10,fontWeight:700,color:"#3A3A50",textTransform:"uppercase",letterSpacing:"0.14em"}}>Muscles targeted</span>
          <div style={{display:"flex",background:"#0A0A0D",borderRadius:8,padding:2}}>
            {["front","back"].map(v=>(
              <button
              aria-label={`Show ${v} view`} key={v} onClick={()=>switchView(v)} style={{
                padding:"3px 11px",borderRadius:8,border:"none",cursor:"pointer",
                fontSize:10,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",fontFamily:"inherit",
                background:view===v?"#252530":"transparent",
                color:view===v?accent:"#3A3A50",
                transition:"all 0.18s ease",
              }}>{v}</button>
            ))}
          </div>
        </div>
        {/* SVG + legend */}
        <div style={{display:"flex",gap:10,alignItems:"flex-start",justifyContent:"center"}}>
          <div style={{position:"relative",flexShrink:0}}>
            <svg
              width="108" height="140"
              viewBox="80 45 340 540"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              style={{opacity:fading?0:1,transition:"opacity 0.2s ease",display:"block"}}
              onMouseMove={handleSVGPointer}
              onMouseLeave={()=>setTip(null)}
              onTouchStart={e=>{const t=e.touches[0];handleSVGPointer({target:e.target,currentTarget:e.currentTarget,clientX:t.clientX,clientY:t.clientY});}}
              onTouchEnd={()=>setTimeout(()=>setTip(null),1300)}
              dangerouslySetInnerHTML={{__html:scopedPaths}}
            />
            {tip&&(
              <div style={{
                position:"absolute",
                left:Math.min(tip.x+8,80),top:Math.max(tip.y-26,2),
                background:"#16161E",border:`1px solid ${accent}40`,borderRadius:8,
                padding:"2px 8px",fontSize:10,fontWeight:700,color:accent,
                pointerEvents:"none",whiteSpace:"nowrap",
                boxShadow:`0 2px 10px rgba(0,0,0,0.75)`,zIndex:10,
              }}>{tip.label}</div>
            )}
          </div>
          {/* Legend */}
          <div style={{display:"flex",flexDirection:"column",gap:7,paddingTop:4,minWidth:80}}>
            {priLbls.length>0&&(
              <div>
                <div style={{display:"flex",alignItems:"center",gap:4,marginBottom:4}}>
                  <div style={{width:7,height:7,borderRadius:2,background:accent,boxShadow:`0 0 5px ${accent}90`,flexShrink:0}}/>
                  <span style={{fontSize:10,fontWeight:800,color:"#3A3A50",textTransform:"uppercase",letterSpacing:"0.1em"}}>Primary</span>
                </div>
                {priLbls.map(l=><div key={l} style={{fontSize:11,color:"#E8E8F0",paddingLeft:11,lineHeight:1.9,fontWeight:600}}>{l}</div>)}
              </div>
            )}
            {secLbls.length>0&&(
              <div>
                <div style={{display:"flex",alignItems:"center",gap:4,marginBottom:4}}>
                  <div style={{width:7,height:7,borderRadius:2,background:accent+"80",flexShrink:0}}/>
                  <span style={{fontSize:10,fontWeight:800,color:"#3A3A50",textTransform:"uppercase",letterSpacing:"0.1em"}}>Secondary</span>
                </div>
                {secLbls.map(l=><div key={l} style={{fontSize:11,color:"#888898",paddingLeft:11,lineHeight:1.9}}>{l}</div>)}
              </div>
            )}
            <div style={{marginTop:"auto",paddingTop:8,borderTop:"1px solid #1A1A22"}}>
              <div style={{display:"flex",alignItems:"center",gap:4,padding:"4px 7px",borderRadius:8,border:"1px dashed #1E1E28"}}>
                <span style={{fontSize:10,color:"#2E2E3A"}}>▶</span>
                <span style={{fontSize:10,color:"#2E2E3A",lineHeight:1.5}}>Video<br/>soon</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    );
  }

  if(selected) return(
    <div style={{animation:"fadeUp 0.45s cubic-bezier(0.22,1,0.36,1) both"}}>
      <button
              aria-label="Close exercise detail" onClick={()=>setSelected(null)} style={{background:"none",border:"none",color:T.textSec,cursor:"pointer",fontSize:13,fontFamily:"inherit",marginBottom:14,padding:0}}>← Back</button>
      <div style={{marginBottom:14}}><div style={{fontSize:22,fontWeight:800}}>{selected.name}</div><div style={{fontSize:12,color:T.textSec,marginTop:3,textTransform:"capitalize"}}>{selected.muscleGroup} · {selected.pattern.replace(/_/g," ")}</div></div>
      <MuscleDiagram muscleMap={muscleMap} accent={T.accent}/>
      <Card style={{marginBottom:10}}>
        <div style={{fontSize:11,color:T.textSec,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.08em"}}>Coaching cues</div>
        {selected.cues.map((c,i)=><div key={i} style={{display:"flex",gap:10,marginBottom:8,alignItems:"flex-start"}}><div style={{width:20,height:20,borderRadius:8,background:`${T.accent}20`,color:T.accent,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,flexShrink:0}}>{i+1}</div><div style={{fontSize:13,color:T.textSec,lineHeight:1.5}}>{c}</div></div>)}
      </Card>
      <Card>
        <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>
          {[["Equipment",`${equipLabel[selected.equip]||selected.equip}`,null],["Goal",selected.goal==="S"?"Strength":"Hypertrophy",selected.goal==="S"?T.orange:T.accent],["Sets × Reps",`${selected.sets} × ${selected.reps}`,null],["Target RIR",selected.rir,null]].map(([l,v,c])=>(
            <div key={l}><div style={{fontSize:10,color:T.textTer,marginBottom:3}}>{l}</div><div style={{fontSize:13,fontWeight:700,textTransform:"capitalize",color:c||T.textPri}}>{v}</div></div>
          ))}
        </div>
        <AbbrLegend terms={["RIR","BAR","DB","CBL","MCH","BW"]}/>
      </Card>
    </div>
  );
  return(
    <div style={{animation:"fadeUp 0.45s cubic-bezier(0.22,1,0.36,1) both"}}>
      <div style={{marginBottom:14}}><div style={{fontSize:22,fontWeight:800}}>Exercises</div><div style={{fontSize:13,color:T.textSec,marginTop:3}}>{ALL_EXERCISES.length} movements with coaching cues</div></div>
      <div style={{position:"relative",marginBottom:9}}>
        <label htmlFor="exercise-search" style={{display:"none"}}>Search exercises</label>
        <input id="exercise-search" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search exercises…" style={{width:"100%",padding:"10px 13px 10px 32px",borderRadius:12,border:`1px solid ${T.border}`,background:T.bgInput,color:T.textPri,fontSize:13,fontFamily:"inherit",outline:"none"}}/>
        <span aria-hidden="true" style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",color:T.textTer,fontSize:13}}>⌕</span>
      </div>
      <div style={{display:"flex",gap:5,marginBottom:8,overflowX:"auto",paddingBottom:3}}>
        {groups.map(g=><button key={g} onClick={()=>setFilter(g)} style={{flexShrink:0,padding:"5px 10px",borderRadius:16,border:`1px solid ${filter===g?T.accent:T.border}`,background:filter===g?`${T.accent}18`:T.bgRaise,color:filter===g?T.accent:T.textSec,fontSize:10,fontWeight:700,cursor:"pointer",fontFamily:"inherit",textTransform:"capitalize"}}>{g}</button>)}
      </div>
      <AbbrLegend terms={["BAR","DB","CBL","MCH","BW"]}/>
      <div style={{display:"flex",flexDirection:"column",gap:7}}>
        {filtered.map(ex=>(
          <Card key={ex.id} onClick={()=>setSelected(ex)} style={{padding:"10px 13px"}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              {/* Equipment badge — no emoji */}
              <div style={{width:36,height:36,borderRadius:12,background:T.bgRaise,border:`1px solid ${T.border}`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                <span style={{fontSize:10,fontWeight:700,fontFamily:"'SF Mono','Menlo','Monaco','Courier New',monospace",color:T.textSec,letterSpacing:"0.04em"}}>{equipLabel[ex.equip]||"—"}</span>
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:700,marginBottom:1}}>{ex.name}</div>
                <div style={{fontSize:10,color:T.textSec,textTransform:"capitalize"}}>{ex.muscleGroup} · {ex.goal==="S"?"Strength":"Hypertrophy"} · {ex.reps} reps</div>
              </div>
              <Badge color={diffColors[ex.diff]}>{diffLabels[ex.diff]}</Badge>
            </div>
          </Card>
        ))}
        {filtered.length===0&&<div style={{textAlign:"center",color:T.textTer,padding:32,fontSize:13}}>No exercises found</div>}
      </div>
    </div>
  );
}

// APE PANEL — working links + functional override
// ═══════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════
// AUTO-ADJUST PROGRAM ENGINE
// The full adaptation pipeline: volume → exercises → intensity → deload
// Returns a diff object so the user can preview and confirm before applying.
// ═══════════════════════════════════════════════════════════════

// ── Step 1: Compute target weekly sets per muscle ─────────────
function calcTargetVolumes(liveState, sessions=[], exp="Intermediate"){
  const targets = {};
  for(const [muscle, state] of Object.entries(liveState)){
    // No session data → return current volume unchanged, never suggest increases
    targets[muscle] = sessions.length === 0 ? state.volume : adjustMuscleVolume(state, exp);
  }
  return targets;
}

// ── Step 2: Volume adjustment ──────────────────────────────────
// Distributes weekly volume across the days that train each muscle.
// Returns updated days with adjusted set counts.
function applyVolumeAdjustment(days, targetVolumes, changes){
  // Count how many days each muscle appears in
  const muscleDayCount = {};
  days.forEach(day => {
    const seenInDay = new Set();
    day.exercises.forEach(ex => {
      const m = ex.muscleGroup;
      if(m && !seenInDay.has(m)){
        muscleDayCount[m] = (muscleDayCount[m]||0) + 1;
        seenInDay.add(m);
      }
    });
  });

  return days.map(day => ({
    ...day,
    exercises: day.exercises.map(ex => {
      const m = ex.muscleGroup;
      if(!m || !targetVolumes[m]) return ex;
      const daysForMuscle = muscleDayCount[m] || 1;
      const setsPerDay    = Math.max(1, Math.round(targetVolumes[m] / daysForMuscle));
      if(setsPerDay === ex.sets) return ex;
      changes.push({
        type:    "volume",
        day:     day.day,
        exName:  ex.name,
        muscle:  m,
        field:   "sets",
        from:    ex.sets,
        to:      setsPerDay,
        label:   `${ex.name} sets: ${ex.sets} → ${setsPerDay}`,
        reason:  setsPerDay < ex.sets
          ? `Reduce ${m} volume — fatigue too high for current load`
          : `Increase ${m} volume — recovery capacity available`,
      });
      return { ...ex, sets: setsPerDay };
    }),
  }));
}

// ── Step 3: Exercise adaptation ────────────────────────────────
// Swaps exercises where secondary muscles are over-fatigued.
// Uses SWAP_RULES (pattern-based) + ALL_EXERCISES for candidate lookup.
function applyExerciseSwaps(days, liveState, changes){
  const usedIds = new Set(days.flatMap(d => d.exercises.map(e => e.id)));
  return days.map(day => ({
    ...day,
    exercises: day.exercises.map(ex => {
      const rule = SWAP_RULES[ex.pattern];
      if(!rule) return ex;
      const guardFatigue = liveState[rule.guard]?.fatigue ?? 0;
      if(guardFatigue <= rule.threshold) return ex;
      // Find best candidate with target pattern, preferring unused exercises
      const candidate =
        ALL_EXERCISES.find(e => e.pattern === rule.swapTo && !usedIds.has(e.id)) ||
        ALL_EXERCISES.find(e => e.pattern === rule.swapTo && e.id !== ex.id);
      if(!candidate) return ex;
      usedIds.add(candidate.id);
      changes.push({
        type:    "swap",
        day:     day.day,
        exName:  ex.name,
        muscle:  rule.guard,
        field:   "exercise",
        from:    ex.name,
        to:      candidate.name,
        label:   `${ex.name} → ${candidate.name}`,
        reason:  rule.reason,
      });
      return { ...ex, ...candidate, sets: ex.sets }; // keep adjusted sets
    }),
  }));
}

// ── Step 4: Intensity / load adjustment ───────────────────────
// Derives base load from last logged session for each exercise,
// then applies multiplier based on fatigue + performance trend.
function applyLoadAdjustment(days, liveState, sessions, changes){
  // Build last-logged-load map: exerciseName → kg
  const lastLoad = {};
  sessions.slice().reverse().forEach(session => {
    (session.loggedSets||[]).forEach(s => {
      if(s.exercise && s.load && !lastLoad[s.exercise]){
        lastLoad[s.exercise] = s.load;
      }
    });
  });

  return days.map(day => ({
    ...day,
    exercises: day.exercises.map(ex => {
      const m     = ex.muscleGroup;
      const state = liveState[m];
      if(!state) return ex;
      const base  = lastLoad[ex.name] ?? null;
      if(base === null) return ex; // no session data → don't guess

      const { fatigue, performanceTrend } = state;
      let multiplier = 1;
      let reason = null;

      if(performanceTrend > 0 && fatigue < 60){
        multiplier = 1.025;
        reason = "Progressive overload — positive trend, low fatigue";
      } else if(fatigue > 80){
        multiplier = 0.95;
        reason = "Load reduction — fatigue above recovery threshold";
      } else if(performanceTrend < 0 && fatigue > 65){
        multiplier = 0.975;
        reason = "Slight load reduction — declining performance with elevated fatigue";
      }

      if(multiplier === 1) return ex;
      const newLoad = Math.round(base * multiplier * 2) / 2; // round to nearest 0.5kg
      changes.push({
        type:    "load",
        day:     day.day,
        exName:  ex.name,
        muscle:  m,
        field:   "load",
        from:    base,
        to:      newLoad,
        label:   `${ex.name} load: ${base}kg → ${newLoad}kg`,
        reason,
      });
      return { ...ex, _suggestedLoad: newLoad }; // don't overwrite base ex.load
    }),
  }));
}

// ── Step 5: Deload override ────────────────────────────────────
// If 3+ muscles are critically fatigued, deload entire program.
function applyDeload(days, changes){
  changes.push({
    type:   "deload",
    day:    "All days",
    exName: "Full program",
    field:  "deload",
    from:   "Normal week",
    to:     "Deload week (70% volume, 85% load)",
    label:  "Full program deload",
    reason: "Systemic fatigue detected across 3+ muscle groups — mandatory recovery week",
  });
  return days.map(day => ({
    ...day,
    exercises: day.exercises.map(ex => ({
      ...ex,
      sets:          Math.max(1, Math.ceil(ex.sets * 0.7)),
      _suggestedLoad: ex._suggestedLoad
        ? Math.round(ex._suggestedLoad * 0.85 * 2) / 2
        : undefined,
    })),
  }));
}

// ── Main orchestrator ─────────────────────────────────────────
// Returns { adjustedProgram, changes, isDeload, suggestions }
// Does NOT mutate program. Consumer shows diff and confirms.
function autoAdjustProgram(program, liveState, sessions, exp="Intermediate"){
  if(!program || !liveState) return null;

  const goal    = program.goal || "Hypertrophy";
  const changes = [];
  const suggestions = getSmartRecommendations(liveState, sessions, goal, exp);

  // 1. Target volumes from adaptive engine
  const targetVolumes = calcTargetVolumes(liveState, sessions, exp);

  // 2. Volume adjustment
  let days = applyVolumeAdjustment(program.days, targetVolumes, changes);

  // 3. Exercise swaps
  days = applyExerciseSwaps(days, liveState, changes);

  // 4. Load adjustment
  days = applyLoadAdjustment(days, liveState, sessions, changes);

  // 5. Deload check — override everything if systemic fatigue
  const highFatigueMuscles = Object.values(liveState).filter(m => m.fatigue > 80).length;
  const isDeload = highFatigueMuscles >= 3;
  if(isDeload){
    // Reset changes, deload takes precedence
    changes.length = 0;
    days = applyDeload(program.days, changes);
  }

  return {
    adjustedProgram: { ...program, days, autoAdjustedAt: Date.now() },
    changes,
    isDeload,
    suggestions,
    targetVolumes,
  };
}

function AnimatedNumber({ from, to, suffix="", style={} }){
  const [display, setDisplay] = React.useState(from);
  const [animKey, setAnimKey] = React.useState(0);
  React.useEffect(()=>{
    if(from===to){ setDisplay(to); return; }
    const dur = 500;
    const start = performance.now();
    function tick(now){
      const t = Math.min(1,(now-start)/dur);
      // Ease out cubic
      const eased = 1 - Math.pow(1-t, 3);
      const val = from + (to-from)*eased;
      setDisplay(Math.round(val*10)/10);
      if(t<1) requestAnimationFrame(tick);
      else setDisplay(to);
    }
    requestAnimationFrame(tick);
    setAnimKey(k=>k+1);
  },[from,to]);
  return(
    <span key={animKey}
      style={{display:"inline-block",animation:"numberTick 0.18s ease both",...style}}>
      {typeof to==="number"&&to%1!==0 ? display.toFixed(1) : Math.round(display)}{suffix}
    </span>
  );
}

function SwapText({ from, to, color, delay=0 }){
  const [phase, setPhase] = React.useState("init"); // init|striking|done
  React.useEffect(()=>{
    const t1 = setTimeout(()=>setPhase("striking"), delay);
    const t2 = setTimeout(()=>setPhase("done"), delay+400);
    return()=>{ clearTimeout(t1); clearTimeout(t2); };
  },[delay]);
  return(
    <div style={{position:"relative",overflow:"hidden"}}>
      {phase!=="done"&&(
        <div style={{
          fontSize:12,color:T.textSec,fontWeight:500,
          animation:phase==="striking"?"strikeOld 0.38s ease forwards":"none",
          textDecoration:phase==="striking"?"line-through":"none",
        }}>
          {from}
        </div>
      )}
      {phase==="done"&&(
        <div style={{
          fontSize:12,color,fontWeight:700,
          animation:"slideNewIn 0.28s cubic-bezier(0.22,1,0.36,1) both",
        }}>
          {to}
        </div>
      )}
    </div>
  );
}

function AffectedMuscleMap({ changes, liveState }){
  // Collect muscles touched by this diff
  const affected = {};
  changes.forEach(c => {
    if(!c.muscle) return;
    const m = c.muscle;
    const fat = liveState[m]?.fatigue ?? 0;
    const col = c.type==="deload" ? T.red
              : c.type==="swap"   ? T.teal
              : (c.to > c.from)   ? T.success
              :                     T.red;
    affected[m] = col;
  });

  if(Object.keys(affected).length === 0) return null;

  // Build scoped CSS for just the affected muscles

function AdaptationPanel({ sessions=[], program, muscleState, muscleFatigue={}, currentDayIdx=0, onProgramChange, user }){
  const [tab,            setTab]           = useState("recs");
  const [applied,        setApplied]       = useState(false);
  const [overrideMode,   setOverrideMode]  = useState(false);
  const [overrides,      setOverrides]     = useState({});
  const [manualNotes,    setManualNotes]   = useState({});
  const [swapsDismissed, setSwapsDismissed]= useState({});
  const [adjResult,      setAdjResult]     = useState(null);
  const [adjRunning,     setAdjRunning]    = useState(false);
  const [adjConfirmed,   setAdjConfirmed]  = useState(false);
  const [cardDecisions,  setCardDecisions] = useState({});
  // cardDecisions: { [index]: "kept" | "rejected" } — undecided = undefined
  // Coach notes — read from shared DB using athlete's clientId
  const [coachNotes,     setCoachNotes]    = useState(user?.coachNotes||[]);
  const [readNoteIds,    setReadNoteIds]   = useState(()=>{
    try{ return JSON.parse(localStorage.getItem("ironcoach_readnotes")||"[]"); }
    catch(e){ return []; }
  });

  // Poll Supabase for new coach notes every 15 seconds
  React.useEffect(()=>{
    if(!user?.id) return;
    async function fetchNotes(){
      const { data } = await sb.from("coach_notes")
        .select("text,created_at")
        .eq("athlete_id", user.id)
        .order("created_at", { ascending: true });
      if(!data) return;
      const fresh = data.map(n=>({ text:n.text, ts:new Date(n.created_at).getTime() }));
      setCoachNotes(prev=>{
        if(prev.length===fresh.length && JSON.stringify(prev)===JSON.stringify(fresh)) return prev;
        return fresh;
      });
    }
    fetchNotes();
    const interval = setInterval(fetchNotes, 15000);
    return()=>clearInterval(interval);
  },[user?.id]);

  function markRead(noteTs){
    const next = [...new Set([...readNoteIds, noteTs])];
    setReadNoteIds(next);
    try{ localStorage.setItem("ironcoach_readnotes", JSON.stringify(next)); }catch(e){}
  }

  function markAllRead(){
    const next = coachNotes.map(n=>n.ts);
    setReadNoteIds(prev=>[...new Set([...prev,...next])]);
    try{ localStorage.setItem("ironcoach_readnotes", JSON.stringify(
      [...new Set([...readNoteIds,...next])]
    )); }catch(e){}
  }

  const unreadNotes = coachNotes.filter(n=>!readNoteIds.includes(n.ts));
  const hasCoachNotes = coachNotes.length > 0;

  // Apply swap: replace the exercise at pattern `from` in today's program day
  // with the best-matching exercise of pattern `to` from ALL_EXERCISES
  function handleApplySwap(suggestion, cardIdx){
    if(!program || !onProgramChange) return;
    const { from, to } = suggestion;
    // Find best alternative: same pattern as `to`, not already in today's day
    const todayExIds = new Set(
      (program.days?.[currentDayIdx]?.exercises || []).map(e=>e.id)
    );
    const candidate = ALL_EXERCISES.find(
      ex => ex.pattern === to && !todayExIds.has(ex.id)
    ) || ALL_EXERCISES.find(ex => ex.pattern === to); // fallback: allow even if present
    if(!candidate) return;
    // Replace first exercise in today's day whose pattern matches `from`
    const updatedDays = program.days.map((day, di) => {
      if(di !== currentDayIdx) return day;
      let replaced = false;
      const updatedExercises = day.exercises.map(ex => {
        if(!replaced && ex.pattern === from){
          replaced = true;
          return candidate;
        }
        return ex;
      });
      return { ...day, exercises: updatedExercises };
    });
    onProgramChange({ ...program, days: updatedDays });
    setSwapsDismissed(prev => ({ ...prev, [cardIdx]: "applied" }));
  }

  const lastSession  = sessions[sessions.length-1];
  const lastSets     = lastSession?.loggedSets || [];
  const avgPump      = lastSets.length ? lastSets.reduce((a,s)=>a+(s.pump||3),0)/lastSets.length : null;
  const avgRir       = lastSets.length ? lastSets.reduce((a,s)=>a+s.rir,0)/lastSets.length : null;
  const muscleGroups = [...new Set(lastSets.map(s=>s.muscleGroup).filter(Boolean))];

  // Merge live fatigue into muscleState for display
  const exp  = user?.exp  || "Intermediate";
  const goal = program?.goal || "Hypertrophy";

  const liveState = React.useMemo(()=>{
    if(!muscleState) return initMuscleState(goal, exp);
    const merged = {};
    for(const m of Object.keys(MUSCLE_LANDMARKS)){
      merged[m] = {
        ...(muscleState[m] || initMuscleState()[m]),
        fatigue: muscleFatigue[m] ?? muscleState[m]?.fatigue ?? 0,
      };
    }
    return merged;
  }, [muscleState, muscleFatigue]);

  // APE (old session-level) recommendations
  const STUDIES=[
    {study:"Schoenfeld et al. 2017",url:"https://pubmed.ncbi.nlm.nih.gov/27797728/"},
    {study:"Krieger 2010",          url:"https://pubmed.ncbi.nlm.nih.gov/20300012/"},
    {study:"Chiu & Barnes 2003",    url:"https://pubmed.ncbi.nlm.nih.gov/15039495/"},
    {study:"Helms et al. 2018",     url:"https://pubmed.ncbi.nlm.nih.gov/30250193/"},
    {study:"Zourdos et al. 2016",   url:"https://pubmed.ncbi.nlm.nih.gov/26530105/"},
  ];
  const typeColors={
    "load":T.teal,"volume":T.accent,"load+volume":T.success,
    "deload":T.warning,"maintain":T.textSec,"technique":T.purple,
    "intensity":T.orange,"trend":T.blue,"fatigue-trend":T.red,
  };
  const apeChanges = lastSession
    ? runAPE({pump:avgPump,soreness:lastSession.soreness||2,rir:avgRir,sessions}).map((r,i)=>({
        ...r,
        muscle: muscleGroups[i] ? muscleGroups[i].charAt(0).toUpperCase()+muscleGroups[i].slice(1) : "Overall",
        color:  typeColors[r.type]||T.teal,
        ...(STUDIES[i%STUDIES.length]),
      }))
    : [];
  const activeChanges = apeChanges.filter((_,i)=>overrides[i]!=="skip");

  // Smart recommendations from adaptive engine
  const smartRecs = React.useMemo(()=>
    getSmartRecommendations(liveState, sessions, goal, exp),
    [liveState, sessions]
  );

  // Exercise swap suggestions for today's program patterns
  const swapSuggestions = React.useMemo(()=>{
    if(!program) return [];
    const todayExercises = program.days?.[(sessions.length-1)%Math.max(1,(program.days?.length||1))]?.exercises || [];
    return todayExercises
      .map(ex => getExerciseSwap(ex.pattern, liveState))
      .filter(Boolean);
  }, [program, liveState, sessions.length]);

  // Volume state for all muscles — sorted by proximity to MRV
  const volumeRows = Object.entries(liveState)
    .map(([m,s])=>({
      muscle: m,
      label: ({chest:"Chest",deltoids:"Shoulders",back:"Back",biceps:"Biceps",
               triceps:"Triceps",forearms:"Forearms",traps:"Traps",core:"Core",
               obliques:"Obliques",quads:"Quads",hamstrings:"Hamstrings",
               glutes:"Glutes",calves:"Calves"})[m]||m,
      ...s,
      // Only show nextVol suggestion when there's actual session data
      nextVol: sessions.length > 0 ? adjustMuscleVolume(s, exp) : null,
      trend: s.performanceTrend,
    }))
    .sort((a,b)=>(b.fatigue)-(a.fatigue));

  if(!lastSession){
    return(
      <div style={{animation:"fadeUp 0.45s cubic-bezier(0.22,1,0.36,1) both"}}>
        <div style={{marginBottom:14}}>
          <div style={{fontSize:22,fontWeight:800}}>Adaptation Engine</div>
          <div style={{fontSize:13,color:T.textSec,marginTop:4}}>Per-muscle auto-regulation · Volume · Stimulus</div>
        </div>
        <Card style={{textAlign:"center",padding:"40px 20px",border:`1px solid ${T.border}`}}>
          <div style={{fontSize:36,marginBottom:12,opacity:0.3}}>⚡</div>
          <div style={{fontSize:14,fontWeight:600,color:T.textSec,marginBottom:8}}>No session data yet</div>
          <div style={{fontSize:12,color:T.textTer,lineHeight:1.6}}>
            Complete your first workout. The adaptive engine will track per-muscle fatigue, stimulus, and performance to auto-regulate your volume.
          </div>
        </Card>
        <AbbrLegend terms={["APE","RIR","MAV","MEV","MRV"]}/>
      </div>
    );
  }

  if(applied){
    return(
      <div style={{animation:"fadeUp 0.45s cubic-bezier(0.22,1,0.36,1) both"}}>
        <div style={{marginBottom:14}}>
          <div style={{fontSize:22,fontWeight:800}}>Adaptation Engine</div>
        </div>
        <div style={{textAlign:"center",padding:"48px 0"}}>
          <div style={{fontSize:44,color:T.accent,fontWeight:800}}>✓</div>
          <div style={{fontSize:20,fontWeight:700,color:T.accent,marginTop:12}}>Program Updated</div>
          <div style={{fontSize:13,color:T.textSec,marginTop:8,lineHeight:1.6,maxWidth:280,margin:"8px auto 0"}}>
            {activeChanges.length} recommendations applied. Engine continues learning.
          </div>
          <button
              aria-label="Reset recommendations" onClick={()=>{setApplied(false);setOverrideMode(false);setOverrides({});setManualNotes({});}}
            style={{marginTop:20,background:"none",border:`1px solid ${T.border}`,borderRadius:12,padding:"8px 20px",color:T.textSec,fontSize:12,cursor:"pointer"}}>
            Review again
          </button>
        </div>
      </div>
    );
  }

  return(
    <div style={{animation:"fadeUp 0.45s cubic-bezier(0.22,1,0.36,1) both"}}>
      {/* Header */}
      <div style={{marginBottom:14}}>
        <div style={{fontSize:22,fontWeight:800}}>Adaptation Engine</div>
        <div style={{fontSize:13,color:T.textSec,marginTop:4}}>
          {sessions.length} session{sessions.length!==1?"s":""} · {smartRecs.length} recommendation{smartRecs.length!==1?"s":""}
        </div>
      </div>

      {/* Coach notes — visible to athlete, populated by coach from their dashboard */}
      {hasCoachNotes&&(
        <div style={{marginBottom:14}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <div style={{display:"flex",alignItems:"center",gap:7}}>
              <div style={{fontSize:10,fontWeight:700,color:T.teal,textTransform:"uppercase",
                letterSpacing:"0.1em"}}>
                From your coach
              </div>
              {unreadNotes.length>0&&(
                <div style={{
                  fontSize:10,fontWeight:800,color:"#000",
                  background:T.teal,borderRadius:12,
                  padding:"1px 6px",minWidth:16,textAlign:"center",
                }}>
                  {unreadNotes.length}
                </div>
              )}
            </div>
            {unreadNotes.length>0&&(
              <button aria-label="Mark all notes as read"
              onClick={markAllRead} style={{
                background:"none",border:"none",color:T.textTer,
                fontSize:11,cursor:"pointer",padding:"2px 6px",
              }}>
                Mark all read
              </button>
            )}
          </div>

          {coachNotes.slice().reverse().map((note, i)=>{
            const isUnread = !readNoteIds.includes(note.ts);
            const date = new Date(note.ts).toLocaleDateString("en-GB",{
              day:"numeric", month:"short",
              hour:"2-digit", minute:"2-digit",
            });
            return(
              <div key={note.ts} onClick={()=>isUnread&&markRead(note.ts)}
                style={{
                  background: isUnread ? `${T.teal}12` : T.bgCard,
                  border: `1px solid ${isUnread ? T.teal+"50" : T.border}`,
                  borderLeft: `3px solid ${isUnread ? T.teal : T.border}`,
                  borderRadius: 12,
                  padding: "11px 13px",
                  marginBottom: 7,
                  cursor: isUnread ? "pointer" : "default",
                  transition: "all 0.2s ease",
                  animation: `diffCardIn 0.4s cubic-bezier(0.22,1,0.36,1) ${i*40}ms both`,
                }}>
                <div style={{display:"flex",justifyContent:"space-between",
                  alignItems:"flex-start",marginBottom:6}}>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    {/* Coach avatar */}
                    <div style={{
                      width:24,height:24,borderRadius:8,
                      background:`linear-gradient(135deg,${T.teal}40,${T.accent}30)`,
                      display:"flex",alignItems:"center",justifyContent:"center",
                      fontSize:10,fontWeight:800,color:T.teal,flexShrink:0,
                    }}>
                      {(note.coachName||"C").charAt(0).toUpperCase()}
                    </div>
                    <span style={{fontSize:11,fontWeight:700,
                      color: isUnread ? T.teal : T.textSec}}>
                      {note.coachName||"Your coach"}
                    </span>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    {isUnread&&(
                      <div style={{width:6,height:6,borderRadius:"50%",
                        background:T.teal,flexShrink:0}}/>
                    )}
                    <span style={{fontSize:10,color:T.textTer}}>{date}</span>
                  </div>
                </div>
                <div style={{fontSize:12,color:T.textSec,lineHeight:1.55}}>
                  {note.text}
                </div>
                {isUnread&&(
                  <div style={{fontSize:10,color:T.teal,marginTop:6,opacity:0.7}}>
                    Tap to mark as read
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {/* Tab bar */}
      <div style={{display:"flex",gap:4,marginBottom:14,background:T.bgRaise,borderRadius:12,padding:4}}>
        {[
          ["recs",   "Recs",   "Recommendations"],
          ["volume", "Volume", "Volume targets"],
          ["swaps",  "Swaps",  "Exercise swaps"],
          ["auto",   "Auto",   "Auto-adjust program"],
        ].map(([id,label,ariaLabel])=>(
          <button
            key={id}
            aria-label={ariaLabel}
            onClick={()=>setTab(id)}
            style={{
              flex:1,padding:"7px 0",borderRadius:12,border:"none",cursor:"pointer",
              fontSize:11,fontWeight:700,fontFamily:"inherit",
              background:tab===id?T.bgCard:"transparent",
              color:tab===id?T.accent:T.textSec,
              transition:"all 0.15s ease",
            }}>
            {label}
          </button>
        ))}
      </div>

      {/* ── Tab: Smart Recommendations ── */}
      {tab==="recs"&&(
        <div>
          <AbbrLegend terms={["APE","RIR","MAV","MEV","MRV"]}/>

          {/* Smart recs from adaptive engine */}
          {smartRecs.length>0&&(
            <div style={{marginTop:12,marginBottom:4}}>
              <div style={{fontSize:10,fontWeight:700,color:T.textTer,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:8}}>
                Adaptive engine · {smartRecs.length} signal{smartRecs.length!==1?"s":""}
              </div>
              {smartRecs.map((r,i)=>(
                <Card key={i} style={{marginBottom:8,borderColor:`${r.color}35`,padding:"10px 12px"}}>
                  <div style={{display:"flex",gap:8,alignItems:"flex-start"}}>
                    <div style={{
                      width:28,height:28,borderRadius:8,flexShrink:0,
                      background:`${r.color}18`,
                      display:"flex",alignItems:"center",justifyContent:"center",
                      fontSize:16,color:r.color,fontWeight:800,
                      fontFamily:"'SF Mono','Menlo',monospace",
                    }}>{r.icon}</div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:3}}>
                        <span style={{fontSize:12,fontWeight:700,color:r.color}}>{r.title}</span>
                        <Badge color={r.color}>{r.type}</Badge>
                      </div>
                      <div style={{fontSize:12,color:T.textSec,lineHeight:1.5}}>{r.msg}</div>
                    </div>
                  </div>
                </Card>
              ))}
            </div>
          )}

          {/* APE session-level recs */}
          {apeChanges.length>0&&(
            <div style={{marginTop:12}}>
              <div style={{fontSize:10,fontWeight:700,color:T.textTer,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:8}}>
                Last session · APE analysis
              </div>
              {overrideMode&&(
                <div style={{marginBottom:8,padding:"8px 12px",background:`${T.orange}12`,border:`1px solid ${T.orange}30`,borderRadius:12}}>
                  <div style={{fontSize:11,fontWeight:600,color:T.orange}}>Override mode — skip individual recommendations</div>
                </div>
              )}
              {apeChanges.map((c,i)=>{
                const skipped=overrides[i]==="skip";
                return(
                  <div key={i} style={{marginBottom:8,opacity:skipped?0.35:1,transition:"opacity 0.2s"}}>
                    <Card style={{borderColor:`${c.color}30`,padding:"10px 12px",position:"relative"}}>
                      {overrideMode&&(
                        <button
              aria-label={skipped?"Include this recommendation":"Skip this recommendation"} onClick={()=>setOverrides(o=>({...o,[i]:skipped?undefined:"skip"}))}
                          style={{position:"absolute",top:8,right:8,background:skipped?`${T.success}20`:`${T.red}15`,border:`1px solid ${skipped?T.success:T.red}40`,borderRadius:8,padding:"2px 8px",fontSize:10,fontWeight:700,color:skipped?T.success:T.red,cursor:"pointer"}}>
                          {skipped?"Restore":"Skip"}
                        </button>
                      )}
                      <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:6}}>
                        <Badge color={c.color}>{c.muscle}</Badge>
                        <Badge color={typeColors[c.type]||T.teal}>{c.type}</Badge>
                        {skipped&&<Badge color={T.textTer}>skipped</Badge>}
                      </div>
                      <div style={{display:"flex",gap:8,alignItems:"flex-start",marginBottom:8}}>
                        <span style={{fontSize:18,color:c.color}}>{c.icon}</span>
                        <span style={{fontSize:12,color:T.textSec,lineHeight:1.5}}>{c.msg}</span>
                      </div>
                      <div style={{background:`${c.color}10`,borderRadius:8,padding:"6px 10px",display:"flex",gap:8,alignItems:"center"}}>
                        <div style={{flex:1}}>
                          <div style={{fontSize:10,fontWeight:700,color:c.color,marginBottom:1}}>Evidence</div>
                          <div style={{fontSize:10,color:T.textTer}}>{c.study}</div>
                        </div>
                        <button
              aria-label="Open research reference" onClick={()=>{ try{ window.open(c.url,"_blank","noopener,noreferrer"); }catch(e){} }}
                          style={{fontSize:10,color:c.color,fontWeight:700,background:`${c.color}20`,borderRadius:8,padding:"4px 10px",border:`1px solid ${c.color}40`,cursor:"pointer"}}>
                          PubMed ↗
                        </button>
                      </div>
                      {overrideMode&&!skipped&&(
                        <input value={manualNotes[i]||""} onChange={e=>setManualNotes(n=>({...n,[i]:e.target.value}))}
                          placeholder="Add your own note…"
                          style={{width:"100%",marginTop:8,padding:"7px 10px",borderRadius:8,border:`1px solid ${T.border}`,background:T.bgInput,color:T.textPri,fontSize:11,outline:"none"}}/>
                      )}
                    </Card>
                  </div>
                );
              })}
              <div style={{display:"flex",gap:8,marginTop:4}}>
                <Btn style={{flex:1}} onClick={()=>setApplied(true)}>Apply {activeChanges.length}/{apeChanges.length} ✓</Btn>
                <Btn variant={overrideMode?"secondary":"ghost"} style={{flex:1}} onClick={()=>setOverrideMode(m=>!m)}>
                  {overrideMode?"Done":"Override"}
                </Btn>
              </div>
            </div>
          )}
        </div>
      )}

      {/* ── Tab: Volume State ── */}
      {tab==="volume"&&(
        <div>
          <div style={{fontSize:11,color:T.textSec,marginBottom:12,lineHeight:1.5}}>
            Per-muscle sets/week vs MEV–MRV range. Volume auto-adjusts at each week boundary.
          </div>
          {volumeRows.map(r=>{
            const pct    = ((r.volume - r.mev) / Math.max(1, r.mrv - r.mev)) * 100;
            const nextPct= r.nextVol!=null ? ((r.nextVol - r.mev) / Math.max(1, r.mrv - r.mev)) * 100 : null;
            const delta  = r.nextVol!=null ? r.nextVol - r.volume : null;
            const fCol   = fatigueColor(r.fatigue) || T.textTer;
            const trendIcon = r.trend > 0 ? "↑" : r.trend < 0 ? "↓" : "→";
            const trendCol  = r.trend > 0 ? T.success : r.trend < 0 ? T.red : T.textTer;
            return(
              <Card key={r.muscle} style={{marginBottom:8,padding:"10px 12px"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <span style={{fontSize:12,fontWeight:700}}>{r.label}</span>
                    <span style={{fontSize:11,color:trendCol,fontWeight:700}}>{trendIcon}</span>
                  </div>
                  <div style={{display:"flex",gap:8,alignItems:"center"}}>
                    {/* Fatigue badge */}
                    <div style={{fontSize:10,color:fCol,fontWeight:700,fontFamily:"'SF Mono','Menlo',monospace"}}>
                      {Math.round(r.fatigue)}% fatigue
                    </div>
                    {/* Volume delta */}
                    {delta!=null&&delta!==0&&(
                      <div style={{fontSize:10,fontWeight:700,color:delta>0?T.success:T.warning,
                        background:delta>0?`${T.success}18`:`${T.warning}18`,
                        borderRadius:8,padding:"1px 6px"}}>
                        {delta>0?"+":""}{delta} next wk
                      </div>
                    )}
                  </div>
                </div>
                {/* Volume bar */}
                <div style={{position:"relative",height:6,borderRadius:2,background:T.bgRaise,overflow:"visible",marginBottom:4}}>
                  {/* Current volume fill */}
                  <div style={{position:"absolute",left:0,top:0,height:"100%",
                    width:`${Math.max(0,Math.min(100,pct))}%`,
                    background:fatigueColor(r.fatigue)||T.accent,
                    borderRadius:2,transition:"width 0.4s ease"}}/>
                  {/* Next week projected (dashed line) */}
                  {delta!=null&&delta!==0&&(
                    <div style={{position:"absolute",top:-2,
                      left:`${Math.max(0,Math.min(100,nextPct))}%`,
                      width:2,height:10,background:delta>0?T.success:T.warning,
                      borderRadius:1,opacity:0.8}}/>
                  )}
                  {/* MAV marker */}
                  <div style={{position:"absolute",top:-3,
                    left:`${((r.mav-r.mev)/Math.max(1,r.mrv-r.mev))*100}%`,
                    width:1,height:12,background:T.accent,opacity:0.5}}/>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",marginTop:2}}>
                  <span style={{fontSize:10,color:T.textTer}}>MEV {r.mev}</span>
                  <span style={{fontSize:10,color:T.accent,fontWeight:700,fontFamily:"'SF Mono','Menlo',monospace"}}>
                    {r.volume} sets
                  </span>
                  <span style={{fontSize:10,color:T.textTer}}>MRV {r.mrv}</span>
                </div>
                {/* Stimulus score */}
                <div style={{display:"flex",alignItems:"center",gap:6,marginTop:5}}>
                  <span style={{fontSize:10,color:T.textTer}}>Stimulus</span>
                  <div style={{flex:1,height:3,borderRadius:2,background:T.bgRaise,overflow:"hidden"}}>
                    <div style={{width:`${(r.stimulus/10)*100}%`,height:"100%",
                      background:r.stimulus>=7?T.success:r.stimulus>=4?T.warning:T.red,
                      borderRadius:2,transition:"width 0.4s ease"}}/>
                  </div>
                  <span style={{fontSize:10,color:T.textTer,fontFamily:"'SF Mono','Menlo',monospace",width:22,textAlign:"right"}}>
                    {r.stimulus.toFixed(1)}
                  </span>
                </div>
              </Card>
            );
          })}
          <AbbrLegend terms={["MEV","MAV","MRV"]}/>
        </div>
      )}

      {/* ── Tab: Exercise Swaps ── */}
      {tab==="swaps"&&(
        <div>
          <div style={{fontSize:11,color:T.textSec,marginBottom:12,lineHeight:1.5}}>
            When a secondary muscle is too fatigued, the engine recommends swapping the exercise to spare that muscle while keeping primary stimulus.
          </div>
          {swapSuggestions.length===0?(
            <Card style={{textAlign:"center",padding:"32px 20px",border:`1px solid ${T.border}`}}>
              <div style={{fontSize:22,marginBottom:8,opacity:0.3}}>—</div>
              <div style={{fontSize:13,fontWeight:600,color:T.textSec,marginBottom:4}}>No swaps needed</div>
              <div style={{fontSize:12,color:T.textTer,lineHeight:1.5}}>
                All secondary muscles are within acceptable fatigue limits. Continue with your programmed exercises.
              </div>
            </Card>
          ):(
            swapSuggestions.map((s,i)=>{
              const state = swapsDismissed[i];
              if(state === "kept"){
                return(
                  <Card key={i} style={{marginBottom:8,opacity:0.4,padding:"10px 12px"}}>
                    <div style={{fontSize:12,color:T.textTer}}>Keeping original — {s.from.replace(/_/g," ")}</div>
                  </Card>
                );
              }
              if(state === "applied"){
                return(
                  <Card key={i} style={{marginBottom:8,borderColor:`${T.success}40`,padding:"10px 12px"}}>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <div style={{width:18,height:18,borderRadius:8,background:`${T.success}20`,
                        display:"flex",alignItems:"center",justifyContent:"center",
                        fontSize:11,color:T.success,fontWeight:700,flexShrink:0}}>✓</div>
                      <div>
                        <div style={{fontSize:12,fontWeight:700,color:T.success}}>Swap applied</div>
                        <div style={{fontSize:11,color:T.textTer,marginTop:1}}>
                          {s.from.replace(/_/g," ")} replaced with {s.to.replace(/_/g," ")} in today's session
                        </div>
                      </div>
                    </div>
                  </Card>
                );
              }
              return(
                <Card key={i} style={{marginBottom:10,borderColor:`${T.warning}40`}}>
                  <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:8}}>
                    <Badge color={T.warning}>swap</Badge>
                    <Badge color={T.red}>{s.guard} {s.fatigue}% fatigued</Badge>
                  </div>
                  <div style={{fontSize:13,fontWeight:700,marginBottom:4}}>
                    {s.from.replace(/_/g," ")} → {s.to.replace(/_/g," ")}
                  </div>
                  <div style={{fontSize:12,color:T.textSec,lineHeight:1.5,marginBottom:8}}>
                    {s.reason}
                  </div>
                  <div style={{display:"flex",gap:6}}>
                    <Btn variant="ghost" style={{flex:1,fontSize:11}}
                      onClick={()=>setSwapsDismissed(prev=>({...prev,[i]:"kept"}))}>
                      Keep original
                    </Btn>
                    <Btn style={{flex:1,fontSize:11}}
                      onClick={()=>handleApplySwap(s, i)}
                      disabled={!onProgramChange}>
                      Apply swap
                    </Btn>
                  </div>
                </Card>
              );
            })
          )}
          {/* Manual swap explorer */}
          <div style={{marginTop:12,paddingTop:12,borderTop:`1px solid ${T.border}`}}>
            <div style={{fontSize:10,fontWeight:700,color:T.textTer,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:8}}>
              All secondary fatigue levels
            </div>
            {Object.entries(liveState)
              .filter(([,s])=>s.fatigue>40)
              .sort((a,b)=>b[1].fatigue-a[1].fatigue)
              .slice(0,5)
              .map(([m,s])=>{

      {/* ── Tab: Auto-Adjust Program ── */}
      {tab==="auto"&&(()=>{

        // ── Animated number — counts from `from` to `to` over 600ms ──

        // ── Strikethrough then slide-in for text swaps ──

        // ── Single diff card ──

        // ── Mini muscle silhouette showing affected muscles ──

        // ── Run / confirm handlers (hoisted for reuse) ──
        function runAutoAdjust(){
          if(!program) return;
          setAdjRunning(true);
          setAdjConfirmed(false);
          setCardDecisions({});
          setTimeout(()=>{
            try{
              const result = autoAdjustProgram(program, liveState, sessions, exp);
              setAdjResult(result);
            }catch(e){
              console.error("Auto-adjust error:", e);
              setAdjResult({ changes:[], isDeload:false, suggestions:[], targetVolumes:{},
                adjustedProgram:program, _error: e.message });
            }finally{
              setAdjRunning(false);
            }
          }, 140);
        }

        function confirmAdjustment(){
          if(!adjResult || !onProgramChange) return;

          if(adjResult.isDeload){
            // Deload week — apply all deload changes directly, no card selection needed
            onProgramChange(adjResult.adjustedProgram);
            setAdjConfirmed("deload");
            setAdjResult(null);
            setCardDecisions({});
            return;
          }

          // Regular changes — apply only what athlete explicitly kept
          const keptIndices = Object.entries(cardDecisions)
            .filter(([,v])=>v==="kept")
            .map(([k])=>parseInt(k));
          if(keptIndices.length === 0){ setAdjResult(null); return; }
          onProgramChange(adjResult.adjustedProgram);
          setAdjConfirmed("changes");
          setAdjResult(null);
          setCardDecisions({});
        }

        // ── State: no program ──
        if(!program){
          return(
            <Card style={{textAlign:"center",padding:"32px 20px"}}>
              <div style={{fontSize:13,fontWeight:600,color:T.textSec,marginBottom:6}}>No program loaded</div>
              <div style={{fontSize:12,color:T.textTer,lineHeight:1.6}}>

              </div>
            </Card>
          );
        }

        // ── State: confirmed ──
        if(adjConfirmed){
          const isDeloadConfirm = adjConfirmed === "deload";
          return(
            <div style={{textAlign:"center",padding:"44px 0",animation:"scaleIn 0.38s cubic-bezier(0.22,1,0.36,1) both"}}>
              <div style={{
                width:56,height:56,borderRadius:16,

              }}>{isDeloadConfirm ? "–" : "✓"}</div>
              <div style={{fontSize:17,fontWeight:800,
                color: isDeloadConfirm ? T.red : T.accent, marginBottom:6}}>

            <div style={{textAlign:"center",padding:"52px 0"}}>
              <div style={{
                width:32,height:32,borderRadius:"50%",
                border:`3px solid ${T.border}`,
                borderTopColor:T.accent,
                animation:"spin 0.7s linear infinite",
                margin:"0 auto 16px",
              }}/>
              <div style={{fontSize:12,color:T.textSec,animation:"fadeIn 0.3s ease"}}>
                Analysing athlete state…

        if(!adjResult){
          const highFat  = Object.values(liveState).filter(m=>m.fatigue>75).length;
          const ready    = Object.values(liveState).filter(m=>m.fatigue<50&&m.performanceTrend>0).length;
          const underStim= Object.values(liveState).filter(m=>m.stimulus<4&&m.fatigue<50).length;

            <div style={{animation:"fadeUp 0.4s cubic-bezier(0.22,1,0.36,1) both"}}>

        // ── State: error ──
        if(adjResult?._error){
          return(
            <div style={{textAlign:"center",padding:"32px 0"}}>

                </div>
              </div>
              <div style={{display:"flex",gap:6,alignItems:"center"}}>
                {!isDeload&&undecidedCount>0&&(
                  <button
                    aria-label="Keep all changes"
                    onClick={()=>{
                      const all={};
                      changes.forEach((_,i)=>{ all[i]="kept"; });
                      setCardDecisions(all);
                    }}
                    style={{
                      background:T.bgRaise,border:`1px solid ${T.success}50`,

                      cursor:"pointer",padding:"5px 10px",fontFamily:"inherit",

                    Keep all
