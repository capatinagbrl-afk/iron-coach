// ── Coach floating nav ──
function CoachNav({ current, onNavigate }){
  const btnRefs=useRef([]);
  function handleKeyDown(e,idx){
    let next=-1;
    if(e.key==="ArrowRight"||e.key==="ArrowDown") next=(idx+1)%COACH_NAV.length;
    if(e.key==="ArrowLeft" ||e.key==="ArrowUp")   next=(idx-1+COACH_NAV.length)%COACH_NAV.length;
    if(next>=0){ e.preventDefault(); btnRefs.current[next]?.focus(); }
  }
  return(
    <nav aria-label="Coach navigation" style={{position:"sticky",bottom:0,zIndex:200,display:"flex",justifyContent:"center",padding:"12px 16px max(env(safe-area-inset-bottom,12px),12px)",background:"transparent",pointerEvents:"none"}}>
      <div style={{display:"flex",gap:4,background:`${T.bgCard}f2`,backdropFilter:"blur(20px)",WebkitBackdropFilter:"blur(20px)",border:`1px solid ${T.teal}50`,borderRadius:16,padding:"6px 8px",boxShadow:"0 8px 32px rgba(0,0,0,0.5)",pointerEvents:"all"}}>
        {COACH_NAV.map((item,idx)=>{
          const active=current===item.id;
          return(
            <button key={item.id} ref={el=>btnRefs.current[idx]=el}
              aria-label={item.label} aria-current={active?"page":undefined}
              tabIndex={active?0:-1}
              onClick={()=>onNavigate(item.id)}
              onKeyDown={e=>handleKeyDown(e,idx)}
              style={{background:active?`${T.teal}20`:"transparent",border:`1px solid ${active?T.teal+"60":"transparent"}`,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"8px 16px",borderRadius:16,transition:"all 0.2s",minWidth:58,minHeight:52,justifyContent:"center"}}>
              <div style={{fontSize:16,color:active?T.teal:T.textTer,filter:active?`drop-shadow(0 0 6px ${T.teal}90)`:"none",transition:"all 0.2s",lineHeight:1}}>{item.icon}</div>
              <div style={{fontSize:10,fontWeight:600,letterSpacing:"0.04em",color:active?T.teal:T.textTer,textTransform:"uppercase",transition:"all 0.2s"}}>{item.label}</div>
            </button>
          );
        })}
      </div>
    </nav>
  );
}

// ── COACH APP root ──
function CoachApp({ coach, onLogout, onDeleteAccount, theme="dark", prefs={}, onPrefsChange }){
  buildTheme(theme);
  const GLOBAL_CSS = makeGlobalCSS(theme);
  const [screen,setScreen]=useState("clients");
  const [selectedClient,setSelectedClient]=useState(null);
  const [allNotes,setAllNotes]=useState([]);
  const [clientNotes,setClientNotes]=useState({});
  // Initialise clients from userData loaded at login
  const [clients,setClients]=useState(coach?.coachClients||[]);
  const [assigned,setAssigned]=useState({});
  // appliedSuggs keyed by clientId — persists across navigation within the session
  const [allAppliedSuggs,setAllAppliedSuggs]=useState({});
  const [templates,setTemplates]=useState([
    {
      name:"Hypertrophy Starter 4×", goal:"Hypertrophy", weeks:8, freq:4,
      split:[
        {day:"Mon",focus:"Chest + Shoulders"},{day:"Tue",focus:"Back + Arms"},
        {day:"Thu",focus:"Legs"},{day:"Fri",focus:"Chest + Arms"},
      ],
      desc:"High-rep compound and isolation work. Designed to maximise weekly volume across all muscle groups with an emphasis on pump and metabolic stress.",
    },
    {
      name:"Strength Foundation", goal:"Strength", weeks:12, freq:3,
      split:[
        {day:"Mon",focus:"Squat day"},{day:"Wed",focus:"Bench day"},{day:"Fri",focus:"Deadlift day"},
      ],
      desc:"3-day powerlifting-style program. Compound-first, progressive overload, long rest periods. Suitable for intermediate athletes chasing absolute strength.",
    },
    {
      name:"Competition Prep", goal:"Peak", weeks:6, freq:5,
      split:[
        {day:"Mon",focus:"Squat max effort"},{day:"Wed",focus:"Bench max effort"},
        {day:"Fri",focus:"Deadlift max effort"},{day:"Sat",focus:"Accessory work"},
      ],
      desc:"Peak prep block. Max effort main lifts, minimal accessory volume. Designed for athletes 6 weeks out from a competition.",
    },
  ]);
  const mainRef=useRef(null);

  // Tour — shows every new session until explicitly dismissed within that session.
  // Uses sessionStorage so it resets each time the app is opened fresh,
  // but stays dismissed during the current session after the user closes it.
  const [coachTipIdx,    setCoachTipIdx]   = useState(0);
  const [tourDismissedSess, setTourDismissedSess] = useState(()=>{
    try{ return localStorage.getItem("ironcoach_coachTourDone")==="1"; }catch(e){ return false; }
  });
  const tourDismissed = tourDismissedSess;
  function dismissTour(){
    setTourDismissedSess(true);
    try{ localStorage.setItem("ironcoach_coachTourDone","1"); }catch(e){}
  }
  function resetTour(){
    setCoachTipIdx(0);
    setTourDismissedSess(false);
    try{ localStorage.removeItem("ironcoach_coachTourDone"); }catch(e){}
  }

  // Focus management on screen change
  useEffect(()=>{
    const t=setTimeout(()=>{
      const first=mainRef.current?.querySelector('button:not([disabled]),a,[tabindex="0"],input');
      first?.focus({preventScroll:false});
    },80);
    return()=>clearTimeout(t);
  },[screen]);

  async function handleSendNote(clientId, text){
    const note = { text, ts: Date.now(), clientId,
                   coachName: coach?.name || "Your coach" };
    // Optimistic local update
    setClientNotes(prev=>({...prev,[clientId]:[...(prev[clientId]||[]),note]}));
    setAllNotes(prev=>[...prev,note].slice(-500));
    // Persist to Supabase
    await saveCoachNote(coach?.id, clientId, text, coach?.name);
  }

  async function handleAddClient(clientId){
    const result = await addCoachClient(coach?.id, clientId);
    if(!result.ok){
      pushToast(result.error, "error");
      return false;
    }
    // Refresh client list
    const updated = await fetchCoachClients(coach?.id);
    setClients(updated);
    return true;
  }

  // Load templates from Supabase on mount (replaces hardcoded defaults)
  useEffect(()=>{
    if(!coach?.id) return;
    async function loadTmpl(){
      const loaded = await loadCoachTemplates(coach.id);
      if(loaded && loaded.length > 0) setTemplates(loaded);
    }
    loadTmpl();
  },[coach?.id]);

  // Subscribe to real-time updates from Supabase for coach notes and sessions
  useEffect(()=>{
    if(!coach?.id) return;
    const interval = setInterval(async()=>{
      const updated = await fetchCoachClients(coach.id);
      setClients(updated);
    }, 30000);
    return()=>clearInterval(interval);
  },[coach?.id]);

  // Live coaching stats for CoachProfile
  const coachStats={
    activeClients: clients.length,
    notesSent:     allNotes.length,
    programsAssigned: Object.values(assigned).reduce((a,ids)=>a+ids.length,0),
    sessionsReviewed: clients.reduce((a,c)=>(c.sessions?.length||0)+a,0),
  };

  return(
    <>
      <style>{GLOBAL_CSS}</style>
      <style>{PHONE_FRAME_CSS}</style>
      <div className="pf-outer">
        <div className="pf-notch"/>
        <div className="pf-screen">
        <div style={{width:"100%",minHeight:"100%",display:"flex",flexDirection:"column",background:T.bg,position:"relative"}}>
        <ToastContainer/>

        {/* Coach top bar */}
        <header style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"13px 20px 10px",borderBottom:`1px solid ${T.teal}30`,position:"sticky",top:0,background:`${T.bg}f0`,backdropFilter:"blur(20px)",zIndex:100}}>
          <div style={{display:"flex",alignItems:"center",gap:T.sp2}}>
            <IACMark size={27} variant="coach"/>
            <span style={{fontWeight:700,fontSize:15,letterSpacing:"-0.01em"}}>Iron <span style={{color:T.teal}}>Pro</span></span>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            {selectedClient&&(
              <button aria-label="Back to clients" onClick={()=>setSelectedClient(null)} style={{background:"none",border:"none",color:T.textSec,cursor:"pointer",fontSize:13,padding:"4px 8px",minHeight:44,display:"flex",alignItems:"center"}}>← Back</button>
            )}
            {/* Coach badge — navigates to profile, shows personalised name */}
            <button
              aria-label={`Open profile for Coach ${coach.name.split(" ")[0]}`}
              onClick={()=>{ setSelectedClient(null); setScreen("cprofile"); }}
              style={{
                padding:"6px 13px",borderRadius:8,
                background:screen==="cprofile"?`${T.teal}28`:`${T.teal}18`,
                border:`1px solid ${screen==="cprofile"?T.teal:T.teal+"40"}`,
                cursor:"pointer",display:"flex",alignItems:"center",gap:5,minHeight:36,
              }}>
              <span style={{fontSize:11,color:T.teal,fontWeight:700,letterSpacing:"0.01em"}}>
                Coach {coach.name.split(" ")[0]}
              </span>
              {/* Mini chevron to signal tappability */}
              <svg width="8" height="8" viewBox="0 0 8 8" fill="none" aria-hidden="true">
                <path d="M2 2l4 2-4 2" stroke={T.teal} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </button>
          </div>
        </header>

        <main ref={mainRef} tabIndex={0} onMouseEnter={()=>mainRef.current?.focus({preventScroll:true})} style={{flex:1,overflowY:"auto",padding:"15px 15px 0",outline:"none",WebkitOverflowScrolling:"touch"}}>
          {/* Coach quick-start tour — shows on every screen until explicitly dismissed */}
          {!tourDismissed&&(
            <CoachTour
              tipIdx={coachTipIdx}
              onSetIdx={setCoachTipIdx}
              onDismiss={dismissTour}
            />
          )}
          {selectedClient&&screen==="clients"?(
            <CoachClientDetail
              client={selectedClient}
              onBack={()=>setSelectedClient(null)}
              onSendNote={handleSendNote}
              coachNotes={clientNotes[selectedClient.clientId]||[]}
              appliedSuggs={allAppliedSuggs[selectedClient.clientId]||{}}
              onAppliedSuggsChange={patch=>setAllAppliedSuggs(prev=>({
                ...prev,
                [selectedClient.clientId]: typeof patch === "function"
                  ? patch(prev[selectedClient.clientId]||{})
                  : patch,
              }))}
            />
          ):screen==="clients"?(
            <CoachClients coach={coach} onClientSelect={c=>setSelectedClient(c)} onAddClient={handleAddClient} clients={clients}/>
          ):screen==="programs"?(
            <CoachPrograms clients={clients} assigned={assigned} onAssignChange={setAssigned} templates={templates} onTemplatesChange={setTemplates} coachId={coach?.id}/>
          ):screen==="notes"?(
            <CoachNotes allNotes={allNotes} clients={clients} onSendNote={handleSendNote}/>
          ):(
            <CoachProfile
              coach={coach}
              onLogout={onLogout}
              onDeleteAccount={onDeleteAccount}
              stats={coachStats}
              prefs={prefs}
              onPrefsChange={onPrefsChange}
              onCancelSub={()=>onPrefsChange?.({...prefs,coachTier:"free"})}
              onShowTour={resetTour}
            />
          )}
          <div style={{height:90}}/>
        </main>

        <CoachNav current={screen} onNavigate={s=>{setScreen(s);setSelectedClient(null);}}/>
        </div>
        </div>
      </div>
    </>
  );
}

// ─── Toast notification system ────────────────────────────────
// Lightweight module-level toast queue. Components call pushToast()
// and the ToastContainer renders the queue in the top App render.
let _toastListeners = [];
let _toastQueue    = [];

function pushToast(msg, type="error", duration=3500){
  const id = Date.now() + Math.random();
  _toastQueue = [..._toastQueue, { id, msg, type }];
  _toastListeners.forEach(fn=>fn([..._toastQueue]));
  setTimeout(()=>{
    _toastQueue = _toastQueue.filter(t=>t.id!==id);
    _toastListeners.forEach(fn=>fn([..._toastQueue]));
  }, duration);
}

function useToasts(){
  const [toasts, setToasts] = React.useState(_toastQueue);
  React.useEffect(()=>{
    _toastListeners.push(setToasts);
    return ()=>{ _toastListeners = _toastListeners.filter(fn=>fn!==setToasts); };
  },[]);
  return toasts;
}

function ToastContainer(){
  const toasts = useToasts();
  if(!toasts.length) return null;
  const BG = { error:`${T.red}18`, success:`${T.success}18`, warning:`${T.warning}18` };
  const BORDER = { error:`${T.red}50`, success:`${T.success}50`, warning:`${T.warning}50` };
  const COLOR  = { error:T.red, success:T.success, warning:T.warning };
  return(
    <div style={{
      position:"fixed",bottom:90,left:"50%",transform:"translateX(-50%)",
      zIndex:9999,display:"flex",flexDirection:"column",gap:6,
      width:"calc(100% - 32px)",maxWidth:360,pointerEvents:"none",
    }}>
      {toasts.map(t=>(
        <div key={t.id} role="alert" aria-live="assertive" style={{
          background:BG[t.type]||BG.error,
          border:`1px solid ${BORDER[t.type]||BORDER.error}`,
          borderRadius:12,padding:"10px 14px",
          fontSize:12,color:COLOR[t.type]||COLOR.error,
          fontWeight:600,lineHeight:1.4,
          backdropFilter:"blur(8px)",
          animation:"fadeUp 0.3s cubic-bezier(0.22,1,0.36,1) both",
          boxShadow:"0 4px 16px rgba(0,0,0,0.3)",
        }}>{t.msg}</div>
      ))}
    </div>
  );
}

// updateUserInDB: patch any fields on a profile row
// Fire-and-forget safe — callers don't need to await
async function updateUserInDB(clientId, patch){
  // Translate camelCase patch keys to snake_case column names
  const colMap = {
    sessions:         null,   // sessions table
    program:          null,   // programs table
    muscleFatigue:    null,   // muscle_state table (handled below)
    muscleState:      null,   // muscle_state table (handled below)
    suggestionHistory:null,   // suggestion_history table
    coachNotes:       null,   // coach_notes table
    coachConsent:     "coach_consent",
    prefs:            "prefs",
    name:             "name",
    goal:             "goal",
    exp:              "exp",
  };

  // Build profile patch (only columns that map directly to profiles table)
  const profilePatch = {};
  for(const [k,v] of Object.entries(patch)){
    const col = colMap[k];
    if(col) profilePatch[col] = v;
  }

  // Update profiles table if we have direct columns to update
  if(Object.keys(profilePatch).length > 0){
    const { error } = await sb.from("profiles")
      .update(profilePatch)
      .eq("client_id", clientId);
    if(error) console.warn("updateUserInDB profiles:", error.message);
  }

  // Handle muscle_state separately (upsert)
  if(patch.muscleFatigue !== undefined || patch.muscleState !== undefined){
    const { data: profile } = await sb.from("profiles")
      .select("id").eq("client_id", clientId).maybeSingle();
    if(profile){
      const msePatch = { athlete_id: profile.id, last_session_at: new Date().toISOString() };
      if(patch.muscleFatigue !== undefined) msePatch.fatigue = patch.muscleFatigue;
      if(patch.muscleState   !== undefined) msePatch.state   = patch.muscleState;
      const { error } = await sb.from("muscle_state").upsert(msePatch, { onConflict: "athlete_id" });
      if(error) console.warn("updateUserInDB muscle_state:", error.message);
    }
  }
}

// ── Compliance calculation ────────────────────────────────────
// Returns 0–1. Denominator = expected sessions from program freq.
function calcCompliance(sessions=[], program=null){
  if(!sessions.length) return null;
  const freq = program?.freq ?? 3;
  const weeksActive = Math.max(1, program?.currentWeek ?? 1);
  const expected = freq * weeksActive;
  return Math.min(1, sessions.length / expected);
}

// ── Athlete overall status ────────────────────────────────────
// Returns one of: "overreached" | "accumulating" | "progressing" | "undertrained" | "no_data"
function calcAthleteStatus(muscleState, sessions){
  if(!muscleState || !sessions.length) return "no_data";
  const muscles = Object.values(muscleState);
  const highFatigueCount  = muscles.filter(m => m.fatigue > 75).length;
  const decliningCount    = muscles.filter(m => m.performanceTrend < 0).length;
  const lowFatigueCount   = muscles.filter(m => m.fatigue < 35).length;
  const lowStimulusCount  = muscles.filter(m => m.stimulus < 4).length;
  const goodStimulusCount = muscles.filter(m => m.stimulus >= 5 && m.fatigue < 55 && m.performanceTrend >= 0).length;

  if(highFatigueCount >= 3 && decliningCount >= 2) return "overreached";
  if(highFatigueCount >= 2) return "accumulating";
  if(goodStimulusCount >= 3) return "progressing";
  if(lowFatigueCount >= 6 && lowStimulusCount >= 4) return "undertrained";
  return "accumulating"; // default — athlete is somewhere in the middle
}

// ── Per-muscle signal classification ─────────────────────────
// Returns array of { muscle, label, signal, color, fatigue, stimulus, trend }
function classifyMuscleSignals(muscleState){
  if(!muscleState) return [];
  const LABELS = {
    chest:"Chest", deltoids:"Shoulders", back:"Back", biceps:"Biceps",
    triceps:"Triceps", forearms:"Forearms", traps:"Traps", core:"Core",
    obliques:"Obliques", quads:"Quads", hamstrings:"Hamstrings",
    glutes:"Glutes", calves:"Calves",
  };
  return Object.entries(muscleState).map(([muscle, s]) => {
    let signal, color;
    if(s.fatigue > 70){
      signal = "over-fatigued"; color = "#F87171";
    } else if(s.stimulus < 4 && s.fatigue < 45){
      signal = "under-stimulated"; color = "#FCD34D";
    } else if(s.fatigue < 50 && s.performanceTrend >= 0 && s.stimulus >= 5){
      signal = "ready-to-push"; color = "#4ADE80";
    } else {
      signal = "normal"; color = null;
    }
    return { muscle, label: LABELS[muscle]||muscle, signal, color,
      fatigue: Math.round(s.fatigue), stimulus: +s.stimulus.toFixed(1),
      trend: s.performanceTrend, volume: s.volume };
  }).filter(m => m.signal !== "normal")
    .sort((a,b) => {
      const o = { "over-fatigued":3, "under-stimulated":2, "ready-to-push":1 };
      return (o[b.signal]||0) - (o[a.signal]||0);
    });
}

// ── Suggestion deduplication / memory ────────────────────────
// Returns current ISO week string e.g. "2025-W22"
function isoWeek(){
  const now = new Date();
  const jan4 = new Date(now.getFullYear(), 0, 4);
  const week = Math.ceil(((now - jan4) / 86400000 + jan4.getDay() + 1) / 7);
  return `${now.getFullYear()}-W${String(week).padStart(2,"0")}`;
}

// Checks if the same suggestion was made this week — reduces confidence if so
function adjustForHistory(suggestion, prevSuggestions=[]){
  const week = isoWeek();
  const dupe = prevSuggestions.find(p =>
    p.week === week &&
    p.muscle === suggestion.muscle &&
    p.action === suggestion.action
  );
  if(!dupe) return suggestion;
  return { ...suggestion, confidence: Math.max(0.5, suggestion.confidence - 0.15),
    note: "Same recommendation as last session — ensure previous advice was applied" };
}

// ── Main rule engine ─────────────────────────────────────────
function generateSuggestions(athleteState, prevSuggestions=[]){
  const { muscles={}, compliance=null, sessions=[], goal="hypertrophy" } = athleteState;
  const suggestions = [];
  const week = isoWeek();

  // ── A. Per-muscle rules ──
  for(const [muscle, data] of Object.entries(muscles)){
    const { fatigue=0, stimulus=0, performanceTrend=0, volume=0,
            mev=4, mrv=20 } = data;
    const LABELS = {
      chest:"Chest", deltoids:"Shoulders", back:"Back", biceps:"Biceps",
      triceps:"Triceps", forearms:"Forearms", traps:"Traps", core:"Core",
      obliques:"Obliques", quads:"Quads", hamstrings:"Hamstrings",
      glutes:"Glutes", calves:"Calves",
    };
    const label = LABELS[muscle] || muscle;

    // Over-fatigue: high fatigue + declining performance
    if(fatigue > 80 && performanceTrend <= 0){
      suggestions.push(adjustForHistory({
        type: "volume_adjustment", muscle, label,
        action: "reduce", value: fatigue > 88 ? 3 : 2,
        reason: `${label} fatigue at ${Math.round(fatigue)}% with ${performanceTrend < 0 ? "declining" : "flat"} performance — continued loading will drive injury, not adaptation`,
        confidence: fatigue > 88 ? 0.95 : 0.90,
        priority: fatigue > 88 ? "critical" : "high",
        week,
      }, prevSuggestions));
    }
    // Elevated fatigue, still performing — maintain, don't add
    else if(fatigue > 65 && fatigue <= 80 && performanceTrend >= 0){
      suggestions.push(adjustForHistory({
        type: "volume_adjustment", muscle, label,
        action: "maintain",
        reason: `${label} is accumulating fatigue (${Math.round(fatigue)}%) but still adapting — hold volume, don't chase more sets`,
        confidence: 0.80,
        priority: "medium",
        week,
      }, prevSuggestions));
    }
    // Under-stimulated: too easy, lots of recovery capacity left
    else if(stimulus < 4 && fatigue < 50){
      const isStrength = goal === "Strength" || goal === "strength";
      suggestions.push(adjustForHistory({
        type: isStrength ? "intensity_adjustment" : "volume_adjustment",
        muscle, label,
        action: isStrength ? "increase_load" : "increase",
        value: isStrength ? "+5%" : 1,
        reason: `${label} stimulus score ${stimulus.toFixed(1)}/10 with only ${Math.round(fatigue)}% fatigue — ${isStrength ? "increase load 5% to drive strength adaptation" : "add 1 working set to reach productive volume"}`,
        confidence: 0.80,
        priority: "medium",
        week,
      }, prevSuggestions));
    }
    // Clear progression opportunity
    else if(performanceTrend > 0 && fatigue < 55 && stimulus >= 5){
      suggestions.push(adjustForHistory({
        type: "intensity_adjustment", muscle, label,
        action: "increase_load",
        value: "+2.5%",
        reason: `${label} is progressing with manageable fatigue (${Math.round(fatigue)}%) — apply progressive overload now`,
        confidence: 0.85,
        priority: "medium",
        week,
      }, prevSuggestions));
    }
    // At or near MRV
    if(volume >= mrv - 1){
      suggestions.push(adjustForHistory({
        type: "volume_adjustment", muscle, label,
        action: "reduce",
        value: 2,
        reason: `${label} is at ${volume}/${mrv} sets — at maximum recoverable volume. Deload this muscle group before the next meso`,
        confidence: 0.92,
        priority: "high",
        week,
      }, prevSuggestions));
    }
  }

  // ── B. Global deload rule — systemic fatigue ──
  const overFatiguedMuscles = Object.entries(muscles).filter(([,m]) => m.fatigue > 80);
  if(overFatiguedMuscles.length >= 3){
    const names = overFatiguedMuscles.slice(0,3).map(([m]) =>
      ({ chest:"Chest", deltoids:"Shoulders", back:"Back", quads:"Quads",
         hamstrings:"Hamstrings", glutes:"Glutes", biceps:"Biceps", triceps:"Triceps" })[m]||m
    ).join(", ");
    suggestions.push(adjustForHistory({
      type: "deload",
      muscle: null, label: "Full body",
      action: "reduce_all_volume",
      value: "30%",
      reason: `Systemic fatigue detected across ${overFatiguedMuscles.length} muscle groups (${names}) — prescribe a deload week at 50–60% volume before accumulation becomes overtraining`,
      confidence: 0.95,
      priority: "critical",
      week,
    }, prevSuggestions));
  }

  // ── C. Compliance rule ──
  if(compliance !== null && compliance < 0.70){
    const pct = Math.round(compliance * 100);
    suggestions.push({
      type: "compliance_warning",
      muscle: null, label: "Adherence",
      action: "improve_consistency",
      reason: `Session adherence at ${pct}% — adaptation requires consistent stimulus. Identify scheduling barriers before adding volume`,
      confidence: compliance < 0.50 ? 0.95 : 0.88,
      priority: compliance < 0.50 ? "critical" : "high",
      week,
    });
  }

  // ── D. Exercise swap rule ──
  // If a secondary muscle is highly fatigued, flag compound movements
  const swapCandidates = Object.entries(SWAP_RULES).filter(([pattern, rule]) => {
    const guardFatigue = muscles[rule.guard]?.fatigue ?? 0;
    const primaryFatigue = muscles[
      Object.entries(FATIGUE_MUSCLE_MAP).find(([p])=>p===pattern)?.[1]?.primary?.[0]
    ]?.fatigue ?? 100;
    return guardFatigue > 80 && primaryFatigue < 65;
  });
  swapCandidates.forEach(([pattern, rule]) => {
    const guardFatigue = Math.round(muscles[rule.guard]?.fatigue ?? 0);
    const LABELS2 = {chest:"Chest",deltoids:"Shoulders",back:"Back",biceps:"Biceps",triceps:"Triceps",forearms:"Forearms"};
    suggestions.push(adjustForHistory({
      type: "exercise_swap",
      muscle: rule.guard, label: LABELS2[rule.guard]||rule.guard,
      action: "replace",
      from: pattern.replace(/_/g," "),
      to: rule.swapTo.replace(/_/g," "),
      reason: `${LABELS2[rule.guard]||rule.guard} at ${guardFatigue}% fatigue — swap ${pattern.replace(/_/g," ")} to spare the secondary mover while preserving primary stimulus`,
      confidence: 0.85,
      priority: "high",
      week,
    }, prevSuggestions));
  });

  // ── Sort: critical → high → medium → low ──
  suggestions.sort((a,b) =>
    (PRIORITY_WEIGHT[b.priority]||0) - (PRIORITY_WEIGHT[a.priority]||0)
  );

  // Cap at 6 for mobile readability
  return suggestions.slice(0, 6);
}

// ── Full athlete analysis — entry point for coach dashboard ──
function analyzeAthlete(client){
  const sessions    = client?.sessions    || [];
  const program     = client?.program     || null;
  const muscleState = client?.muscleState || null;
  const muscleFatigue = client?.muscleFatigue || {};

  // Merge live fatigue into muscleState
  let liveState = muscleState ? { ...muscleState } : null;
  if(liveState){
    for(const m of Object.keys(liveState)){
      liveState[m] = { ...liveState[m], fatigue: muscleFatigue[m] ?? liveState[m].fatigue ?? 0 };
    }
    // Apply time-based decay from lastFatigueTs
    if(client?.lastFatigueTs){
      const days = Math.floor((Date.now() - client.lastFatigueTs) / 86400000);
      if(days > 0) liveState = applyFatigueDecay(liveState, days, client?.exp||"Intermediate");
    }
  }

  const compliance   = calcCompliance(sessions, program);
  const status       = calcAthleteStatus(liveState, sessions);
  const signals      = classifyMuscleSignals(liveState);
  const prevSugs     = client?.suggestionHistory || [];
  const suggestions  = generateSuggestions({
    muscles:    liveState || {},
    compliance, sessions, goal: program?.goal || client?.goal || "hypertrophy",
  }, prevSugs);

  // Compute last session recency
  const lastTs = sessions.length ? Math.max(...sessions.map(s=>s.timestamp||0)) : null;
  const daysSince = lastTs ? Math.floor((Date.now()-lastTs)/86400000) : null;

  return { status, signals, suggestions, compliance, sessions, program,
           liveState, lastTs, daysSince, sessionCount: sessions.length };
}

// ─── Generate unique 6-char uppercase client ID ───────────────
function generateClientId(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no I,O,0,1 — easy to read aloud
  let id="";
  for(let i=0;i<6;i++) id+=chars[Math.floor(Math.random()*chars.length)];
  // Uniqueness is enforced by the Supabase unique constraint on profiles.client_id
  // Collision probability with <10k users is negligible (31^6 = 887M combinations)
  return id;
}

// ── localStorage session persistence ──────────────────────────
// Keeps the athlete's own state fast and offline-capable.
// Coach-athlete shared data goes through Supabase (above).
function saveState(state){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch(e){ console.warn("saveState failed:", e.message); }
}
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

  useEffect(()=>{
    function onKey(e){
      // Skip if focus is inside an input/textarea
      if(["INPUT","TEXTAREA","SELECT"].includes(document.activeElement?.tagName)) return;
      // Skip if onboarding is visible
      if(showOnboarding) return;
      const map={"1":"dashboard","2":"workout","3":"meso","4":"adapt","5":"library"};
      if(map[e.key]){ e.preventDefault(); setScreen(map[e.key]); }
      if(e.key==="Escape" && screen!=="dashboard") setScreen("dashboard");
    }
    window.addEventListener("keydown",onKey);
    return()=>window.removeEventListener("keydown",onKey);
  },[screen,showOnboarding]);

  // ── currentWeek advancement ──
  function advanceDayAndWeek(){
    if(!program) return;
    const nextIdx=(currentDayIdx+1)%program.days.length;
    const completedCycle = nextIdx===0;
    setCurrentDayIdx(nextIdx);
    if(completedCycle){
      const nextWeek = program.currentWeek + 1;
      if(nextWeek > program.weeks){
        setCompletedMesos(m=>m+1);
        setProgram(p=>({...p, currentWeek:p.weeks}));
      } else {
        setProgram(p=>({...p, currentWeek: nextWeek}));
      }
      // Run weekly adaptation at every cycle boundary
      setMuscleState(prev => {
        // Sync fatigue from muscleFatigue into muscleState before adapting
        const synced = {};
        for(const m of Object.keys(MUSCLE_LANDMARKS)){
          synced[m] = { ...(prev[m] || initMuscleState()[m]), fatigue: muscleFatigue[m] || prev[m]?.fatigue || 0 };
        }
        return runWeeklyAdaptation(synced, sessions, user?.exp||"Intermediate");
      });
    }
  }

  function handleAuth(userData){
    setUser(userData);
    setProgram(userData.program || null);
    setSessions(userData.sessions || []);
    setMuscleFatigue(userData.muscleFatigue || {});
    setLastFatigueTs(null);
    setMuscleState(initMuscleState(null, userData.exp||"Intermediate"));
    setMuscleStateHistory([]);
    setComplianceHistory([]);
    // Restore tier from prefs (saved to Supabase) or localStorage
    const savedTier = userData.prefs?.tier || null;
    setTier(savedTier || "free");
    // Restore prefs (units, theme, splitType etc)
    if(userData.prefs && Object.keys(userData.prefs).length > 0){
      setPrefs(p=>({...p,...userData.prefs}));
    }
    setCurrentDayIdx(userData.program?.currentDay || 0);
    setCompletedMesos(0);
    setShowOnboarding(false);
    setOnboardStep(0);
  }

  function handleSessionComplete(sessionData){
    const ts = Date.now();
    const updated=[...sessions,{...sessionData,timestamp:ts}];
    setSessions(updated);
    advanceDayAndWeek();
    const todayPatterns = (program?.days?.[currentDayIdx]?.exercises||[])
      .map(ex=>ex.pattern).filter(Boolean);
    const {fatigue:newFatigue, timestamp:newTs} = updateMuscleFatigue(
      {...sessionData, timestamp:ts},
      todayPatterns,
      muscleFatigue,
      lastFatigueTs,
      user?.exp||"Intermediate"
    );
    setMuscleFatigue(newFatigue);
    setLastFatigueTs(newTs);
    const today = new Date(ts).toISOString().slice(0,10);
    setComplianceHistory(h => {
      const filtered = h.filter(e => e.date !== today);
      return [...filtered, { date: today, planned: true, completed: true }].slice(-120);
    });
    setMuscleState(prev=>{
      const merged = {};
      for(const m of Object.keys(MUSCLE_LANDMARKS)){
        merged[m] = { ...(prev[m]||initMuscleState()[m]), fatigue: newFatigue[m]??prev[m]?.fatigue??0 };
      }
      setMuscleStateHistory(h=>[...h,{ timestamp:ts, state:merged }].slice(-20));
      return merged;
    });
    // Persist session to Supabase
    if(user?.id){
      saveSession(user.id, null, {
        ...sessionData,
        dayIdx:  currentDayIdx,
        focus:   program?.days?.[currentDayIdx]?.focus,
      });
      updateUserInDB(user.clientId, { muscleFatigue: newFatigue });
    }
  }

  async function handleLogout(){
    await sbSignOut();
    setUser(null);
    setProgram(null);
    setSessions([]);
    setMuscleFatigue({});
    setLastFatigueTs(null);
    setMuscleState(initMuscleState());
    setMuscleStateHistory([]);
    setComplianceHistory([]);
    setTier("free");
    setCurrentDayIdx(0);
    setCompletedMesos(0);
    setOnboardingDone(false);
    setShowOnboarding(false);
    setOnboardStep(0);
    try{ localStorage.removeItem(LS_KEY); }catch(e){}
    setScreen("dashboard");
  }

  async function handleDeleteAccount(){
    // 1. Delete auth user from Supabase (cascades to all profile data via FK)
    await deleteAccount();
    // 2. Clear local storage
    try{ localStorage.removeItem(LS_KEY); }catch(e){}
    try{ localStorage.removeItem("ironcoach_readnotes"); }catch(e){}
    try{ localStorage.removeItem("ironcoach_coachTourDone"); }catch(e){}
    // 3. Reset all app state
    setUser(null); setProgram(null); setSessions([]);
    setMuscleFatigue({}); setLastFatigueTs(null);
    setMuscleState(initMuscleState()); setMuscleStateHistory([]);
    setComplianceHistory([]); setTier("free");
    setCurrentDayIdx(0); setCompletedMesos(0);
    setOnboardingDone(false); setShowOnboarding(false); setOnboardStep(0);
    setScreen("dashboard");
  }

  if(!user) return(
    <>
      <style>{makeGlobalCSS((saved?.prefs?.theme)||"dark")}</style>
      <style>{PHONE_FRAME_CSS}</style>
      <div className="pf-outer">
        <div className="pf-notch"/>
        <div className="pf-screen">
          <div style={{width:"100%",minHeight:"100%",background:T.bg}}>
            <AuthScreen onAuth={handleAuth}/>
          </div>
        </div>
      </div>
    </>
  );

  // ── Coach users get the full CoachApp ──
  if(user?.role==="coach"){
    return(
      <CoachApp
        coach={user}
        onLogout={handleLogout}
        onDeleteAccount={handleDeleteAccount}
        theme={prefs?.theme||"dark"}
        prefs={prefs}
        onPrefsChange={p=>{ setPrefs(p); }}
      />
    );
  }

  const showInNav=["dashboard","workout","meso","adapt","library"];

  function gated(screenId, feature, component){
    if(isPremium) return component;
    return <PaywallScreen feature={feature} onBack={()=>setScreen("dashboard")} onTierChange={setTier}/>;
  }

  const screens={
    dashboard: <Dashboard onNavigate={setScreen} user={user} program={program} sessions={sessions} currentDayIdx={currentDayIdx} prefs={prefs} onPrefsChange={setPrefs} onProgramReady={async p=>{
        setProgram(p);
        setCurrentDayIdx(0);
        if(user?.id){
          // Find existing self-created program (not a coach-assigned one)
          const { data:ex } = await sb.from("programs")
            .select("id")
            .eq("owner_id", user.id)
            .eq("is_template", false)
            .is("assigned_by_coach", null)  // only self-created
            .limit(1).maybeSingle();
          const pr={
            owner_id:user.id, name:p.name, goal:p.goal, weeks:p.weeks,
            freq:p.freq, current_week:p.currentWeek||1, current_day:0,
            days:p.days, is_template:false, assigned_by_coach:null,
            assignment_status:"accepted",
          };
          if(ex){ await sb.from("programs").update(pr).eq("id",ex.id); }
          else  { await sb.from("programs").insert(pr); }
        }
        if(!onboardingDone && user?.role==="athlete"){
          setOnboardStep(0);
          setShowOnboarding(true);
        }
      }} showOnboarding={showOnboarding} onboardStep={onboardStep} onNextOnboard={dir=>{ const next=onboardStep+(dir??1); if(next>=ONBOARD_STEPS.length){ setShowOnboarding(false);setOnboardingDone(true); } else if(next<0){ setOnboardStep(0); } else { setOnboardStep(next); } }} onSkipOnboard={()=>{setShowOnboarding(false);setOnboardingDone(true);}} muscleFatigue={applyDecaySinceLastSession(muscleFatigue,lastFatigueTs,user?.exp||"Intermediate")} lastFatigueTs={lastFatigueTs}/>,
    workout:   <WorkoutScreen onNavigate={setScreen} program={program} onSessionComplete={handleSessionComplete} currentDayIdx={currentDayIdx} prefs={prefs}/>,
    meso:      gated("meso","Meso Builder",<MesoBuilder onNavigate={setScreen} onSaveProgram={p=>{setProgram(p);setCurrentDayIdx(0);}} user={user} prefs={prefs}/>),
    analytics: gated("analytics","Advanced Analytics",<Analytics sessions={sessions} prefs={prefs} completedMesos={completedMesos} muscleState={muscleState} muscleFatigue={applyDecaySinceLastSession(muscleFatigue,lastFatigueTs,user?.exp||"Intermediate")} muscleStateHistory={muscleStateHistory||[]} complianceHistory={complianceHistory||[]} program={program} exp={user?.exp||"Intermediate"}/>),
    library:   <ExerciseLibrary/>,
    adapt:     gated("adapt","Adaptation & Coach",<AdaptationPanel sessions={sessions} program={program} muscleState={muscleState} muscleFatigue={applyDecaySinceLastSession(muscleFatigue,lastFatigueTs,user?.exp||"Intermediate")} currentDayIdx={currentDayIdx} onProgramChange={p=>{setProgram(p);}} user={user}/>),
    profile:   <ProfileScreen user={user} onLogout={handleLogout} onDeleteAccount={handleDeleteAccount} prefs={prefs} onPrefsChange={setPrefs} tier={tier} onTierChange={setTier} sessions={sessions} onViewStats={()=>setScreen("analytics")}/>,
  };

  const bannerMsg = tier==="trial"?"Trial active — 7 days remaining. Choose a plan to keep access.":null;

  return(
    <>
      <style>{GLOBAL_CSS}</style>
      <style>{PHONE_FRAME_CSS}</style>
      <div className="pf-outer">
        <div className="pf-notch"/>
        <div className="pf-screen">
        <div style={{width:"100%",minHeight:"100%",display:"flex",flexDirection:"column",background:T.bg,position:"relative"}}>
        <ToastContainer/>

        {/* Top bar */}
        <header style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"13px 20px 10px",borderBottom:`1px solid ${T.border}`,position:"sticky",top:0,background:`${T.bg}f0`,backdropFilter:"blur(20px)",zIndex:100}}>
          <div style={{display:"flex",alignItems:"center",gap:T.sp2}}>
            <IACMark size={27} variant="athlete"/>
            <span style={{fontWeight:700,fontSize:15,letterSpacing:"-0.01em"}}>Iron <span style={{color:T.accent}}>Coach</span></span>
          </div>
          <nav aria-label="Utility navigation" style={{display:"flex",gap:6,alignItems:"center"}}>
            {(screen==="profile"||screen==="analytics")&&(
              <button aria-label="Back to dashboard" onClick={()=>setScreen("dashboard")}
                style={{background:"none",border:"none",color:T.textSec,cursor:"pointer",fontSize:13,padding:"4px 8px",minHeight:44,display:"flex",alignItems:"center"}}>
                ← Back
              </button>
            )}
            {screen!=="analytics"&&(
              <button
                aria-label="View analytics"
                onClick={()=>setScreen("analytics")}
                style={{height:36,borderRadius:12,background:T.bgRaise,border:`1px solid ${T.border}`,cursor:"pointer",fontSize:10,fontWeight:600,color:T.textSec,padding:"0 10px",letterSpacing:"0.04em",textTransform:"uppercase"}}>
                Stats
              </button>
            )}
            <button
              aria-label="Open profile and settings"
              onClick={()=>setScreen("profile")}
              style={{width:40,height:40,borderRadius:12,background:screen==="profile"?`${T.accent}18`:T.bgRaise,border:`1px solid ${screen==="profile"?T.accent:T.border}`,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:5,padding:0}}>
              {[0,1,2].map(i=>(
                <span key={i} style={{display:"block",width:i===1?12:16,height:2,borderRadius:2,background:screen==="profile"?T.accent:T.textSec,transition:"all 0.15s"}}/>
              ))}
            </button>
          </nav>
        </header>

        {bannerMsg&&(
          <div style={{background:`${T.teal}15`,borderBottom:`1px solid ${T.teal}30`,padding:"8px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{fontSize:11,color:T.teal,lineHeight:1.4}}>{bannerMsg}</div>
            <button
              aria-label="Open coach profile" onClick={()=>setScreen("profile")} style={{background:T.teal,border:"none",borderRadius:8,padding:"4px 10px",fontSize:10,fontWeight:700,color:"#000",cursor:"pointer",flexShrink:0,marginLeft:8}}>Upgrade</button>
          </div>
        )}

        <main
          ref={mainRef}
          id="main-content"
          tabIndex={0}
          onMouseEnter={()=>mainRef.current?.focus({preventScroll:true})}
          style={{flex:1,overflowY:"auto",padding:"15px 15px 0",outline:"none",WebkitOverflowScrolling:"touch"}}
          aria-label={`${NAV_ITEMS.find(n=>n.id===screen)?.label||screen} screen`}
        >
          {/* All screens rendered simultaneously — display:none on inactive ones
              preserves state (logged sets, rest timer, elapsed time) across tab switches */}
          {Object.entries(screens).map(([id,el])=>(
            <div key={id} style={{display:screen===id?"block":"none"}}>
              {el}
              {screen===id&&<div style={{height:90}}/>}
            </div>
          ))}
        </main>

        <BottomNav current={showInNav.includes(screen)?screen:""} onNavigate={setScreen} navRef={navRef}
          badges={{
            adapt: (()=>{
              // coachNotes is kept in state by the AdaptationPanel polling effect
              // Use the athlete's sessions-derived note count from state
              try{
                let read=[]; try{ read=JSON.parse(localStorage.getItem("ironcoach_readnotes")||"[]"); }catch(e){}
                const notes = user?._coachNoteCount || 0;
                return notes;
              }catch(e){ return 0; }
            })(),
          }}
        />
        </div>
        </div>
      </div>
    </>
  );
}


// Mount the app
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));

  </script>

  <script>
    // Loading screen is hidden by the App component after React mounts
    // This prevents the black screen caused by timer firing before Babel compiles
    window._hideLoading = function() {
      var l = document.getElementById('loading');
      if(l){ l.style.opacity='0'; setTimeout(function(){ l.style.display='none'; },300); }
    };
  </script>
</body>
</html>
